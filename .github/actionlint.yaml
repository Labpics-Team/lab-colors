# Тяжёлые Linux jobs используют стабильные метки self-hosted, Linux, X64.
# Платформенные jobs и лёгкие publisher/attestation сохраняют свой OS/trust contract.
paths:
  .github/workflows/mutation.yml:
    # actionlint 1.7.12 отстаёт от текущей GitHub-схемы concurrency.queue;
    # узкое исключение удаляется, когда линтер начнёт принимать `queue: max`.
    ignore:
      - 'unexpected key "queue" for "concurrency" section'
