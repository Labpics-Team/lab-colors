name: P1 final cleanup

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.number == 370
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: agent/p1-correct-rebuild
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.96.0
          components: rustfmt,clippy
      - name: remove obsolete aliases and repair contract test
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def replace(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text()
              if old not in text:
                  raise SystemExit(f"expected text missing in {path}: {old[:100]!r}")
              file.write_text(text.replace(old, new, 1))

          exposure = Path("crates/labcolors-core/src/exposure_support.rs")
          text = exposure.read_text()
          text, count = re.subn(
              r"\n/// WCAG-люминанс \(Rec\.709\) кодированного 8-битного цвета\.\npub\(crate\) fn wcag_y\(rgb: \[u8; 3\]\) -> f64 \{.*?\n\}\n",
              "\n",
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit("wcag_y removal did not match exactly once")
          exposure.write_text(text)

          joint = Path("crates/labcolors-core/src/joint.rs")
          text = joint.read_text()
          method = "\n    pub(crate) const fn ordinal(&self) -> CandidateOrdinalV1 {\n        self.ordinal\n    }\n"
          if method not in text:
              raise SystemExit("candidate ordinal compatibility accessor missing")
          text = text.replace(method, "\n", 1)
          for name in [
              "JointConstraintCellV1",
              "FullHardReportV1",
              "NonEmptyFeasibleJointTuplesV1",
              "SelectedJointTupleV1",
              "SelectedRecheckErrorV1",
              "FreshJointRecheckV1",
              "RevisionBoundVerifiedSelectionV1",
          ]:
              pattern = rf"\npub\(crate\) type {name}\s*=\s*[^;]+;\n"
              text, count = re.subn(pattern, "\n", text, count=1, flags=re.S)
              if count != 1:
                  raise SystemExit(f"alias {name} removal did not match exactly once")
          joint.write_text(text)

          semantic = Path("crates/labcolors-core/src/semantic.rs")
          text = semantic.read_text()
          old_invalid = "            pair(0.5, 0.5, f64::INFINITY),\n"
          if old_invalid not in text:
              raise SystemExit("Pair invalid-list anchor missing")
          text = text.replace(
              old_invalid,
              old_invalid + "            pair(0.5, 0.25, 1.0),\n",
              1,
          )
          old_valid = "            pair(0.5, 0.25, 1.0),\n"
          first = text.find(old_valid)
          second = text.find(old_valid, first + 1)
          if first < 0 or second < 0:
              raise SystemExit("expected inserted invalid and legacy valid Pair rows")
          text = text[:second] + text[second:].replace(old_valid, "            pair(0.5, 1.0, 1.0),\n", 1)
          semantic.write_text(text)
          PY
          cargo fmt --all
      - name: validate workspace
        shell: bash
        run: |
          set +e
          cargo test --workspace --locked --message-format=short > /tmp/p1-test.log 2>&1
          test_status=$?
          cargo clippy --workspace --all-targets --locked --message-format=short -- -D warnings > /tmp/p1-clippy.log 2>&1
          clippy_status=$?
          set -e
          printf '%s\n' "$test_status" > /tmp/p1-test-status.txt
          printf '%s\n' "$clippy_status" > /tmp/p1-clippy-status.txt
      - name: commit final cleanup
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/agent-p1-final-cleanup.yml
          git add -A
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git commit -m 'P1: remove obsolete exact-only aliases'
          git push origin HEAD:agent/p1-correct-rebuild
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p1-final-cleanup-diagnostics
          path: |
            /tmp/p1-test.log
            /tmp/p1-test-status.txt
            /tmp/p1-clippy.log
            /tmp/p1-clippy-status.txt
          if-no-files-found: error
          retention-days: 1
