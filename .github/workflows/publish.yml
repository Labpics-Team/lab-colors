# Публикация @labpics/colors в npm по тегу colors-vX.Y.Z.
#
# БЕЗ ТОКЕНОВ: аутентификация — Trusted Publishing (OIDC): npm доверяет
# именно этому workflow этого репозитория (настройка — страница пакета
# npmjs.com → Settings → Trusted publishing; привязка включает environment
# npm-publish — второй фактор доверия поверх имени workflow). Требования
# OIDC: npm ≥ 11.5.1, Node ≥ 22.14 — Node 24 несёт npm 11.x из коробки.
#
# Provenance-аттестация ОТКЛЮЧЕНА (package.json publishConfig.provenance:false):
# npm выдаёт sigstore-provenance ТОЛЬКО публичным репозиториям (E422 на
# приватном). При открытии lab-colors публично — вернуть provenance:true
# (аттестация «собрано этим workflow из этого репо» усилит сигналы Socket).
#
# Self-hosted раннер — ВРЕМЕННО, по решению владельца (2026-07-04): публикация
# 0.6.0 не стартовала на github-hosted («account payments have failed»,
# run 28689086170), платные минуты закрыты.
#
# Границы гарда «тег достижим из origin/main» (честно, по ревью):
# — закрывает: rogue-тег, переиспользующий ЭТОТ workflow, — код вне истории
#   main (PR-only + зелёный CI) отклоняется до любых установок из сети;
# — НЕ закрывает: тег на коммит с переписанным publish.yml (событие тега
#   исполняет workflow из коммита тега). Полный гейт — required reviewers
#   на environment npm-publish — на текущем биллинг-плане НЕДОСТУПЕН
#   (HTTP 422 при попытке включить, 2026-07-04).
# Почему это не расширение поверхности: (а) ci.yml уже исполняет произвольный
# код ЛЮБОЙ ветки write-холдера на том же self-hosted раннере — крафт-тег не
# добавляет нового; (б) вектор «крафт-publish.yml + OIDC-паблиш» существовал
# и на github-hosted. Дельта self-hosted-перехода = 0 при текущем круге write
# (владелец + агент). Остаточный класс — co-tenancy de-02; закрывается
# выделенным CI-узлом (эпик изоляции раннеров). Вернуть github-hosted /
# включить required reviewers, когда починен биллинг.
#
# Гард «версия пакета == тег» стоит ДО любых установок из сети: fail-fast
# на расхождении, публикация «тег v0.2.0 / пакет 0.1.0» невозможна.
name: publish

on:
  push:
    tags: ["colors-v*"]

env:
  RUST_TOOLCHAIN: "1.96.0"

permissions:
  contents: read
  id-token: write # OIDC для Trusted Publishing

jobs:
  publish:
    runs-on: [self-hosted, Linux, X64]
    environment: npm-publish
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          # Полная история: гард ниже проверяет достижимость тега из main
          # через merge-base, shallow-клон дал бы ложный отказ.
          fetch-depth: 0
      - name: гард — тег из истории main (anti-rogue-tag, до установок из сети)
        run: |
          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "тег $GITHUB_REF_NAME указывает вне истории origin/main — публикация запрещена" >&2
            exit 1
          fi
      - name: версия пакета == тег (fail-fast, до установок из сети)
        working-directory: packages/colors
        run: |
          tag="${GITHUB_REF_NAME#colors-v}"
          version="$(node -p "require('./package.json').version")"
          if [ "$tag" != "$version" ]; then
            echo "тег colors-v$tag != package.json $version" >&2
            exit 1
          fi
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master @ 2026-03-27 (у action нет релизных тегов; бамп сверять с историей master)
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: install wasm-pack
        run: cargo install wasm-pack --version 0.13.1 --locked
      - name: wasm-pack build (release)
        # Тот же артефакт, что гейтится в ci.yml (panic=abort, wasm-opt -Oz).
        run: wasm-pack build crates/labcolors-wasm --release --target web --out-dir ../../packages/colors/pkg --out-name labcolors
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
      - name: гейт перед публикацией — typecheck + runtime-тесты пакета
        working-directory: packages/colors
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: npm publish (OIDC, без токена)
        working-directory: packages/colors
        run: npm publish
