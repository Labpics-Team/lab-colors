name: publish

# Тонкий caller: только триггер по тегу, concurrency и права. Гейты каноничных
# CI-прогонов, проверка byte-exact артефакта и сама публикация закреплены в
# immutable publish-worker.yml на полном commit SHA — проверяемые job'ы
# исполняются на одноразовых эфемерных GitHub-hosted VM без секретов и общего
# состояния. Своих inputs у worker нет by design.
#
# `environment: npm-publish` объявлен НА JOB'Е ВНУТРИ worker'а, а не здесь: job с
# `uses:` не поддерживает ключ `environment`; объявление внутри reusable-worker
# заставляет GitHub резолвить его собственный environment-секрет NPM_TOKEN.
# Caller secrets не наследуются: worker не должен получать весь repo/org secret set.

concurrency:
  group: npm-publish
  cancel-in-progress: false

on:
  push:
    tags: ["colors-v*"]

permissions:
  contents: read
  actions: read

jobs:
  worker:
    name: publish
    permissions:
      contents: read
      actions: read
    uses: Labpics-Team/lab-colors/.github/workflows/publish-worker.yml@1461bc2ed60142aed3a8723e618b883be6418156
