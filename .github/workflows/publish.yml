name: publish

# Тег и выбранный worker защищённого main должны обозначать один commit.
# Продвижение main после выбора worker допустимо; тег на прежний commit
# после выбора другой редакции worker требует нового проверенного релиза.
# Доверенная OIDC-идентичность существует только в job публикации,
# а не у сборки, проверки архива или consumer readback.

concurrency:
  group: npm-publish
  cancel-in-progress: false

on:
  push:
    tags: ["colors-v*"]

permissions:
  contents: read
  actions: read

jobs:
  worker:
    name: publish
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: Labpics-Team/lab-colors/.github/workflows/publish-worker.yml@main
