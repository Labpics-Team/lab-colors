name: publish

# Тонкий caller: триггер по тегу, concurrency и права. Локальный uses выбирает
# publish-worker.yml из того же коммита, поэтому squash не оставляет публикацию
# на старом release-контракте. Гейты CI и byte-exact артефакта проверяются вместе
# с этим snapshot; worker не принимает inputs и исполняется на эфемерной VM.
#
# `environment: npm-publish` объявлен НА JOB'Е ВНУТРИ worker'а, а не здесь: job с
# `uses:` не поддерживает ключ `environment`; объявление внутри reusable-worker
# заставляет GitHub резолвить его собственный environment-секрет NPM_TOKEN.
# Caller secrets не наследуются: worker не должен получать весь repo/org secret set.

concurrency:
  group: npm-publish
  cancel-in-progress: false

on:
  push:
    tags: ["colors-v*"]

permissions:
  contents: read
  actions: read

jobs:
  worker:
    name: publish
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/publish-worker.yml
