name: publish

# Публикация по тегу использует worker из того же Git-снимка.
# Доверенная OIDC-идентичность существует только в job публикации,
# а не у сборки, проверки архива или consumer readback.

concurrency:
  group: npm-publish
  cancel-in-progress: false

on:
  push:
    tags: ["colors-v*"]

permissions:
  contents: read
  actions: read

jobs:
  worker:
    name: publish
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/publish-worker.yml
