name: publish

# Тонкий caller: только триггер по тегу, concurrency и права. Гейты каноничных
# CI-прогонов, проверка byte-exact артефакта и сама публикация закреплены в
# immutable publish-worker.yml на полном commit SHA — runner-group ACL допускает
# в одноразовую gVisor-ячейку DE-02 только jobs из закреплённых worker'ов.
# Своих inputs у worker нет by design.
#
# `environment: npm-publish` объявлен НА JOB'Е ВНУТРИ worker'а, а не здесь: job с
# `uses:` не поддерживает ключ `environment` (допустимы только name/needs/if/
# permissions/uses/with/secrets/strategy/concurrency), и именно объявление внутри
# reusable-воркфлоу заставляет GitHub резолвить environment-секрет NPM_TOKEN.

concurrency:
  group: npm-publish
  cancel-in-progress: false

on:
  push:
    tags: ["colors-v*"]

permissions:
  contents: read
  actions: read

jobs:
  worker:
    name: publish
    permissions:
      contents: read
      actions: read
    uses: Labpics-Team/lab-colors/.github/workflows/publish-worker.yml@7de5904d7404e9c008ff997a12d7fd852e957775
    # Обязателен: publish-step читает NPM_TOKEN из environment `npm-publish`,
    # который объявлен на job'е worker'а. Без inherit секрет туда не доедет.
    secrets: inherit
