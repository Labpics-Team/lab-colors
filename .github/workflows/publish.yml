name: publish

# Тонкий caller: только триггер по тегу, concurrency и права. Гейты каноничных
# CI-прогонов, проверка byte-exact артефакта и сама публикация закреплены в
# immutable publish-worker.yml на полном commit SHA — runner-group ACL допускает
# в одноразовую gVisor-ячейку DE-02 только jobs из закреплённых worker'ов.
# Своих inputs у worker нет by design.
#
# `environment: npm-publish` объявлен НА JOB'Е ВНУТРИ worker'а, а не здесь: job с
# `uses:` не поддерживает ключ `environment`; объявление внутри reusable-worker
# заставляет GitHub резолвить его собственный environment-секрет NPM_TOKEN.
# Caller secrets не наследуются: worker не должен получать весь repo/org secret set.

concurrency:
  group: npm-publish
  cancel-in-progress: false

on:
  push:
    tags: ["colors-v*"]

permissions:
  contents: read
  actions: read

jobs:
  worker:
    name: publish
    permissions:
      contents: read
      actions: read
    uses: Labpics-Team/lab-colors/.github/workflows/publish-worker.yml@b2c7d66786eb6a988ee9e6563a53cbb2b44ae25b
