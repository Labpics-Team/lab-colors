name: publish

# Публикация по тегу использует worker из того же Git-снимка.
# Caller передаёт только NPM_TOKEN. Значение выбирает npm-publish environment
# внутри задания публикации; сборка и проверка опубликованного пакета его не получают.

concurrency:
  group: npm-publish
  cancel-in-progress: false

on:
  push:
    tags: ["colors-v*"]

permissions:
  contents: read
  actions: read

jobs:
  worker:
    name: publish
    permissions:
      contents: read
      actions: read
    uses: ./.github/workflows/publish-worker.yml
    secrets:
      NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
