name: publish

concurrency:
  group: npm-publish
  cancel-in-progress: false

on:
  push:
    tags: ["colors-v*"]

permissions:
  contents: read
  actions: read

jobs:
  worker:
    name: publish
    permissions:
      contents: read
      actions: read
      id-token: write
    uses: ./.github/workflows/publish-worker.yml
