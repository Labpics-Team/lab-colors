name: Full-domain corpus probe

on:
  workflow_dispatch:
    inputs:
      points:
        description: bounded ordinal prefix of the full domain to replay
        required: false
        default: "65536"
      shard_points:
        description: shard window width (multiple of the packing alignment)
        required: false
        default: "16384"
      window_start:
        description: lane window start ordinal (empty keeps the bounded probe)
        required: false
        default: ""
      window_points:
        description: lane window width (packing-aligned multiple of shard_points)
        required: false
        default: ""
      expect_lanes:
        description: >-
          lanes in the full-domain campaign this dispatch belongs to
          (2^24 / window_points, or 0 for a dispatch that is not a lane)
        # The coordinator's `--expect-lanes` lives in the coordinator, so a
        # checkout older than that flag carries the older contract whole:
        # this project has twice turned one mistake into a campaign — 133
        # runs, then 69 — while reading rules the running copy did not have.
        # No guard added to the client protects a stale client.  Declared
        # required and without a default, this coordinate is refused by
        # GitHub before a run exists, so a coordinator that does not know it
        # cannot dispatch at all, and one that does has to state the scale
        # of what it is about to start.
        required: true
      lane_run_ids:
        description: comma-separated lane run ids to assemble (empty skips assembly)
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: full-domain-corpus-probe-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  source-admission:
    name: source admission (full-domain-corpus)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      head_sha: ${{ steps.identity.outputs.head_sha }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
      caller_sha: ${{ steps.identity.outputs.caller_sha }}
      recipe_sha: ${{ steps.identity.outputs.recipe_sha }}
      recipe_ref: ${{ steps.identity.outputs.recipe_ref }}
      recipe_path: ${{ steps.identity.outputs.recipe_path }}
      run_id: ${{ steps.identity.outputs.run_id }}
      run_attempt: ${{ steps.identity.outputs.run_attempt }}
    steps:
      - name: Require owned source and native recipe identity
        id: identity
        shell: bash
        env:
          CI_REPOSITORY: ${{ github.repository }}
          CI_REPOSITORY_ID: ${{ github.repository_id }}
          CI_SOURCE_SHA: ${{ github.sha }}
          CI_CALLER_SHA: ${{ github.workflow_sha }}
          CI_NATIVE_JOB: ${{ toJSON(job) }}
          CI_EVENT: ${{ github.event_name }}
          CI_REF: ${{ github.ref }}
          CI_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          CI_HEAD_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_RUN_ID: ${{ github.run_id }}
          CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          CI_RUNNER_OS: ${{ runner.os }}
          CI_RUNNER_ARCH: ${{ runner.arch }}
          CI_RUNNER_NAME: ${{ runner.name }}
          CI_EXPECTED_RECIPE_PATH: .github/workflows/full-domain-corpus.yml
          CI_REQUIRED_RUNNER_ENVIRONMENT: self-hosted
        run: |
          python3 - <<'PY'
          import json, os, sys
          def validate_owned_source(environment):
              """Служебные поля GitHub определяют источник; вход вызывающего файла не выдаёт полномочия."""
              import json, re

              def required(name):
                  value = environment.get(name, "")
                  if not isinstance(value, str) or not value:
                      raise ValueError("INCOMPLETE: missing native " + name)
                  return value

              def sha(name):
                  value = required(name)
                  if re.fullmatch(r"[0-9a-f]{40}", value) is None or value == "0" * 40:
                      raise ValueError("INCOMPLETE: invalid native " + name)
                  return value

              if environment.get("GITHUB_ACTIONS") != "true":
                  raise ValueError("INCOMPLETE: native GitHub Actions context is required")
              repository = required("CI_REPOSITORY")
              repository_id = required("CI_REPOSITORY_ID")
              if repository != "Labpics-Team/lab-colors" or repository_id != "1221255339":
                  raise ValueError("REFUSED: source repository is outside the owned scope")

              try:
                  native_job = json.loads(required("CI_NATIVE_JOB"))
              except (ValueError, TypeError) as error:
                  raise ValueError("INCOMPLETE: invalid native job context") from error
              if not isinstance(native_job, dict):
                  raise ValueError("INCOMPLETE: native job context is not an object")
              environment = dict(environment)
              for name, property_name in (
                  ("CI_RECIPE_SHA", "workflow_sha"),
                  ("CI_RECIPE_REF", "workflow_ref"),
                  ("CI_RECIPE_REPOSITORY", "workflow_repository"),
                  ("CI_RECIPE_PATH", "workflow_file_path"),
                  ("CI_CHECK_RUN_ID", "check_run_id"),
              ):
                  value = native_job.get(property_name)
                  if property_name == "check_run_id" and type(value) is int and value > 0:
                      value = str(value)
                  if not isinstance(value, str) or not value:
                      raise ValueError("INCOMPLETE: missing native job." + property_name)
                  environment[name] = value
              source_sha = sha("CI_SOURCE_SHA")
              caller_sha = sha("CI_CALLER_SHA")
              recipe_sha = sha("CI_RECIPE_SHA")
              recipe_repository = required("CI_RECIPE_REPOSITORY")
              recipe_path = required("CI_RECIPE_PATH")
              expected_path = required("CI_EXPECTED_RECIPE_PATH")
              recipe_ref = required("CI_RECIPE_REF")
              if recipe_repository != repository or recipe_path != expected_path:
                  raise ValueError("REFUSED: executing recipe repository or path differs")
              if re.fullmatch(r"\.github/workflows/[a-z0-9-]+\.yml", recipe_path) is None:
                  raise ValueError("REFUSED: invalid executing recipe path")
              prefix = repository + "/" + recipe_path + "@"
              if not recipe_ref.startswith(prefix) or not recipe_ref[len(prefix):]:
                  raise ValueError("INCOMPLETE: executing recipe ref is not bound to its file")

              protected_main = recipe_ref == prefix + "refs/heads/main"

              event = required("CI_EVENT")
              ref = required("CI_REF")
              if event == "pull_request":
                  head_repository = required("CI_HEAD_REPOSITORY")
                  head_id = required("CI_HEAD_REPOSITORY_ID")
                  sha("CI_HEAD_SHA")
                  if head_repository != repository or head_id != repository_id:
                      raise ValueError("REFUSED: foreign pull request head")
                  if re.fullmatch(r"refs/pull/[1-9][0-9]*/merge", ref) is None:
                      raise ValueError("REFUSED: unsupported pull request source ref")
              elif event == "merge_group":
                  if not ref.startswith("refs/heads/gh-readonly-queue/main/"):
                      raise ValueError("REFUSED: merge group is outside main")
              elif event == "push":
                  if ref != "refs/heads/main" and not ref.startswith("refs/tags/colors-v"):
                      raise ValueError("REFUSED: push is outside main or the release scope")
              elif event in ("workflow_dispatch", "schedule"):
                  if protected_main and ref != "refs/heads/main":
                      raise ValueError("REFUSED: manual or scheduled source is outside main")
                  if not protected_main and not ref.startswith("refs/heads/"):
                      raise ValueError("REFUSED: bootstrap source is not an owned branch")
              else:
                  raise ValueError("REFUSED: unsupported source event")

              runner_environment = required("CI_RUNNER_ENVIRONMENT")
              runner_os = required("CI_RUNNER_OS")
              runner_arch = required("CI_RUNNER_ARCH")
              runner_name = required("CI_RUNNER_NAME")
              expected_environment = required("CI_REQUIRED_RUNNER_ENVIRONMENT")
              if runner_environment not in ("self-hosted", "github-hosted"):
                  raise ValueError("INCOMPLETE: unknown runner environment")
              if expected_environment not in ("any", "self-hosted", "github-hosted"):
                  raise ValueError("REFUSED: unknown execution requirement")
              if expected_environment != "any" and runner_environment != expected_environment:
                  raise ValueError("REFUSED: required runner environment is unavailable")
              for name in ("CI_RUN_ID", "CI_RUN_ATTEMPT", "CI_CHECK_RUN_ID"):
                  if re.fullmatch(r"[1-9][0-9]*", required(name)) is None:
                      raise ValueError("INCOMPLETE: invalid native " + name)
              if protected_main:
                  if event in ("push", "workflow_dispatch", "schedule") and recipe_sha != source_sha:
                      raise ValueError("REFUSED: exact main or release recipe has not executed")
              elif not source_sha == caller_sha == recipe_sha:
                  # Допуск конкретного FULLSHA принадлежит native Listener, а не этому
                  # guard. Здесь разрешённый snapshot не вправе подменять свою identity.
                  raise ValueError("REFUSED: admitted snapshot differs from source or caller")
              binding = {
                  "source_sha": source_sha,
                  "head_sha": environment.get("CI_HEAD_SHA", "") if event == "pull_request" else "",
                  "caller_sha": caller_sha,
                  "recipe_sha": recipe_sha,
                  "recipe_ref": recipe_ref,
                  "recipe_repository": recipe_repository,
                  "recipe_path": recipe_path,
                  "runner_environment": runner_environment,
                  "runner_os": runner_os,
                  "runner_arch": runner_arch,
                  "runner_name": runner_name,
                  "run_id": environment["CI_RUN_ID"],
                  "run_attempt": environment["CI_RUN_ATTEMPT"],
                  "check_run_id": environment["CI_CHECK_RUN_ID"],
                  "identity_relation": "same-revision" if source_sha == recipe_sha else "distinct-revisions",
              }
              for key, value in binding.items():
                  if re.search(r"[\x00-\x1f\x7f]", value) is not None:
                      raise ValueError("REFUSED: control character in native " + key)
              return binding
          try:
              binding = validate_owned_source(os.environ)
          except ValueError as error:
              raise SystemExit(str(error))
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for key, value in binding.items():
                  output.write('CI_BOUND_' + key.upper() + '=' + value + '\n')
              output.write('CI_VERIFIED_SOURCE_SHA=' + binding['source_sha'] + '\n')
              output.write('CI_VERIFIED_CALLER_SHA=' + binding['caller_sha'] + '\n')
              output.write('CI_VERIFIED_RECIPE_SHA=' + binding['recipe_sha'] + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              for key, value in binding.items():
                  output.write(key + '=' + value + '\n')
          print(json.dumps(binding, sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write('Source ' + binding['source_sha'] + '\n\nCaller ' + binding['caller_sha'] + '\n\nExecuting recipe ' + binding['recipe_sha'] + '\n\nIdentity relation ' + binding['identity_relation'] + '\n')
          PY

  shard-probe:
    needs: ["source-admission"]
    name: bounded full-domain shard probe
    # Только workflow_dispatch: полный проход 2^24 — отдельное долгое задание.
    # Probe проверяет потоковую обработку шардов на ограниченном префиксе
    # точного полного manifest на self-hosted runner.
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 120
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
    steps:
      - name: Require declared execution environment
        shell: bash
        env:
          ACTUAL_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          test "$ACTUAL_RUNNER_ENVIRONMENT" = self-hosted || { echo 'REFUSED: required runner environment is unavailable' >&2; exit 1; }
      # First, and before the checkout on purpose: a dispatch whose
      # coordinates cannot describe a lane of the cover must cost nothing,
      # and this guard must not be a copy of the repository whose age is
      # exactly what is in doubt.  Everything it reads is declared on the
      # step itself, so the guard is one self-contained object to review.
      - name: refuse a dispatch that does not belong to a coherent campaign
        shell: bash
        env:
          WINDOW_START: ${{ inputs.window_start }}
          WINDOW_POINTS: ${{ inputs.window_points }}
          EXPECT_LANES: ${{ inputs.expect_lanes }}
          POINTS: ${{ inputs.points }}
          SHARD_POINTS: ${{ inputs.shard_points }}
        run: |
          set -euo pipefail
          # Arithmetic, not a token: a lane is admissible only if its own
          # width tiles the full sRGB8 domain exactly into the campaign the
          # dispatcher claims.  An older coordinator cannot satisfy this by
          # accident, and nothing here needs the repository to be read.
          domain=16777216
          # Отклонение до checkout исключает запуск с чужими shell-координатами.
          for coordinate in POINTS SHARD_POINTS; do
            case "${!coordinate}" in
              ''|*[!0-9]*|0*) echo "${coordinate} must be a positive canonical decimal" >&2; exit 64;;
            esac
            value="${!coordinate}"
            if [ "${#value}" -gt 8 ] || [ "${value}" -gt "${domain}" ]; then
              echo "${coordinate} exceeds the full domain" >&2
              exit 64
            fi
          done
          # `case` compares raw bytes.  `[ -eq ]` and Python's `int()` both
          # accept surrounding whitespace, so either would admit a
          # coordinate carrying the carriage return a Windows shell leaves
          # behind; and `$(( ))` reads a leading zero as octal, so `0200000`
          # would be 65536 here and 200000 in the lane runner — one dispatch
          # describing two different windows, the guard's arithmetic then
          # saying nothing about the window that actually replays.
          case "${EXPECT_LANES}" in
            ''|*[!0-9]*) echo "expect_lanes must be a canonical decimal" >&2; exit 64;;
          esac
          if [ -z "${WINDOW_POINTS}" ]; then
            # No window is the bounded prefix probe, which is not a lane of
            # any cover: the only campaign size true of it is none.  A
            # dispatch that claims a campaign and carries no window would
            # run that same bounded probe once per lane and report every one
            # of them green.
            if [ "${EXPECT_LANES}" != "0" ]; then
              echo "a dispatch without window_points is the bounded probe and" \
                   "belongs to no campaign: expect_lanes must be 0" >&2
              exit 64
            fi
            if [ -n "${WINDOW_START}" ]; then
              echo "window_start ${WINDOW_START} names a lane, and a lane needs" \
                   "window_points: this dispatch would replay the bounded probe" >&2
              exit 64
            fi
            exit 0
          fi
          case "${WINDOW_POINTS}" in
            ''|*[!0-9]*|0) echo "window_points must be a positive integer" >&2; exit 64;;
            0*) echo "window_points must not carry leading zeros" >&2; exit 64;;
          esac
          case "${WINDOW_START}" in
            ''|*[!0-9]*) echo "window_start must be a canonical decimal" >&2; exit 64;;
            0) ;;
            0*) echo "window_start must not carry leading zeros" >&2; exit 64;;
          esac
          # Both coordinates are bounded by the domain and the domain is
          # eight digits, so anything longer is out of range by
          # construction — and it has to be refused before the arithmetic
          # rather than by it: `$(( ))` wraps silently at 2^64, where
          # `18446744073709551616` reads as a perfectly aligned zero, and
          # `[ -ge ]` answers "not greater" for a value it cannot parse.
          if [ "${#WINDOW_POINTS}" -gt 8 ] || [ "${#WINDOW_START}" -gt 8 ]; then
            echo "window ${WINDOW_START}+${WINDOW_POINTS} is outside the sRGB8 domain" >&2
            exit 64
          fi
          if [ $(( domain % WINDOW_POINTS )) -ne 0 ]; then
            echo "window_points ${WINDOW_POINTS} does not tile the full domain" >&2
            exit 64
          fi
          lanes=$(( domain / WINDOW_POINTS ))
          # Compared as bytes, because both sides are canonical decimals by
          # now and a numeric comparison is the one that can answer "equal"
          # about something it failed to read.
          if [ "${lanes}" != "${EXPECT_LANES}" ]; then
            echo "campaign size ${EXPECT_LANES} contradicts the plan: a" \
                 "${WINDOW_POINTS}-point window covers the domain in ${lanes} lanes" >&2
            exit 64
          fi
          if [ "${WINDOW_START}" -ge "${domain}" ]; then
            echo "window_start ${WINDOW_START} is outside the sRGB8 domain" >&2
            exit 64
          fi
          if [ $(( WINDOW_START % WINDOW_POINTS )) -ne 0 ]; then
            echo "window_start ${WINDOW_START} is not a seam of a" \
                 "${WINDOW_POINTS}-point cover" >&2
            exit 64
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.source-admission.outputs.source_sha }}

      - name: replay the bounded full-domain prefix through the shard runner
        if: inputs.window_points == ''
        shell: bash
        env:
          POINTS: ${{ inputs.points }}
          SHARD_POINTS: ${{ inputs.shard_points }}
        run: |
          set -euo pipefail
          python3 proof/region/v1/corpus_probe.py \
            --points "${POINTS}" \
            --shard-points "${SHARD_POINTS}"

      - name: replay one full-domain window lane
        if: inputs.window_points != ''
        shell: bash
        env:
          WINDOW_START: ${{ inputs.window_start }}
          WINDOW_POINTS: ${{ inputs.window_points }}
          SHARD_POINTS: ${{ inputs.shard_points }}
        run: |
          set -euo pipefail
          python3 proof/region/v1/corpus_lane.py \
            --window-start "${WINDOW_START}" \
            --window-points "${WINDOW_POINTS}" \
            --shard-points "${SHARD_POINTS}" \
            --out lane-out

      - name: upload the lane wire evidence
        if: inputs.window_points != ''
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: corpus-lane-${{ inputs.window_start }}-${{ inputs.window_points }}
          path: lane-out/
          if-no-files-found: error

  assemble-lanes:
    needs: ["source-admission"]
    name: assemble the full-domain transcript from lane evidence
    # Dispatch-only: downloads the lane wire evidence of the listed lane runs
    # and refuses anything that does not cover the exact full domain.
    if: inputs.lane_run_ids != ''
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 120
    permissions:
      contents: read
      # Required by `gh run download` when fetching lane artifacts from other runs.
      actions: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
      LANE_RUN_IDS: ${{ inputs.lane_run_ids }}
    steps:
      - name: Require declared execution environment
        shell: bash
        env:
          ACTUAL_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          test "$ACTUAL_RUNNER_ENVIRONMENT" = self-hosted || { echo 'REFUSED: required runner environment is unavailable' >&2; exit 1; }
      - name: refuse a malformed lane run list before checkout
        # Read-only admission: некорректный список run id отклоняется до checkout
        # и любого обращения к API. Проверка внутри download-шага остаётся как
        # вторая линия для того же инварианта.
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$LANE_RUN_IDS" =~ ^[[:blank:]]*[1-9][0-9]*[[:blank:]]*(,[[:blank:]]*[1-9][0-9]*[[:blank:]]*)*$ ]]; then
            echo "lane run ids must be positive canonical decimals" >&2
            exit 64
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.source-admission.outputs.source_sha }}

      - name: download the lane wire evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          # Вся строка проверяется до первого обращения к API.
          if [[ ! "$LANE_RUN_IDS" =~ ^[[:blank:]]*[1-9][0-9]*[[:blank:]]*(,[[:blank:]]*[1-9][0-9]*[[:blank:]]*)*$ ]]; then
            echo "lane run ids must be positive canonical decimals" >&2
            exit 64
          fi
          mkdir -p lanes
          IFS=',' read -r -a RUNS <<< "${LANE_RUN_IDS}"
          for run in "${RUNS[@]}"; do
            run="$(echo "${run}" | tr -d '[:space:]')"
            gh run download "${run}" \
              --repo '${{ github.repository }}' \
              --pattern 'corpus-lane-*' \
              --dir lanes
          done

      - name: assemble the full-domain transcript
        shell: bash
        run: |
          set -euo pipefail
          python3 proof/region/v1/corpus_assembly.py \
            --lanes-root lanes \
            --out assembly-out

      - name: upload the assembly receipt
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: corpus-assembly-receipt
          path: assembly-out/
          if-no-files-found: error
