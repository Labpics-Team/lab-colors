name: FV-01 guarded scenario SSOT patch

on:
  push:
    branches:
      - r12/fv-01-attached-materialization-authority

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: r12/fv-01-attached-materialization-authority
          fetch-depth: 2
      - name: Publish read-only scenario projection
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/labcolors-core/src/program_wire/runtime.rs')
          text = path.read_text()
          start = text.find('impl ProgramScenarioV1 {')
          stop = text.find('\n/// Lifecycle-', start)
          if start < 0 or stop < 0:
              raise SystemExit('ProgramScenarioV1 anchors changed')
          end = text.rfind('\n}', start, stop)
          if end < 0:
              raise SystemExit('ProgramScenarioV1 impl end changed')
          body = text[start:end]
          if 'pub const fn id(&self)' in body or 'pub fn surfaces(&self)' in body:
              raise SystemExit('ProgramScenarioV1 getters already exist')
          getters = "\n\n    /// Opaque scenario provenance ID.\n    #[must_use]\n    pub const fn id(&self) -> u32 {\n        self.id\n    }\n\n    /// Surface values in compiled schema order.\n    #[must_use]\n    pub fn surfaces(&self) -> &[crate::Srgb8] {\n        &self.surfaces\n    }\n"
          path.write_text(text[:end] + getters + text[end:])
          PY
          cargo fmt --all
          rm .github/workflows/fv01-attached-update-patch.yml
      - name: Commit scenario SSOT patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/labcolors-core/src/program_wire/runtime.rs .github/workflows/fv01-attached-update-patch.yml
          git diff --cached --check
          git commit -m "refactor(fv-01): reuse Program scenario DTO"
          git push origin HEAD:r12/fv-01-attached-materialization-authority
