name: FV-01 guarded attached update patch

on:
  push:
    branches:
      - r12/fv-01-attached-materialization-authority

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: r12/fv-01-attached-materialization-authority
          fetch-depth: 2
      - name: Connect public attached update to the existing transaction
        shell: bash
        run: |
          python3 - <<'PY'
          import base64
          from pathlib import Path

          def decoded(value):
              return base64.b64decode(value).decode()

          runtime_path = Path('crates/labcolors-core/src/program_wire/runtime.rs')
          runtime = runtime_path.read_text()
          impl_start = runtime.find('impl ProgramScenarioV1 {')
          state_start = runtime.find('\n/// Lifecycle-', impl_start)
          if impl_start < 0 or state_start < 0:
              raise SystemExit('ProgramScenarioV1 anchors changed')
          impl_end = runtime.rfind('\n}', impl_start, state_start)
          if impl_end < 0:
              raise SystemExit('ProgramScenarioV1 impl end changed')
          impl_body = runtime[impl_start:impl_end]
          if 'pub const fn id(&self)' in impl_body or 'pub fn surfaces(&self)' in impl_body:
              raise SystemExit('ProgramScenarioV1 getters already exist')
          runtime = runtime[:impl_end] + decoded('CgovLy8gT3BhcXVlIHNjZW5hcmlvIHByb3ZlbmFuY2UgSUQuCiNbbXVzdF91c2VdCnB1YiBjb25zdCBmbiBpZCgmc2VsZikgLT4gdTMyIHsKICAgIHNlbGYuaWQKfQoKLy8vIFN1cmZhY2UgdmFsdWVzIGluIGNvbXBpbGVkIHNjaGVtYSBvcmRlci4KI1ttdXN0X3VzZV0KcHViIGZuIHN1cmZhY2VzKCZzZWxmKSAtPiAmW2NyYXRlOjpTcmdiOF0gewogICAgJnNlbGYuc3VyZmFjZXMKfQo=') + runtime[impl_end:]
          runtime_path.write_text(runtime)

          path = Path('crates/labcolors-core/src/program_wire/attached.rs')
          text = path.read_text()
          replacements = [
              ('use crate::program::attachment::fv01::{\n    AttachedPointSinkOutputIdV1, AttachedProgramAttachmentV1, attached_point_sink, owner_pin,\n};\n', 'use crate::program::attachment::fv01::{\n    AttachedPointSinkOutputIdV1, AttachedProgramAttachmentV1, attached_point_sink,\n    mint_authorities, owner_pin, validate_authority,\n};\n'),
              ('use crate::program::attachment::{\n    AttachmentCreateErrorV1, AttachmentCreateFailureV2, AuthoredPointEmissionBindingV1,\n    AuthoredPointPresentationBindingV1,\n};\n', 'use crate::program::attachment::{\n    AttachmentCreateErrorV1, AttachmentCreateFailureV2, AttachmentUpdateErrorV1,\n    AuthoredPointEmissionBindingV1, AuthoredPointPresentationBindingV1,\n};\n'),
              ('use crate::program::{\n    CompileErrorV1, OccurrenceIdV1, OutputSlotIdV1, OwnerV1, PresentationRootIdV1,\n};\n', 'use crate::program::{\n    CompileErrorV1, OccurrenceIdV1, OutputSlotIdV1, OwnerV1, PresentationRootIdV1, ScenarioV1,\n    StateKindV1, UpdateV1,\n};\n'),
              ('use super::{AttachedPointSinkAdmissionErrorV1, AttachedPointSinkHostV1};\n', 'use super::{\n    AttachedMaterializationAuthorityErrorV1, AttachedMaterializationAuthorityV1,\n    AttachedPointSinkAdmissionErrorV1, AttachedPointSinkErrorV1, AttachedPointSinkHostV1,\n    ProgramScenarioV1,\n};\n'),
          ]
          for old, new in replacements:
              if text.count(old) != 1:
                  raise SystemExit('attached import anchor changed')
              text = text.replace(old, new, 1)

          scenario_start = text.find('/// One observed physical scenario in compiled surface-input order.\n')
          compiled_marker = '/// One fully compiled Program generation capable of minting attached runtimes.\n'
          compiled_start = text.find(compiled_marker, scenario_start)
          if scenario_start < 0 or compiled_start < 0:
              raise SystemExit('duplicate scenario range anchors changed')
          text = text[:scenario_start] + text[compiled_start:]

          live_marker = '/// Live attached Program runtime for one exact host binding epoch.\n'
          live_start = text.find(live_marker)
          compile_marker = '/// Compile canonical Program wire into an owner that can create attached\n'
          compile_start = text.find(compile_marker, live_start)
          if live_start < 0 or compile_start < 0:
              raise SystemExit('live runtime anchors changed')
          if 'pub fn update_observed' in text[live_start:compile_start]:
              raise SystemExit('attached update already exists')
          text = text[:live_start] + decoded('') + text[live_start:]
          compile_start = text.find(compile_marker)
          text = text[:compile_start] + decoded('') + text[compile_start:]
          path.write_text(text)
          PY
          cargo fmt --all
          rm .github/workflows/fv01-attached-update-patch.yml
      - name: Commit guarded attached update patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/labcolors-core/src/program_wire/runtime.rs crates/labcolors-core/src/program_wire/attached.rs .github/workflows/fv01-attached-update-patch.yml
          git diff --cached --check
          git commit -m "feat(fv-01): publish attached post-commit update"
          git push origin HEAD:r12/fv-01-attached-materialization-authority
