name: package worker

# Проверка пакета и обоих consumer runtime использует одни локальные байты.
# Только выпуск версии передаёт их отдельному заданию с правом публикации.
on:
  workflow_call:
    inputs:
      program-benchmark:
        description: Compare the public Program consumer with the exact PR base
        type: boolean
        default: false
    outputs:
      node:
        description: Verified packer Node.js version
        value: ${{ jobs.wasm.outputs.node }}
      npm:
        description: Verified packer npm version
        value: ${{ jobs.wasm.outputs.npm }}
      tarball_sha256:
        description: SHA-256 of the verified npm archive
        value: ${{ jobs.wasm.outputs.tarball_sha256 }}
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: "always"
  RUST_TOOLCHAIN: "1.96.0"
  NODE_TOOLCHAIN: "24.14.0"
  NODE_CONSUMER_FLOOR: "22.11.0"
  CHROME_FOR_TESTING_VERSION: "150.0.7871.115"
  CHROME_FOR_TESTING_SHA256: "1be2db033133c5e2dd1a4e8664bf67b19a61bcf6ed28d2b00f433b3f0b4f9585"
  CHROMEDRIVER_FOR_TESTING_SHA256: "6ac3919edd107ca13d08cccc118dc83821877e504014233f171bbd94cb01a80e"

jobs:
  source-admission:
    name: source admission (package-worker)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      head_sha: ${{ steps.identity.outputs.head_sha }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
      caller_sha: ${{ steps.identity.outputs.caller_sha }}
      recipe_sha: ${{ steps.identity.outputs.recipe_sha }}
      recipe_ref: ${{ steps.identity.outputs.recipe_ref }}
      recipe_path: ${{ steps.identity.outputs.recipe_path }}
      run_id: ${{ steps.identity.outputs.run_id }}
      run_attempt: ${{ steps.identity.outputs.run_attempt }}
    steps:
      - name: Require owned source and native recipe identity
        id: identity
        shell: bash
        env:
          CI_REPOSITORY: ${{ github.repository }}
          CI_REPOSITORY_ID: ${{ github.repository_id }}
          CI_SOURCE_SHA: ${{ github.sha }}
          CI_CALLER_SHA: ${{ github.workflow_sha }}
          CI_NATIVE_JOB: ${{ toJSON(job) }}
          CI_EVENT: ${{ github.event_name }}
          CI_REF: ${{ github.ref }}
          CI_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          CI_HEAD_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_RUN_ID: ${{ github.run_id }}
          CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          CI_RUNNER_OS: ${{ runner.os }}
          CI_RUNNER_ARCH: ${{ runner.arch }}
          CI_RUNNER_NAME: ${{ runner.name }}
          CI_EXPECTED_RECIPE_PATH: .github/workflows/package-worker.yml
          CI_REQUIRED_RUNNER_ENVIRONMENT: self-hosted
        run: |
          python3 - <<'PY'
          import json, os, sys
          def validate_owned_source(environment, mode):
              """Служебные поля GitHub определяют источник; вход вызывающего файла не выдаёт полномочия."""
              import json, re
          
              def required(name):
                  value = environment.get(name, "")
                  if not isinstance(value, str) or not value:
                      raise ValueError("INCOMPLETE: missing native " + name)
                  return value
          
              def sha(name):
                  value = required(name)
                  if re.fullmatch(r"[0-9a-f]{40}", value) is None or value == "0" * 40:
                      raise ValueError("INCOMPLETE: invalid native " + name)
                  return value
          
              if environment.get("GITHUB_ACTIONS") != "true":
                  raise ValueError("INCOMPLETE: native GitHub Actions context is required")
              repository = required("CI_REPOSITORY")
              repository_id = required("CI_REPOSITORY_ID")
              if repository != "Labpics-Team/lab-colors" or repository_id != "1221255339":
                  raise ValueError("REFUSED: source repository is outside the owned scope")
          
              try:
                  native_job = json.loads(required("CI_NATIVE_JOB"))
              except (ValueError, TypeError) as error:
                  raise ValueError("INCOMPLETE: invalid native job context") from error
              if not isinstance(native_job, dict):
                  raise ValueError("INCOMPLETE: native job context is not an object")
              environment = dict(environment)
              for name, property_name in (
                  ("CI_RECIPE_SHA", "workflow_sha"),
                  ("CI_RECIPE_REF", "workflow_ref"),
                  ("CI_RECIPE_REPOSITORY", "workflow_repository"),
                  ("CI_RECIPE_PATH", "workflow_file_path"),
                  ("CI_CHECK_RUN_ID", "check_run_id"),
              ):
                  value = native_job.get(property_name)
                  if property_name == "check_run_id" and type(value) is int and value > 0:
                      value = str(value)
                  if not isinstance(value, str) or not value:
                      raise ValueError("INCOMPLETE: missing native job." + property_name)
                  environment[name] = value
              source_sha = sha("CI_SOURCE_SHA")
              caller_sha = sha("CI_CALLER_SHA")
              recipe_sha = sha("CI_RECIPE_SHA")
              recipe_repository = required("CI_RECIPE_REPOSITORY")
              recipe_path = required("CI_RECIPE_PATH")
              expected_path = required("CI_EXPECTED_RECIPE_PATH")
              recipe_ref = required("CI_RECIPE_REF")
              if recipe_repository != repository or recipe_path != expected_path:
                  raise ValueError("REFUSED: executing recipe repository or path differs")
              if re.fullmatch(r"\.github/workflows/[a-z0-9-]+\.yml", recipe_path) is None:
                  raise ValueError("REFUSED: invalid executing recipe path")
              prefix = repository + "/" + recipe_path + "@"
              if not recipe_ref.startswith(prefix) or not recipe_ref[len(prefix):]:
                  raise ValueError("INCOMPLETE: executing recipe ref is not bound to its file")
          
              event = required("CI_EVENT")
              ref = required("CI_REF")
              if event == "pull_request":
                  head_repository = required("CI_HEAD_REPOSITORY")
                  head_id = required("CI_HEAD_REPOSITORY_ID")
                  sha("CI_HEAD_SHA")
                  if head_repository != repository or head_id != repository_id:
                      raise ValueError("REFUSED: foreign pull request head")
                  if re.fullmatch(r"refs/pull/[1-9][0-9]*/merge", ref) is None:
                      raise ValueError("REFUSED: unsupported pull request source ref")
              elif event == "merge_group":
                  if not ref.startswith("refs/heads/gh-readonly-queue/main/"):
                      raise ValueError("REFUSED: merge group is outside main")
              elif event == "push":
                  if ref != "refs/heads/main" and not ref.startswith("refs/tags/colors-v"):
                      raise ValueError("REFUSED: push is outside main or the release scope")
              elif event in ("workflow_dispatch", "schedule"):
                  if mode == "protected" and ref != "refs/heads/main":
                      raise ValueError("REFUSED: manual or scheduled source is outside main")
                  if mode == "bootstrap" and not ref.startswith("refs/heads/"):
                      raise ValueError("REFUSED: bootstrap source is not an owned branch")
              else:
                  raise ValueError("REFUSED: unsupported source event")
          
              runner_environment = required("CI_RUNNER_ENVIRONMENT")
              runner_os = required("CI_RUNNER_OS")
              runner_arch = required("CI_RUNNER_ARCH")
              runner_name = required("CI_RUNNER_NAME")
              expected_environment = required("CI_REQUIRED_RUNNER_ENVIRONMENT")
              if runner_environment not in ("self-hosted", "github-hosted"):
                  raise ValueError("INCOMPLETE: unknown runner environment")
              if expected_environment not in ("any", "self-hosted", "github-hosted"):
                  raise ValueError("REFUSED: unknown execution requirement")
              if expected_environment != "any" and runner_environment != expected_environment:
                  raise ValueError("REFUSED: required runner environment is unavailable")
              for name in ("CI_RUN_ID", "CI_RUN_ATTEMPT", "CI_CHECK_RUN_ID"):
                  if re.fullmatch(r"[1-9][0-9]*", required(name)) is None:
                      raise ValueError("INCOMPLETE: invalid native " + name)
              if mode == "bootstrap":
                  # Только временный native FULLSHA allowlist разрешает этот recipe.
                  if recipe_sha != caller_sha:
                      raise ValueError("REFUSED: bootstrap recipe is not the caller snapshot")
              elif mode == "protected":
                  if recipe_ref != prefix + "refs/heads/main":
                      raise ValueError("REFUSED: recipe is not the protected main worker")
                  if event in ("push", "workflow_dispatch", "schedule") and recipe_sha != source_sha:
                      raise ValueError("REFUSED: exact main or release recipe has not executed")
              else:
                  raise ValueError("REFUSED: unknown recipe mode")
              binding = {
                  "source_sha": source_sha,
                  "head_sha": environment.get("CI_HEAD_SHA", "") if event == "pull_request" else "",
                  "caller_sha": caller_sha,
                  "recipe_sha": recipe_sha,
                  "recipe_ref": recipe_ref,
                  "recipe_repository": recipe_repository,
                  "recipe_path": recipe_path,
                  "runner_environment": runner_environment,
                  "runner_os": runner_os,
                  "runner_arch": runner_arch,
                  "runner_name": runner_name,
                  "run_id": environment["CI_RUN_ID"],
                  "run_attempt": environment["CI_RUN_ATTEMPT"],
                  "check_run_id": environment["CI_CHECK_RUN_ID"],
                  "identity_relation": "same-revision" if source_sha == recipe_sha else "distinct-revisions",
              }
              for key, value in binding.items():
                  if re.search(r"[\x00-\x1f\x7f]", value) is not None:
                      raise ValueError("REFUSED: control character in native " + key)
              return binding
          try:
              binding = validate_owned_source(os.environ, 'bootstrap')
          except ValueError as error:
              raise SystemExit(str(error))
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for key, value in binding.items():
                  output.write('CI_BOUND_' + key.upper() + '=' + value + '\n')
              output.write('CI_VERIFIED_SOURCE_SHA=' + binding['source_sha'] + '\n')
              output.write('CI_VERIFIED_CALLER_SHA=' + binding['caller_sha'] + '\n')
              output.write('CI_VERIFIED_RECIPE_SHA=' + binding['recipe_sha'] + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              for key, value in binding.items():
                  output.write(key + '=' + value + '\n')
          print(json.dumps(binding, sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write('Source ' + binding['source_sha'] + '\n\nCaller ' + binding['caller_sha'] + '\n\nExecuting recipe ' + binding['recipe_sha'] + '\n\nIdentity relation ' + binding['identity_relation'] + '\n')
          PY

  wasm:
    needs: ["source-admission"]
    name: wasm build + headless test + size
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 45
    # Native Binaryen 117 не завершил wasm-opt внутри systrap до bounded timeout
    # (run 30773180841). Официальный Node transport того же release дал byte-exact
    # результат native oracle на post-bindgen input в exact production cell.
    # Менять release/transport только новым differential receipt.
    env:
      BINARYEN_RELEASE: version_117
      BINARYEN_NODE_SHA256: "2d5a42f2d167a7cc2b4b6664c44c5ace1690d13db4f527324f052afbad461a07"
      WASM_BINDGEN_CLI_SHA256: "064948d58e2d6c0a745216477a639ba696216d6309aaa902939d1b865b1d869d"
    outputs:
      node: ${{ steps.packer.outputs.node }}
      npm: ${{ steps.packer.outputs.npm }}
      tarball_sha256: ${{ steps.verified-release-identity.outputs.sha256 }}
    steps:
      - name: Require declared execution environment
        shell: bash
        env:
          ACTUAL_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          test "$ACTUAL_RUNNER_ENVIRONMENT" = self-hosted || { echo 'REFUSED: required runner environment is unavailable' >&2; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.source-admission.outputs.source_sha }}
      - name: toolchain env (runner.temp)
        # runner-контекст недоступен в job-level env — только в шагах; поэтому
        # RUSTUP_HOME/CARGO_HOME назначаются здесь через GITHUB_ENV. Смысл тот
        # же: изоляция per job под runner.temp, который раннер вайпит между
        # джобами (класс утечки /tmp закрыт, см. историю #143).
        run: |
          {
            echo "RUSTUP_HOME=$RUNNER_TEMP/rustup-$GITHUB_JOB"
            echo "CARGO_HOME=$RUNNER_TEMP/cargo-$GITHUB_JOB"
            echo "WASM_PACK_CACHE=$RUNNER_TEMP/wasm-pack-$GITHUB_JOB"
            # TMPDIR тоже изолирован под runner.temp: /tmp на de-02 — 8ГБ tmpfs;
            # при исчерпании места (4КБ свободно) все
            # джобы умирали «abnormal exit»/cc без stderr, 2026-07-03 18:34Z.
            echo "TMPDIR=$RUNNER_TEMP/tmp-$GITHUB_JOB"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/tmp-$GITHUB_JOB" "$RUNNER_TEMP/wasm-pack-$GITHUB_JOB"
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master @ 2026-03-27
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          # The WASM compile target; the bindings are built and tested against it.
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Одноразовый слот: GitHub-кэш не нужен. У setup-node вход `cache` — это
          # перечисление пакетных менеджеров, поэтому кэш выключается ОТСУТСТВИЕМ
          # `cache` плюс явным гашением автокэша npm (`cache: false` там падает).
          package-manager-cache: false
          node-version: ${{ env.NODE_TOOLCHAIN }}
      - name: install wasm-pack
        # Pinned for reproducibility; --locked respects the tool's own lockfile.
        # Build uses --no-opt below: Binaryen is installed and verified separately,
        # while wasm-pack still owns cargo/wasm-bindgen and the browser harness.
        # $CARGO_HOME/bin в†’ PATH explicitly: with a custom CARGO_HOME the
        # toolchain action does not add it, so the installed `wasm-pack` binary
        # was unreachable (exit 127 "command not found" на прежнем пуле de-02).
        run: |
          cargo install wasm-pack --version 0.13.1 --locked
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - name: install byte-bound wasm-bindgen CLI
        # wasm-pack's fallback install is dependency- and host-toolchain-sensitive.
        # Materialize the release binary in its completed non-dot cache layout so
        # both the fallback and its disposable dot-prefixed staging are bypassed.
        run: |
          set -euo pipefail
          version=0.2.126
          archive="$RUNNER_TEMP/wasm-bindgen-$version.tar.gz"
          install_root="$WASM_PACK_CACHE/.unpacked-wasm-bindgen-cli-$version"
          materialized_root="$WASM_PACK_CACHE/.materialized-wasm-bindgen-cargo-install-$version"
          final_root="$WASM_PACK_CACHE/wasm-bindgen-cargo-install-$version"
          rm -rf "$install_root" "$materialized_root" "$final_root"
          curl --fail-with-body --silent --show-error --location \
            --retry 3 --retry-all-errors \
            "https://github.com/wasm-bindgen/wasm-bindgen/releases/download/$version/wasm-bindgen-$version-x86_64-unknown-linux-musl.tar.gz" \
            -o "$archive"
          printf '%s  %s\n' "$WASM_BINDGEN_CLI_SHA256" "$archive" \
            | sha256sum --check --strict
          mkdir -p "$install_root" "$materialized_root"
          tar --extract --gzip --strip-components=1 --file="$archive" --directory="$install_root"
          mv -- "$install_root/wasm-bindgen" "$materialized_root/wasm-bindgen"
          mv -- "$install_root/wasm-bindgen-test-runner" "$materialized_root/wasm-bindgen-test-runner"
          mv -- "$materialized_root" "$final_root"
          echo "$final_root" >> "$GITHUB_PATH"
          rm -rf "$install_root" "$archive"
      - name: install byte-bound Binaryen Node transport
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/binaryen-$GITHUB_JOB.tar.gz"
          root="$RUNNER_TEMP/binaryen-$GITHUB_JOB"
          curl --fail-with-body --silent --show-error --location \
            --retry 3 --retry-all-errors \
            "https://github.com/WebAssembly/binaryen/releases/download/${BINARYEN_RELEASE}/binaryen-${BINARYEN_RELEASE}-node.tar.gz" \
            -o "$archive"
          printf '%s  %s\n' "$BINARYEN_NODE_SHA256" "$archive" \
            | sha256sum --check --strict
          mkdir -p "$root"
          tar --extract --gzip --file "$archive" --directory "$root"
          binaryen="$root/binaryen-${BINARYEN_RELEASE}"
          test -f "$binaryen/wasm-opt.js"
          test -f "$binaryen/wasm-opt.wasm"
          test -f "$binaryen/wasm-opt.worker.js"
          echo "BINARYEN_ROOT=$binaryen" >> "$GITHUB_ENV"
      - name: repeat runtime WASM build in one toolchain-pinned CI job
        env:
          PROGRAM_BENCHMARK: ${{ inputs.program-benchmark }}
          PROGRAM_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PROGRAM_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # Rust error locations otherwise embed the slot's mutable
        # workspace/CARGO_HOME roots and make identical source hash differently.
        # The second build follows `cargo clean`; equality checks repeatability
        # for this source inside this toolchain-pinned job, not cross-run or
        # cross-host identity.
        run: |
          set -euo pipefail
          export CARGO_ENCODED_RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=/workspace/lab-colors"$'\x1f'"--remap-path-prefix=$CARGO_HOME=/cargo-home"
          build_runtime() {
            wasm-pack build --no-opt --release --target web \
              --out-dir ../../packages/colors/pkg --out-name labcolors \
              crates/labcolors-wasm --locked
            local wasm=packages/colors/pkg/labcolors_bg.wasm
            local optimized=packages/colors/pkg/labcolors_bg.wasm-opt.wasm
            node "$BINARYEN_ROOT/wasm-opt.js" "$wasm" -o "$optimized" \
              -Oz --enable-bulk-memory --enable-nontrapping-float-to-int
            mv -- "$optimized" "$wasm"
          }

          rm -rf packages/colors/pkg
          build_runtime

          first="$RUNNER_TEMP/wasm-first-$GITHUB_JOB"
          rm -rf "$first"
          mkdir -p "$first"
          cp -a packages/colors/pkg "$first/pkg"

          cargo clean
          rm -rf packages/colors/pkg
          build_runtime

          if ! diff --no-dereference --recursive "$first/pkg" packages/colors/pkg; then
            echo "runtime WASM output changed between builds" >&2
            exit 1
          fi

          wasm=packages/colors/pkg/labcolors_bg.wasm
          for root in "$GITHUB_WORKSPACE" "$CARGO_HOME" "$RUSTUP_HOME"; do
            if LC_ALL=C grep -a -F -q -- "$root/" "$wasm"; then
              echo "unmapped build path $root in $wasm" >&2
              exit 1
            fi
          done
          sha256sum packages/colors/pkg/labcolors_bg.wasm
          if [[ "$PROGRAM_BENCHMARK" == true ]]; then
            [[ "$PROGRAM_BASE_SHA" =~ ^[0-9a-f]{40}$ ]]
            [[ "$PROGRAM_HEAD_SHA" =~ ^[0-9a-f]{40}$ ]]
            results="$RUNNER_TEMP/program-performance"
            baseline="$RUNNER_TEMP/program-baseline-$GITHUB_JOB"
            candidate="$RUNNER_TEMP/program-candidate-$GITHUB_JOB"
            mkdir -p "$results" "$candidate"
            cp -a packages/colors/. "$candidate/"
            git fetch --no-tags origin "$PROGRAM_BASE_SHA"
            git worktree add --detach "$baseline" "$PROGRAM_BASE_SHA"
            (
              cd "$baseline"
              export CARGO_ENCODED_RUSTFLAGS="--remap-path-prefix=$baseline=/workspace/lab-colors"$'\x1f'"--remap-path-prefix=$CARGO_HOME=/cargo-home"
              build_runtime
            )
            node packages/colors/bench/wire-construction.mjs compare "$baseline/packages/colors" "$candidate"
            python3 scripts/compare-program-performance.py \
              --harness packages/colors/bench/program.mjs \
              --baseline "$baseline/packages/colors" \
              --candidate "$candidate" \
              --baseline-revision "$PROGRAM_BASE_SHA" \
              --candidate-revision "$GITHUB_SHA" \
              --head-revision "$PROGRAM_HEAD_SHA" \
              --profile \
              --output "$results"
          fi
      - name: retain source-bound point-support evidence
        if: ${{ always() && inputs.program-benchmark }}
        run: |
          mkdir -p "$RUNNER_TEMP/program-performance"
          python3 scripts/verify_point_support_surplus.py --emit \
            > "$RUNNER_TEMP/program-performance/point-support-reference-surplus-q55-bps-proof-v1.json"
      - name: enforce measured WASM runtime budget
        # Exact Linux x64 zero-headroom ratchet. gzip remains transport
        # diagnostics only.
        run: node scripts/check-wasm-size-budget.mjs
      - name: "@labpics/colors: typecheck + runtime tests"
        # pkg/ уже собран выше, поэтому TypeScript видит реальные wasm-bindgen
        # declarations; node --test покрывает builder, init и публичный контракт.
        # Браузерный terminal Program-путь проверяется wasm-pack test ниже.
        working-directory: packages/colors
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: verify byte-exact npm release artifact
        id: verified-release
        working-directory: packages/colors
        run: npm run release:verify
      - name: bind verified npm tarball SHA-256
        id: verified-release-identity
        env:
          VERIFIED_TARBALL: ${{ steps.verified-release.outputs.tarball }}
        run: |
          set -euo pipefail
          test -f "$VERIFIED_TARBALL"
          tarball_sha256="$(sha256sum --binary -- "$VERIFIED_TARBALL" | cut --delimiter=' ' --fields=1)"
          if [[ ! "$tarball_sha256" =~ ^[0-9a-f]{64}$ ]]; then
            echo "verified tarball digest is not lowercase SHA-256" >&2
            exit 1
          fi
          printf 'sha256=%s\n' "$tarball_sha256" >> "$GITHUB_OUTPUT"
      - name: install Chrome + dependencies (Chrome for Testing + apt-get download)
        # GitHub-hosted образ не содержит нужный CfT-браузер; установка целиком
        # userspace (sudo на раннере доступен, но не используется — гейт остаётся
        # герметичным и не трогает системное состояние образа).
        # Strategy:
        #  1. Download exact CfT chrome + chromedriver archives and verify SHA-256.
        #     Тест обязан использовать только проверенную пару CfT, а не Chrome
        #     или ChromeDriver из изменяемого окружения раннера.
        #  2. Extract required shared libs (.so) from the runner's configured
        #     Debian/Ubuntu repository without sudo. Refresh package metadata in
        #     runner.temp first: образ ячейки может нести устаревшие списки,
        #     чьи package URL уже отдают 404. The root set below owns every
        #     direct DT_NEEDED name of the pinned Chrome and ChromeDriver ELF
        #     files; APT resolves its transitive closure and `dpkg --extract`
        #     unpacks it without root. `ldd` then rejects an incomplete closure
        #     before wasm-pack can misreport it as a driver timeout.
        run: |
          set -euo pipefail
          # -- CfT chrome + chromedriver --
          BASE_URL="https://storage.googleapis.com/chrome-for-testing-public/${CHROME_FOR_TESTING_VERSION}/linux64"
          CHROME_ROOT="$RUNNER_TEMP/chrome-$GITHUB_JOB"
          mkdir -p "$CHROME_ROOT"
          curl --fail-with-body --silent --show-error --location \
            "${BASE_URL}/chrome-linux64.zip" -o "$CHROME_ROOT/chrome-linux64.zip"
          curl --fail-with-body --silent --show-error --location \
            "${BASE_URL}/chromedriver-linux64.zip" -o "$CHROME_ROOT/chromedriver-linux64.zip"
          printf '%s  %s\n' "$CHROME_FOR_TESTING_SHA256" "$CHROME_ROOT/chrome-linux64.zip" \
            | sha256sum --check --strict
          printf '%s  %s\n' "$CHROMEDRIVER_FOR_TESTING_SHA256" "$CHROME_ROOT/chromedriver-linux64.zip" \
            | sha256sum --check --strict
          unzip -q -o "$CHROME_ROOT/chrome-linux64.zip" -d "$CHROME_ROOT"
          unzip -q -o "$CHROME_ROOT/chromedriver-linux64.zip" -d "$CHROME_ROOT"
          CHROME_BIN="$CHROME_ROOT/chrome-linux64/chrome"
          CHROMEDRIVER_BIN="$CHROME_ROOT/chromedriver-linux64/chromedriver"
          chmod +x "$CHROME_BIN" "$CHROMEDRIVER_BIN"
          echo "CHROME_PATH=$CHROME_BIN" >> "$GITHUB_ENV"
          echo "CHROMEDRIVER_PATH=$CHROMEDRIVER_BIN" >> "$GITHUB_ENV"
          echo "Chrome for Testing $CHROME_FOR_TESTING_VERSION installed"

          # -- Extract Chrome shared-lib dependencies from distro .deb (no sudo needed) --
          DEPS_DIR="$RUNNER_TEMP/chrome-deps-$GITHUB_JOB"
          APT_LISTS="$DEPS_DIR/apt-lists"
          APT_CACHE="$DEPS_DIR/apt-cache"
          readonly APT_SOURCES="$DEPS_DIR/apt-sources"
          mkdir -p \
            "$APT_LISTS/partial" \
            "$APT_CACHE/archives/partial" \
            "$APT_SOURCES/sources.list.d"
          # Общие sources раннера содержат посторонние vendor-репозитории.
          # Недоступный vendor не должен отменять browser-gate, которому нужны
          # только пакеты дистрибутива, поэтому зависимость объявлена явно.
          source /etc/os-release
          : "${ID:?missing distro ID}"
          : "${VERSION_CODENAME:?missing distro codename}"
          # Debian 12 / Ubuntu 22.04 predate the time64 package rename; Debian
          # 13 / Ubuntu 24.04 use the t64 ABI name. Unknown images fail closed
          # instead of guessing a package from mutable ambient APT metadata.
          case "$ID:$VERSION_CODENAME" in
            debian:bookworm|ubuntu:jammy)
              ALSA_PACKAGE=libasound2
              ATK_PACKAGE=libatk1.0-0
              ATK_BRIDGE_PACKAGE=libatk-bridge2.0-0
              ATSPI_PACKAGE=libatspi2.0-0
              CUPS_PACKAGE=libcups2
              GLIB_PACKAGE=libglib2.0-0
              ;;
            debian:trixie|ubuntu:noble|ubuntu:resolute)
              ALSA_PACKAGE=libasound2t64
              ATK_PACKAGE=libatk1.0-0t64
              ATK_BRIDGE_PACKAGE=libatk-bridge2.0-0t64
              ATSPI_PACKAGE=libatspi2.0-0t64
              CUPS_PACKAGE=libcups2t64
              GLIB_PACKAGE=libglib2.0-0t64
              ;;
            *)
              echo "unsupported Chrome dependency release: $ID:$VERSION_CODENAME" >&2
              exit 1
              ;;
          esac
          readonly ALSA_PACKAGE ATK_PACKAGE ATK_BRIDGE_PACKAGE ATSPI_PACKAGE CUPS_PACKAGE GLIB_PACKAGE
          CHROME_RUNTIME_PACKAGES=(
            "$ALSA_PACKAGE"
            "$ATK_BRIDGE_PACKAGE"
            "$ATK_PACKAGE"
            "$ATSPI_PACKAGE"
            "$CUPS_PACKAGE"
            "$GLIB_PACKAGE"
            libcairo2
            libdbus-1-3
            libexpat1
            libgbm1
            libnspr4
            libnss3
            libpango-1.0-0
            libudev1
            libx11-6
            libxcb1
            libxcomposite1
            libxdamage1
            libxext6
            libxfixes3
            libxkbcommon0
            libxrandr2
          )
          readonly CHROME_RUNTIME_PACKAGES
          case "$ID" in
            debian)
              DISTRO_KEYRING=/usr/share/keyrings/debian-archive-keyring.gpg
              test -r "$DISTRO_KEYRING"
              printf '%s\n' \
                "deb [signed-by=$DISTRO_KEYRING] https://deb.debian.org/debian $VERSION_CODENAME main" \
                "deb [signed-by=$DISTRO_KEYRING] https://deb.debian.org/debian $VERSION_CODENAME-updates main" \
                "deb [signed-by=$DISTRO_KEYRING] https://security.debian.org/debian-security $VERSION_CODENAME-security main" \
                > "$APT_SOURCES/sources.list"
              ;;
            ubuntu)
              DISTRO_KEYRING=/usr/share/keyrings/ubuntu-archive-keyring.gpg
              test -r "$DISTRO_KEYRING"
              printf '%s\n' \
                "deb [signed-by=$DISTRO_KEYRING] https://archive.ubuntu.com/ubuntu $VERSION_CODENAME main" \
                "deb [signed-by=$DISTRO_KEYRING] https://archive.ubuntu.com/ubuntu $VERSION_CODENAME-updates main" \
                "deb [signed-by=$DISTRO_KEYRING] https://security.ubuntu.com/ubuntu $VERSION_CODENAME-security main" \
                > "$APT_SOURCES/sources.list"
              ;;
            *)
              echo "unsupported Chrome dependency distro: $ID" >&2
              exit 1
              ;;
          esac
          readonly DISTRO_KEYRING
          # Все изменяемые пути APT и полный inventory sources принадлежат job;
          # keyring и dpkg status остаются read-only входами.
          APT_OPTIONS=(
            -o "Dir::Etc::sourcelist=$APT_SOURCES/sources.list"
            -o "Dir::Etc::sourceparts=$APT_SOURCES/sources.list.d"
            -o "Dir::State::lists=$APT_LISTS"
            -o "Dir::State::status=/var/lib/dpkg/status"
            -o "Dir::Cache=$APT_CACHE"
            -o "Dir::Cache::archives=$APT_CACHE/archives"
            -o "Debug::NoLocking=1"
            -o "Acquire::Retries=3"
          )
          readonly APT_OPTIONS
          apt-get "${APT_OPTIONS[@]}" update
          # --reinstall materialises every direct root even when the immutable
          # image already owns it; APT adds only transitive roots absent from
          # that image. --download-only keeps system package state read-only.
          apt-get "${APT_OPTIONS[@]}" install \
            --download-only \
            --reinstall \
            --no-install-recommends \
            --yes \
            "${CHROME_RUNTIME_PACKAGES[@]}"
          shopt -s nullglob
          deb_packages=("$APT_CACHE/archives"/*.deb)
          ((${#deb_packages[@]} > 0)) || {
            echo "Chrome dependency resolver produced no package closure" >&2
            exit 1
          }
          readonly deb_packages
          for deb in "${deb_packages[@]}"; do
            dpkg --extract "$deb" "$DEPS_DIR"
          done
          DEPS_LIB="$(find "$DEPS_DIR/usr/lib" -maxdepth 2 -type d | tr '\n' ':' | sed 's/:$//')"
          echo "LD_LIBRARY_PATH=${DEPS_LIB}:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          echo "Chrome deps: $DEPS_LIB"
          assert_elf_closure() {
            local executable="$1"
            local missing
            missing="$(
              LD_LIBRARY_PATH="${DEPS_LIB}:${LD_LIBRARY_PATH:-}" ldd "$executable" \
                | awk '/=> not found$/ { print $1 }'
            )"
            [[ -z "$missing" ]] || {
              printf 'unresolved Chrome runtime closure for %s:\n%s\n' "$executable" "$missing" >&2
              exit 1
            }
          }
          assert_elf_closure "$CHROME_BIN"
          assert_elf_closure "$CHROMEDRIVER_BIN"
          LD_LIBRARY_PATH="${DEPS_LIB}:${LD_LIBRARY_PATH:-}" "$CHROME_BIN" --version
          LD_LIBRARY_PATH="${DEPS_LIB}:${LD_LIBRARY_PATH:-}" "$CHROMEDRIVER_BIN" --version

      - name: test WASM crate in real browser
        run: |
          set -euo pipefail
          : "${CHROME_PATH:?}" "${CHROMEDRIVER_PATH:?}" "${RUNNER_TEMP:?}"
          [[ "$CHROME_PATH" == /* && "$CHROMEDRIVER_PATH" == /* ]]
          test -x "$CHROME_PATH"
          test -x "$CHROMEDRIVER_PATH"
          # ChromeDriver проверяет системные каталоги раньше PATH. Явный binary
          # связывает тест с проверенным CfT, сохраняя остальные capabilities.
          WASM_BINDGEN_TEST_WEBDRIVER_JSON="$(mktemp "$RUNNER_TEMP/wasm-webdriver.XXXXXX.json")"
          readonly WASM_BINDGEN_TEST_WEBDRIVER_JSON
          export WASM_BINDGEN_TEST_WEBDRIVER_JSON
          trap 'rm -f -- "$WASM_BINDGEN_TEST_WEBDRIVER_JSON"' EXIT
          node <<'NODE'
          const { readFileSync, writeFileSync } = require("node:fs");
          const capabilities = JSON.parse(readFileSync("crates/labcolors-wasm/webdriver.json", "utf8"));
          const options = capabilities["goog:chromeOptions"];
          if (capabilities.browserName !== "chrome" || !options ||
              typeof options !== "object" || Array.isArray(options)) {
            throw new Error("webdriver.json must declare Chrome capabilities");
          }
          capabilities["goog:chromeOptions"].binary = process.env.CHROME_PATH;
          writeFileSync(process.env.WASM_BINDGEN_TEST_WEBDRIVER_JSON, `${JSON.stringify(capabilities)}\n`);
          NODE
          wasm-pack test --headless --chrome --chromedriver "$CHROMEDRIVER_PATH" crates/labcolors-wasm --locked

      - name: terminal Program in real browser
        # Единственная команда связывает конечный Program с проверенным архивом.
        env:
          LAB_COLORS_BROWSER_PROOF_TIMEOUT_MS: "60000"
          VERIFIED_TARBALL: ${{ steps.verified-release.outputs.tarball }}
          VERIFIED_TARBALL_SHA256: ${{ steps.verified-release-identity.outputs.sha256 }}
        shell: bash
        run: node scripts/test-program-runtime-browser.mjs "$VERIFIED_TARBALL" "$VERIFIED_TARBALL_SHA256"
      - name: retain packer identity for the isolated publisher
        id: packer
        run: |
          printf 'node=%s\n' "$(node -p process.versions.node)" >> "$GITHUB_OUTPUT"
          printf 'npm=%s\n' "$(npm --version)" >> "$GITHUB_OUTPUT"
      - name: select minimum consumer runtime
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          package-manager-cache: false
          node-version: ${{ env.NODE_CONSUMER_FLOOR }}
      - name: Node 22 consumer floor
        env:
          VERIFIED_TARBALL: ${{ steps.verified-release.outputs.tarball }}
          VERIFIED_TARBALL_SHA256: ${{ steps.verified-release-identity.outputs.sha256 }}
        run: |
          set -euo pipefail
          test "$(node -p process.versions.node)" = "$NODE_CONSUMER_FLOOR"
          test "$(sha256sum --binary -- "$VERIFIED_TARBALL" | cut --delimiter=' ' --fields=1)" = "$VERIFIED_TARBALL_SHA256"
          node scripts/verify-package-release.mjs --package-smoke "$VERIFIED_TARBALL"
      - name: upload verified npm tarball and manifest
        if: github.event_name == 'push' && github.ref_type == 'tag' && startsWith(github.ref_name, 'colors-v')
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: colors-release-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ steps.verified-release.outputs.tarball }}
            ${{ steps.verified-release.outputs.manifest }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

