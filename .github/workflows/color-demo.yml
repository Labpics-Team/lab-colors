name: color demo

on:
  workflow_dispatch:
  workflow_run:
    workflows: [publish]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: color-demo-image
  cancel-in-progress: false

jobs:
  image:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - name: Read the package version and selected Node
        id: package
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          package = json.loads(Path('packages/colors/package.json').read_text())
          recipe = json.loads(Path('packages/colors/bench/wasm.json').read_text())
          version = package['version']
          if not re.fullmatch(r'\d+\.\d+\.\d+', version):
              raise SystemExit('The public example requires a stable package release')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write(f'version={version}\nnode={recipe["toolchain"]["node"]}\n')
          PY
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version: ${{ steps.package.outputs.node }}
      - name: Install the published package and prepare the example
        id: example
        env:
          DEMO_VERSION: ${{ steps.package.outputs.version }}
        run: |
          set -euo pipefail
          git fetch --depth=1 origin "refs/tags/colors-v${DEMO_VERSION}"
          release_sha=$(git rev-parse 'FETCH_HEAD^{commit}')
          npm pack "@labpics/colors@${DEMO_VERSION}" --ignore-scripts --json > demo-npm.json
          npm install --prefix _site --ignore-scripts --no-audit --no-fund \
            --package-lock=false --omit=dev "./labpics-colors-${DEMO_VERSION}.tgz"
          node scripts/prepare-color-demo.mjs _site "$DEMO_VERSION" "$release_sha"
          echo "source=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3
      - name: Build the image for its HTTP check
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: examples/contextual-colors/deploy/Dockerfile
          platforms: linux/amd64
          load: true
          tags: lab-colors-demo:check
      - name: Check the image with a read-only filesystem
        run: |
          set -euo pipefail
          container=$(docker run --detach --read-only --cap-drop=ALL \
            --security-opt=no-new-privileges --tmpfs /tmp:rw,noexec,nosuid,size=16m \
            --publish 127.0.0.1:4173:8080 lab-colors-demo:check)
          trap 'docker logs "$container"; docker rm --force "$container"' EXIT
          node scripts/check-color-demo.mjs http://127.0.0.1:4173 _site
      - uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish the checked static consumer
        id: image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          file: examples/contextual-colors/deploy/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/labpics-team/lab-colors-demo:${{ steps.package.outputs.version }}-${{ steps.example.outputs.source }}
          labels: |
            org.opencontainers.image.source=https://github.com/Labpics-Team/lab-colors
            org.opencontainers.image.revision=${{ steps.example.outputs.source }}
            org.opencontainers.image.version=${{ steps.package.outputs.version }}
      - name: Record the image and package identities
        env:
          DEMO_IMAGE_DIGEST: ${{ steps.image.outputs.digest }}
          DEMO_SOURCE_SHA: ${{ steps.example.outputs.source }}
        run: |
          python3 - <<'PY'
          import json, os, re
          from pathlib import Path
          digest = os.environ['DEMO_IMAGE_DIGEST']
          if not re.fullmatch(r'sha256:[a-f0-9]{64}', digest):
              raise SystemExit('Missing immutable image identity')
          release = json.loads(Path('_site/release.json').read_text())
          npm, = json.loads(Path('demo-npm.json').read_text())
          if npm['name'] != release['package'] or npm['version'] != release['version']:
              raise SystemExit('The packed npm identity changed')
          receipt = {
              'schema': 'labpics.colors-demo-image/v1',
              'image': f'ghcr.io/labpics-team/lab-colors-demo@{digest}',
              'exampleSourceSha': os.environ['DEMO_SOURCE_SHA'],
              'release': release,
              'npm': {key: npm[key] for key in ('name', 'version', 'integrity', 'shasum')},
              'run': {'repository': os.environ['GITHUB_REPOSITORY'],
                      'id': os.environ['GITHUB_RUN_ID'],
                      'attempt': os.environ['GITHUB_RUN_ATTEMPT']},
          }
          Path('demo-image.json').write_text(json.dumps(receipt, indent=2) + '\n')
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a') as summary:
              summary.write(f'GitOps image: `{receipt["image"]}`\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: color-demo-image
          path: |
            demo-image.json
            _site/release.json
            demo-npm.json
          if-no-files-found: error
