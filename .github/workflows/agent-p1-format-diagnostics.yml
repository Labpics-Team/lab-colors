name: P1 format and diagnostics

on:
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: github.event.pull_request.number == 370
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          ref: agent/p1-correct-rebuild
          fetch-depth: 0
          persist-credentials: true
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.96.0
          components: rustfmt
      - name: format and diagnose
        shell: bash
        run: |
          set -uo pipefail
          cargo fmt --all
          set +e
          cargo test --workspace --locked --message-format=short > p1-test.log 2>&1
          status=$?
          set -e
          printf '%s\n' "$status" > p1-test-status.txt
          git rm .github/workflows/agent-p1-format-diagnostics.yml
          git add -A
          if ! git diff --cached --quiet; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git commit -m 'P1: apply canonical Rust formatting'
            git push origin HEAD:agent/p1-correct-rebuild
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p1-test-diagnostics
          path: |
            p1-test.log
            p1-test-status.txt
          if-no-files-found: error
          retention-days: 1
