name: CI

# Имя job `CI` закреплено как required check организации.
on:
  pull_request:
  merge_group:

concurrency:
  group: ci-gate-${{ github.repository }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow-policy:
    name: CI workflow contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check --no-deps -r scripts/ci/requirements.txt
      - name: Verify the complete native pre-merge graph
        env:
          CI_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: python3 scripts/test_ci_workflow_results.py

  ci:
    name: CI
    uses: ./.github/workflows/ci-worker.yml

  native:
    name: Native conformance
    uses: ./.github/workflows/native-conformance-worker.yml

  admission:
    name: code-admission-public
    uses: ./.github/workflows/code-admission-public.yml

  gate:
    name: CI
    if: ${{ always() }}
    needs: [workflow-policy, ci, native, admission]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check --no-deps -r scripts/ci/requirements.txt
      - name: Require every result from this native dependency graph
        env:
          GATE_EVENT: ${{ github.event_name }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/workflow_results.py complete
