name: CI

# Имя job `CI` закреплено как required check организации.
on:
  pull_request:
  merge_group:

concurrency:
  # PR ставит проверки в очередь, пока завершается итог предыдущей ревизии.
  group: ci-gate-${{ github.repository }}-${{ github.event_name == 'pull_request' && format('pr-run-{0}', github.run_id) || github.event.merge_group.head_sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  workflow-policy:
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-workflow-policy
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    name: CI workflow contracts
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 0
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check --no-deps -r scripts/ci/requirements.txt
      - name: Verify CI contracts before merge
        env:
          CI_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: python3 -m unittest discover -s scripts -p 'test_ci_*.py'

  ci:
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-ci
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    name: CI
    uses: ./.github/workflows/ci-worker.yml

  formal:
    name: Formal qualification
    if: ${{ always() && github.event_name != 'pull_request' }}
    uses: ./.github/workflows/formal-worker.yml

  native:
    concurrency:
      group: ci-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.run_id }}-native
      cancel-in-progress: ${{ github.event_name == 'pull_request' }}
    name: Native conformance
    uses: ./.github/workflows/native-conformance-worker.yml

  admission:
    name: code-admission-public
    uses: ./.github/workflows/code-admission-public.yml

  gate:
    name: CI
    if: ${{ always() }}
    needs: [workflow-policy, ci, formal, native, admission]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - run: python3 -m pip install --disable-pip-version-check --no-deps -r scripts/ci/requirements.txt
      - name: Require every result from this native dependency graph
        env:
          GATE_EVENT: ${{ github.event_name }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: python3 scripts/ci/workflow_results.py complete
