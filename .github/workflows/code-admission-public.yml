name: code-admission-public
on:
  pull_request:
  merge_group:
permissions:
  contents: read
concurrency:
  group: labpics-public-admission-${{ github.repository }}-${{ github.event.pull_request.number || github.event.merge_group.head_sha || github.sha }}
  cancel-in-progress: false
jobs:
  admission:
    name: code-admission-public
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout immutable carrier root
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.workflow_sha }}
          fetch-depth: 1
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Select qualified Node runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Verify carrier provenance
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(git rev-parse HEAD)" == "${{ github.workflow_sha }}" ]]
          node .github/actions/labpics-code-admission/verify.mjs --root .github/actions/labpics-code-admission
      - name: Checkout immutable integration candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          path: .code-subject.public01
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
          lfs: false
      - name: Run qualified source admission
        uses: ./.github/actions/labpics-code-admission/.github/actions/code-admission
        with:
          repo: .code-subject.public01
          base: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          candidate: ${{ github.sha }}
      # Исторический carrier использует встроенные Trivy-исключения для test/example/md.
      # Дополнительный проход ужесточает только секреты того же кандидата и не меняет carrier.
      - name: Scan secrets omitted by Trivy defaults
        shell: bash
        env:
          CANDIDATE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          work="$(mktemp -d "$RUNNER_TEMP/strict-secret.XXXXXXXX")"
          trap 'rm -rf -- "$work"' EXIT
          version=0.74.0
          sum=2ae6fe3ee734b7fdf11335663e18c75ea12dccc76062f09f164a3b0f8be4371a
          curl -fsSL --retry 3 --retry-all-errors -o "$work/trivy.tgz" \
            "https://github.com/aquasecurity/trivy/releases/download/v$version/trivy_${version}_Linux-64bit.tar.gz"
          echo "$sum  $work/trivy.tgz" | sha256sum -c -
          tar -xzf "$work/trivy.tgz" -C "$work" trivy
          # Digest закрепляет helper относительно workflow; исполняется только копия.
          helper="$work/strict_secret_scan.py"
          install -m 0600 scripts/ci/strict_secret_scan.py "$helper"
          helper_sha256=338f0aff0694d14458c3e030ffe8d296ce17c9eeae235b6a1802028d187a1746
          printf "%s  %s\n" "$helper_sha256" "$helper" | sha256sum -c -
          python3 -I "$helper" \
            "$work/trivy" "$GITHUB_WORKSPACE/.code-subject.public01" "$CANDIDATE_SHA" "$work" \
            "$GITHUB_WORKSPACE/.github/actions/labpics-code-admission/plans/tools/code-admission/snapshot.mjs"
      - name: Remove candidate checkout
        if: ${{ always() }}
        shell: bash
        run: |
          set -euo pipefail
          [[ -d .code-subject.public01 && ! -L .code-subject.public01 ]]
          rm -rf -- .code-subject.public01
