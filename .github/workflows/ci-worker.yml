        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          BASE_ROOT: ${{ runner.temp }}/evaluate-base-source
          CARGO_TARGET_DIR: ${{ runner.temp }}/evaluate-base-target
        run: |
          set -euo pipefail
          test -n "$HEAD_SHA"
          test -n "$BASE_SHA"
          git cat-file -e "$HEAD_SHA^{commit}"
          git cat-file -e "$BASE_SHA^{commit}" || git fetch --no-tags origin "$BASE_SHA"
          CONTROL_SHA="$(git merge-base "$HEAD_SHA" "$BASE_SHA")"
          test -n "$CONTROL_SHA"
          git cat-file -e "$CONTROL_SHA^{commit}"
          echo "sha=$CONTROL_SHA" >> "$GITHUB_OUTPUT"
          git worktree add --detach "$BASE_ROOT" "$CONTROL_SHA"
          cd "$BASE_ROOT"
          export CARGO_ENCODED_RUSTFLAGS="--remap-path-prefix=$BASE_ROOT=/workspace/lab-colors"$'\x1f'"--remap-path-prefix=$CARGO_HOME=/cargo-home"
          cargo build --release --locked -p labcolors-evaluate-cli
          test -x "$CARGO_TARGET_DIR/release/labcolors-evaluate"
          sha256sum "$CARGO_TARGET_DIR/release/labcolors-evaluate"
      - name: generate exact-SHA SBOM, license, benchmark and in-toto statement
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          BASE_SHA: ${{ steps.base.outputs.sha || '' }}
          CANDIDATE_BINARY: ${{ runner.temp }}/evaluate-candidate-target/release/labcolors-evaluate
          BASE_BINARY: ${{ runner.temp }}/evaluate-base-target/release/labcolors-evaluate
          EVIDENCE_DIR: ${{ runner.temp }}/evaluate-distribution
        run: |
          set -euo pipefail
          args=(
            generate
            --binary "$CANDIDATE_BINARY"
            --source-sha "$SOURCE_SHA"
            --out "$EVIDENCE_DIR"
          )
          if [ -n "$BASE_SHA" ]; then
            test -x "$BASE_BINARY"
            args+=(--baseline-binary "$BASE_BINARY" --baseline-sha "$BASE_SHA")
          fi
          node scripts/evaluate-distribution.mjs "${args[@]}"
          node scripts/evaluate-distribution.mjs verify \
            --dir "$EVIDENCE_DIR" \
            --source-sha "$SOURCE_SHA"
          find "$EVIDENCE_DIR" -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum
      - name: pass verified subject and SBOM to the isolated attester
        id: handoff
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
        run: node scripts/ci/distribution_outputs.mjs "$RUNNER_TEMP/evaluate-distribution" evaluate.intoto.json "$SOURCE_SHA"

  audit:
    name: cargo audit (rustsec)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master @ 2026-03-27
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: install cargo-audit
        # cargo-audit 0.22+ понимает RUSTSEC с CVSS v4.
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
      - name: cargo audit
        run: cargo audit --deny warnings

  wasm:
    uses: ./.github/workflows/package-worker.yml
    with:
      # Запрошенная PR-диагностика; обязательные package/size checks не зависят от метки.
      program-benchmark: ${{ github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'performance') }}
    permissions:
      contents: read

