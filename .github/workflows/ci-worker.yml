  audit:
    name: cargo audit (rustsec)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: toolchain env (runner.temp)
        # runner-контекст недоступен в job-level env — только в шагах; поэтому
        # RUSTUP_HOME/CARGO_HOME назначаются здесь через GITHUB_ENV. Смысл тот
        # же: изоляция per job под runner.temp, который раннер вайпит между
        # джобами (класс утечки /tmp закрыт, см. историю #143).
        run: |
          {
            echo "RUSTUP_HOME=$RUNNER_TEMP/rustup-$GITHUB_JOB"
            echo "CARGO_HOME=$RUNNER_TEMP/cargo-$GITHUB_JOB"
            # TMPDIR тоже изолирован под runner.temp: /tmp на de-02 — 8ГБ tmpfs;
            # при исчерпании места (4КБ свободно) все
            # джобы умирали «abnormal exit»/cc без stderr, 2026-07-03 18:34Z.
            echo "TMPDIR=$RUNNER_TEMP/tmp-$GITHUB_JOB"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/tmp-$GITHUB_JOB"
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master @ 2026-03-27
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: install cargo-audit
        # Version pinned for reproducibility; --locked respects the tool's own lockfile.
        # Must be >=0.22; older versions cannot parse RUSTSEC entries that use
        # CVSS v4.0 and fail to load the advisory database entirely.
        # Add $CARGO_HOME/bin to PATH explicitly: with a custom CARGO_HOME the
        # toolchain action does not add it, and standalone `cargo install`
        # binaries become unreachable (`wasm-pack` died with exit 127 on de-02;
        # `cargo audit` only survived by resolving as a cargo subcommand).
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      # Hard-fail on actively-exploitable advisories AND on yanked crates.
      # Rationale: a known-vulnerable or yanked dependency is a supply-chain
      # liability we will not knowingly merge. cargo-audit exits non-zero on any
      # advisory; --deny warnings additionally promotes yanked/unmaintained
      # warnings to failures. continue-on-error is intentionally absent (false)
      # so the gate actually blocks. If a finding is a false positive or accepted
      # risk, ignore it explicitly per-advisory via `--ignore RUSTSEC-XXXX-NNNN`
      # with a comment, never by disabling the whole check.
      - name: cargo audit
        run: cargo audit --deny warnings

  wasm:
    uses: ./.github/workflows/package-worker.yml
    with:
      # Метка выбирает измерение при следующем обычном запуске CI для PR.
      # Отдельное событие labeled требует согласования с жизненным циклом
