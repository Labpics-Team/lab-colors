name: CI worker

# Worker для эфемерных GitHub-hosted раннеров публичного репозитория.
# Локальный uses в ci.yml выбирает определение из snapshot caller'а, не checkout.
# Изменения графа и пинов проверяются в том же коммите; это не отдельный заранее
# одобренный граф. Собственных inputs нет. Тесты связывают байты обоих файлов
# с github.workflow_sha, который не следует подменять SHA исходников задания.

on:
  workflow_call:

# Least privilege: CI only reads the repo. Override per-job if a job needs more.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Deterministic toolchain. Bump in lockstep with the team's supported Rust.
  # To update: pick the new stable from https://forge.rust-lang.org/ and change
  # this value; each job consumes it through the `toolchain` input.
  RUST_TOOLCHAIN: 1.96.0
  # Public minimum, tested independently from the development toolchain.
  MSRV_TOOLCHAIN: 1.85.0
  # Pins npm 11.9.0 as part of the official Node distribution. npm tar format
  # is release input, so a floating runner-provided npm is not reproducible.
  NODE_TOOLCHAIN: 24.14.0
  # Offline proof codecs are executable release tooling too. The image is pinned
  # to the linux/amd64 manifest because setup-python does not publish Debian 13
  # builds and образ ячейки не должен задавать семантику интерпретатора.
  # Декларированный минимум интерпретатора для proof-кода — Python 3.11:
  # stdlib-only пакеты используют StrEnum и datetime.UTC; пин образа ниже
  # обязан оставаться не ниже этого флора.
  PYTHON_PROOF_IMAGE: python:3.14.6-slim@sha256:d4fea6e20c09820028eea3f5c17f5b8ebd2ecb9c2bf28e561681a74a96090e4f

jobs:
  formal-positive:
    name: formal core positive (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      CARGO_BUILD_JOBS: 2
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        shard: [0, 1, 2, 3, 4]
    outputs:
      positive_0: ${{ steps.handoff.outputs.positive_0 }}
      positive_1: ${{ steps.handoff.outputs.positive_1 }}
      positive_2: ${{ steps.handoff.outputs.positive_2 }}
      positive_3: ${{ steps.handoff.outputs.positive_3 }}
      positive_4: ${{ steps.handoff.outputs.positive_4 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: isolate verifier toolchains
        run: |
          {
            echo "RUSTUP_HOME=$RUNNER_TEMP/rustup-$GITHUB_JOB"
            echo "CARGO_HOME=$RUNNER_TEMP/cargo-$GITHUB_JOB"
            echo "KANI_HOME=$RUNNER_TEMP/kani-$GITHUB_JOB"
            echo "TMPDIR=$RUNNER_TEMP/tmp-$GITHUB_JOB"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/tmp-$GITHUB_JOB" "$RUNNER_TEMP/kani-$GITHUB_JOB"
          echo "$RUNNER_TEMP/cargo-$GITHUB_JOB/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: install pinned Kani
        run: |
          cargo install kani-verifier --version "$(python3 scripts/verify_core_formal.py --kani-version)" --locked
          cargo kani setup
      - name: verify assigned positive formal harnesses
        run: |
          python3 scripts/verify_core_formal.py \
            --phase positive \
            --shard-index "${{ matrix.shard }}" \
            --shard-count 5 \
            --output-dir "$RUNNER_TEMP/core-formal"
      - name: pass verified JSON reports to the assembler
        id: handoff
        run: python3 scripts/ci/formal_outputs.py publish "$RUNNER_TEMP/core-formal"


  formal-mutants:
    name: formal core mutants (${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CARGO_BUILD_JOBS: 2
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        shard: [0, 1, 2, 3, 4]
    outputs:
      mutants_0: ${{ steps.handoff.outputs.mutants_0 }}
      mutants_1: ${{ steps.handoff.outputs.mutants_1 }}
      mutants_2: ${{ steps.handoff.outputs.mutants_2 }}
      mutants_3: ${{ steps.handoff.outputs.mutants_3 }}
      mutants_4: ${{ steps.handoff.outputs.mutants_4 }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: isolate verifier toolchains
        run: |
          {
            echo "RUSTUP_HOME=$RUNNER_TEMP/rustup-$GITHUB_JOB"
            echo "CARGO_HOME=$RUNNER_TEMP/cargo-$GITHUB_JOB"
            echo "KANI_HOME=$RUNNER_TEMP/kani-$GITHUB_JOB"
            echo "TMPDIR=$RUNNER_TEMP/tmp-$GITHUB_JOB"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/tmp-$GITHUB_JOB" "$RUNNER_TEMP/kani-$GITHUB_JOB"
          echo "$RUNNER_TEMP/cargo-$GITHUB_JOB/bin" >> "$GITHUB_PATH"
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: install pinned Kani
        run: |
          cargo install kani-verifier --version "$(python3 scripts/verify_core_formal.py --kani-version)" --locked
          cargo kani setup
      - name: reject assigned semantic mutants
        run: |
          python3 scripts/verify_core_formal.py \
            --phase mutants \
            --shard-index "${{ matrix.shard }}" \
            --shard-count 5 \
            --output-dir "$RUNNER_TEMP/core-formal"
      - name: pass verified JSON reports to the assembler
        id: handoff
        run: python3 scripts/ci/formal_outputs.py publish "$RUNNER_TEMP/core-formal"


  formal-core:
    name: formal core (Kani)
    if: ${{ always() }}
    needs: [formal-positive, formal-mutants]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: require positive and every mutant shard
        env:
          POSITIVE: ${{ needs.formal-positive.result }}
          MUTANTS: ${{ needs.formal-mutants.result }}
        run: |
          set -euo pipefail
          if [[ "$POSITIVE" != success || "$MUTANTS" != success ]]; then
            printf 'Required formal results: positive=%s mutants=%s\n' "$POSITIVE" "$MUTANTS" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: verifier contract hostile tests
        run: |
          python3 scripts/test_ci_storage.py
          python3 scripts/test_verify_core_formal.py
          python3 scripts/test_formal_outputs.py
      - name: restore every formal report from producer outputs
        env:
          CI_FORMAL_PART_0: ${{ needs.formal-positive.outputs.positive_0 }}
          CI_FORMAL_PART_1: ${{ needs.formal-positive.outputs.positive_1 }}
          CI_FORMAL_PART_2: ${{ needs.formal-positive.outputs.positive_2 }}
          CI_FORMAL_PART_3: ${{ needs.formal-positive.outputs.positive_3 }}
          CI_FORMAL_PART_4: ${{ needs.formal-positive.outputs.positive_4 }}
          CI_FORMAL_PART_5: ${{ needs.formal-mutants.outputs.mutants_0 }}
          CI_FORMAL_PART_6: ${{ needs.formal-mutants.outputs.mutants_1 }}
          CI_FORMAL_PART_7: ${{ needs.formal-mutants.outputs.mutants_2 }}
          CI_FORMAL_PART_8: ${{ needs.formal-mutants.outputs.mutants_3 }}
          CI_FORMAL_PART_9: ${{ needs.formal-mutants.outputs.mutants_4 }}
        run: python3 scripts/ci/formal_outputs.py restore "$RUNNER_TEMP/core-formal" --parts 10
      - name: require exact proof and mutant completeness
        run: |
          python3 scripts/verify_core_formal.py \
            --phase assemble \
            --input-dir "$RUNNER_TEMP/core-formal" \
            --output-dir "$RUNNER_TEMP/core-formal"
      - name: show complete verification receipt
        run: cat "$RUNNER_TEMP/core-formal/receipt.json"

  msrv:
    name: MSRV workspace check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # PR receipts bind the proposed head; push and merge queue bind their event SHA.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: verify exact clean-set product receipt
        run: python3 scripts/verify_clean_set_receipt.py product --product-root "$GITHUB_WORKSPACE"
      - name: replay the complete nominal clean-set proof offline
        run: python3 scripts/verify_clean_set_receipt.py full --product-root "$GITHUB_WORKSPACE"
      - name: clean-set receipt verifier hostile tests
        run: |
          python3 scripts/test_verify_clean_set_receipt.py
          python3 -O scripts/test_verify_clean_set_receipt.py
      - name: toolchain env (runner.temp)
        run: |
          {
            echo "RUSTUP_HOME=$RUNNER_TEMP/rustup-$GITHUB_JOB"
            echo "CARGO_HOME=$RUNNER_TEMP/cargo-$GITHUB_JOB"
            echo "TMPDIR=$RUNNER_TEMP/tmp-$GITHUB_JOB"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/tmp-$GITHUB_JOB"
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master @ 2026-03-27
        with:
          toolchain: ${{ env.MSRV_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: cargo check on declared MSRV
        run: |
          cargo check --workspace --all-targets --locked
          cargo check -p labcolors-core --all-targets --all-features --locked

  lint:
    name: clippy + rustfmt
    runs-on: ubuntu-latest
    timeout-minutes: 40
    # Каждый job использует собственные toolchain-каталоги в runner.temp.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # dtolnay/rust-toolchain has no semver tags; the action is pinned by commit SHA.
      # The toolchain VERSION is pinned via the explicit input below, not @stable,
      # so a new stable release cannot silently change CI behavior.
      - name: toolchain env (runner.temp)
        # runner-контекст недоступен в job-level env — только в шагах; поэтому
        # RUSTUP_HOME/CARGO_HOME назначаются здесь через GITHUB_ENV. Смысл тот
        # же: изоляция per job под runner.temp, который раннер вайпит между
        # джобами (класс утечки /tmp закрыт, см. историю #143).
        run: |
          {
            echo "RUSTUP_HOME=$RUNNER_TEMP/rustup-$GITHUB_JOB"
            echo "CARGO_HOME=$RUNNER_TEMP/cargo-$GITHUB_JOB"
            # TMPDIR тоже изолирован под runner.temp: /tmp на de-02 — 8ГБ tmpfs;
            # при исчерпании места (4КБ свободно) все
            # джобы умирали «abnormal exit»/cc без stderr, 2026-07-03 18:34Z.
            echo "TMPDIR=$RUNNER_TEMP/tmp-$GITHUB_JOB"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/tmp-$GITHUB_JOB"
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master @ 2026-03-27
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  docs:
    name: cargo doc (intra-doc links)
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: toolchain env (runner.temp)
        # runner-контекст недоступен в job-level env — только в шагах; поэтому
        # RUSTUP_HOME/CARGO_HOME назначаются здесь через GITHUB_ENV. Смысл тот
        # же: изоляция per job под runner.temp, который раннер вайпит между
        # джобами (класс утечки /tmp закрыт, см. историю #143).
        run: |
          {
            echo "RUSTUP_HOME=$RUNNER_TEMP/rustup-$GITHUB_JOB"
            echo "CARGO_HOME=$RUNNER_TEMP/cargo-$GITHUB_JOB"
            # TMPDIR тоже изолирован под runner.temp: /tmp на de-02 — 8ГБ tmpfs;
            # при исчерпании места (4КБ свободно) все
            # джобы умирали «abnormal exit»/cc без stderr, 2026-07-03 18:34Z.
            echo "TMPDIR=$RUNNER_TEMP/tmp-$GITHUB_JOB"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/tmp-$GITHUB_JOB"
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master @ 2026-03-27
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: cargo doc
        # Intra-doc links are a hard gate: a broken [`link`] in any doc comment
        # (link to a private/renamed/removed item, or bare brackets rustdoc reads
        # as a link) fails the build. RUSTDOCFLAGS="-D warnings" promotes every
        # rustdoc warning, including broken_intra_doc_links, to an error;
        # --no-deps limits documentation checks to workspace crates.
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked
      - name: staged Program is absent from the resolved public API
        run: |
          python3 scripts/test_program_public_surface.py
          python3 scripts/verify_program_public_surface.py target/doc/labcolors_core
      - name: package labcolors-core and run extracted package doctests
        run: |
          set -euo pipefail
          test -f crates/labcolors-core/LICENSE
          test ! -L crates/labcolors-core/LICENSE
          cmp LICENSE crates/labcolors-core/LICENSE
          cargo package -p labcolors-core --locked
          crate_version="$(cargo pkgid -p labcolors-core | sed 's/.*#//')"
          package_root="$RUNNER_TEMP/labcolors-core-package-$GITHUB_RUN_ID"
          mkdir "$package_root"
          tar -xzf "target/package/labcolors-core-${crate_version}.crate" -C "$package_root"
          crate_dir="$package_root/labcolors-core-${crate_version}"
          test -f "$crate_dir/README.md"
          python3 scripts/verify_clean_set_receipt.py core-package \
            --source-root "$GITHUB_WORKSPACE" \
            --package-root "$crate_dir"
          cargo test --doc --manifest-path "$crate_dir/Cargo.toml" --locked

  # Независимые доказательства не образуют последовательную очередь.
  # Каждый job получает отдельную VM; обязательный test ниже соединяет результаты.
  region-proof-worker:
    name: region proof protocol (${{ matrix.mode }}-${{ matrix.shard }})
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        include:
          - { mode: normal, shard: 0 }
          - { mode: normal, shard: 1 }
          - { mode: optimized, shard: 0 }
          - { mode: optimized, shard: 1 }
          - { mode: fast, shard: 0 }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: canonical region-proof protocol
        shell: bash
        run: |
          set -euo pipefail
          formula_path='crates/labcolors-core/contracts/contextual-region-formula-v1.lcir'
          test "$(git check-attr text -- "$formula_path")" = "$formula_path: text: unset"
          test "$(git check-attr eol -- "$formula_path")" = "$formula_path: eol: unspecified"
          proof_tmp="$RUNNER_TEMP/region-proof-$GITHUB_JOB"
          mkdir -p "$proof_tmp"
          docker run --rm --pull always \
            --read-only \
            --network none \
            --cap-drop ALL \
            --security-opt no-new-privileges \
            --user "$(id -u):$(id -g)" \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace,readonly" \
            --mount "type=bind,src=$proof_tmp,dst=/tmp" \
            --workdir /workspace \
            --env PYTHONDONTWRITEBYTECODE=1 \
            --env PYTHONHASHSEED=0 \
            --env REGION_MODE="${{ matrix.mode }}" \
            --env REGION_SHARD="${{ matrix.shard }}" \
            "$PYTHON_PROOF_IMAGE" \
            sh -euc '
              python -c '\''import sys; expected = (3, 14, 6); actual = sys.version_info[:3]; assert actual == expected, (actual, expected)'\''
              case "$REGION_MODE" in
                normal)
                  if [ "$REGION_SHARD" = 0 ]; then
                    test -f proof/region/v1/tests/test_provenance.py
                    python -m unittest proof/region/v1/tests/test_provenance.py -v
                  fi
                  python scripts/region_unittest_shard.py --shard-index "$REGION_SHARD" --shard-count 2
                  ;;
                optimized)
                  PYTHONOPTIMIZE=2 python scripts/region_unittest_shard.py --shard-index "$REGION_SHARD" --shard-count 2
                  ;;
                fast)
                  test "$REGION_SHARD" = 0
                  python proof/region/v1/arb/tests/gate.py
                  PYTHONOPTIMIZE=2 python proof/region/v1/arb/tests/gate.py
                  python proof/region/v1/mpfi/tests/gate.py
                  PYTHONOPTIMIZE=2 python proof/region/v1/mpfi/tests/gate.py
                  python proof/region/v1/controller.py verify-fixtures --repo-root /workspace
                  ;;
                *)
                  echo "unknown region proof mode: $REGION_MODE" >&2
                  exit 2
                  ;;
              esac
            '

  region-proof:
    name: region proof protocol
    if: ${{ always() }}
    needs: region-proof-worker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: require every region proof shard
        env:
          REGION_SHARDS: ${{ needs.region-proof-worker.result }}
        run: |
          set -euo pipefail
          test "$REGION_SHARDS" = success
          echo 'all required region proof shards succeeded'

  authority-mutation-worker:
    name: authority semantic mutations (${{ matrix.scope }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        scope: [authority, tq, lifecycle-geometry, cc-selection, cc-binding, eval, science, cli]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: toolchain env (runner.temp)
        # runner-контекст недоступен в job-level env — только в шагах; поэтому
        # RUSTUP_HOME/CARGO_HOME назначаются здесь через GITHUB_ENV. Смысл тот
        # же: изоляция per job под runner.temp, который раннер вайпит между
        # джобами (класс утечки /tmp закрыт, см. историю #143).
        run: |
          {
            echo "RUSTUP_HOME=$RUNNER_TEMP/rustup-$GITHUB_JOB"
            echo "CARGO_HOME=$RUNNER_TEMP/cargo-$GITHUB_JOB"
            # TMPDIR тоже изолирован под runner.temp: /tmp на de-02 — 8ГБ tmpfs;
            # при исчерпании места (4КБ свободно) все
            # джобы умирали «abnormal exit»/cc без stderr, 2026-07-03 18:34Z.
            echo "TMPDIR=$RUNNER_TEMP/tmp-$GITHUB_JOB"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/tmp-$GITHUB_JOB"
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master @ 2026-03-27
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: AUTH-01 semantic mutation gate
        run: python3 scripts/authority_mutation_gate.py --scope "${{ matrix.scope }}"

  authority-mutation:
    name: authority semantic mutations
    if: ${{ always() }}
    needs: authority-mutation-worker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: require every authority mutation shard
        env:
          MUTATION_SHARDS: ${{ needs.authority-mutation-worker.result }}
        run: |
          set -euo pipefail
          test "$MUTATION_SHARDS" = success
          echo 'all required authority mutation shards succeeded'

  core-tests-worker:
    name: core tests and artifact contracts (${{ matrix.lane }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        lane: [default, private-fixture, proof-contracts]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: toolchain env (runner.temp)
        # runner-контекст недоступен в job-level env — только в шагах; поэтому
        # RUSTUP_HOME/CARGO_HOME назначаются здесь через GITHUB_ENV. Смысл тот
        # же: изоляция per job под runner.temp, который раннер вайпит между
        # джобами (класс утечки /tmp закрыт, см. историю #143).
        run: |
          {
            echo "RUSTUP_HOME=$RUNNER_TEMP/rustup-$GITHUB_JOB"
            echo "CARGO_HOME=$RUNNER_TEMP/cargo-$GITHUB_JOB"
            # TMPDIR тоже изолирован под runner.temp: /tmp на de-02 — 8ГБ tmpfs;
            # при исчерпании места (4КБ свободно) все
            # джобы умирали «abnormal exit»/cc без stderr, 2026-07-03 18:34Z.
            echo "TMPDIR=$RUNNER_TEMP/tmp-$GITHUB_JOB"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/tmp-$GITHUB_JOB"
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master @ 2026-03-27
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: CI peer gate hostile tests
        if: ${{ matrix.lane == 'default' }}
        env:
          CI_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: python3 scripts/test_ci_peer_gate.py
      - name: mutation evidence verifier hostile tests
        if: ${{ matrix.lane == 'default' }}
        env:
          CI_WORKFLOW_SHA: ${{ github.workflow_sha }}
        run: python3 scripts/test_mutation.py
      - name: Core source certificate build histories
        if: ${{ matrix.lane == 'default' }}
        timeout-minutes: 4
        run: python3 scripts/test_certificate_source_build.py
      - name: cargo test
        if: ${{ matrix.lane == 'default' }}
        run: cargo test --workspace --locked
      # The private-fixture lifecycle/dispose tests in private_fixture.rs are
      # feature-gated (`#[cfg(feature = "private-fixture")]`), so the default
      # `cargo test --workspace` step above never compiles them. They must run
      # on their own required step or CI silently drops the resource-ownership
      # and two-phase-dispose proofs. `--locked` keeps the same lockfile
      # contract as every other cargo command in this workflow.
      - name: cargo test private-fixture feature
        if: ${{ matrix.lane == 'private-fixture' }}
        run: cargo test -p labcolors-core --lib --features private-fixture --locked
      - name: exhaustive 24-bit family membership oracle
        if: ${{ matrix.lane == 'proof-contracts' }}
        shell: bash
        run: |
          set -euo pipefail
          test_name='family_artifact_tests::axis_membership_matches_the_full_srgb8_cube_oracle'
          cargo test -p labcolors-core --lib --locked -- --ignored --list --format terse |
            awk -v expected="${test_name}: test" '
              $0 == expected { matches += 1 }
              END { exit(matches == 1 ? 0 : 1) }
            '
          cargo test -p labcolors-core --lib "${test_name}" --locked -- --ignored --exact
      - name: prove core capability projection boundary
        if: ${{ matrix.lane == 'proof-contracts' }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import subprocess
          import sys

          metadata = json.loads(subprocess.check_output(
              ["cargo", "metadata", "--format-version", "1", "--no-deps"],
              text=True,
          ))
          packages = {package["name"]: package for package in metadata["packages"]}
          direct_core_consumers = (
              "labcolors-evaluate-cli",
              "labcolors-transport-cli",
              "labcolors-wasm",
              "labcolors-ffi",
              "labcolors-conformance",
          )
          core = packages["labcolors-core"]
          if core["features"].get("default") != []:
              raise SystemExit("labcolors-core default capability set drifted")
          # Ни optional, ни target-specific normal-edge не делает парсер
          # репозитория частью цветовой математики. Dev-only oracle допустим.
          runtime_dependencies = [
              dependency
              for dependency in core["dependencies"]
              if dependency["kind"] is None
          ]
          if runtime_dependencies:
              names = sorted(dependency["name"] for dependency in runtime_dependencies)
              raise SystemExit(f"labcolors-core must have zero runtime dependencies: {names}")
          # Оффлайн protocol/compiler линия вырезана целиком: анти-воскрешение —
          # самих крейтов больше не существует в воркспейсе.
          for erased in ("labcolors-protocol", "labcolors-compiler"):
              if erased in packages:
                  raise SystemExit(f"deleted crate resurfaced in the workspace: {erased}")

          for consumer in direct_core_consumers:
              core_dependencies = [
                  dependency
                  for dependency in packages[consumer]["dependencies"]
                  if dependency["name"] == "labcolors-core" and dependency["kind"] is None
              ]
              if len(core_dependencies) != 1:
                  raise SystemExit(f"{consumer} must have one normal labcolors-core edge")
              core_dependency = core_dependencies[0]
              if core_dependency["uses_default_features"]:
                  raise SystemExit(f"{consumer} must disable Core default capabilities")
              if core_dependency["features"]:
                  raise SystemExit(
                      f"{consumer} direct Core edge must own no optional capability, got "
                      f"{core_dependency['features']}"
                  )
              feature_tree = subprocess.check_output(
                  ["cargo", "tree", "-p", consumer, "--edges", "normal", "-e", "features"],
                  text=True,
              )
              # Вырезанные вертикали: сами фичи больше не существуют,
              # потребительские деревья обязаны быть чисты.
              for forbidden in ("wcag22-feasibility", "wcag22-explicit", "labcolors-protocol"):
                  if forbidden in feature_tree:
                      raise SystemExit(f"{consumer} resolved a deleted capability: {forbidden}")

          runtime_tree = subprocess.check_output(
              [
                  "cargo", "tree", "-p", "labcolors-wasm",
                  "--target", "wasm32-unknown-unknown",
                  "--edges", "normal", "-e", "features",
              ],
              text=True,
          )
          for forbidden in (
              "labcolors-protocol",
              "wcag22-feasibility",
              "wcag22-explicit",
          ):
              if forbidden in runtime_tree:
                  raise SystemExit(f"runtime role resolved forbidden capability: {forbidden}")

          print("core capability projection: PASS")
          PY
      - name: reject WCAG22 source-route redirects and proof vacuums
        if: ${{ matrix.lane == 'proof-contracts' }}
        run: python3 scripts/test_wcag22_source_binding.py
      - name: prove WCAG22 sRGB8 Q55 artifact over the full finite domain
        if: ${{ matrix.lane == 'proof-contracts' }}
        run: python3 scripts/verify_wcag22_q55.py
      - name: independently recompute WCAG22 neutral-axis fixtures
        if: ${{ matrix.lane == 'proof-contracts' }}
        run: python3 scripts/verify_wcag22_neutral_axis.py
      - name: reject point-support source-binding vacuums
        if: ${{ matrix.lane == 'proof-contracts' }}
        run: python3 scripts/test_point_support_surplus_source_binding.py
      - name: prove point-support retained reference surplus over Q55 bounds
        if: ${{ matrix.lane == 'proof-contracts' }}
        run: python3 scripts/verify_point_support_surplus.py
      # Исполняемая матрица артефактов (ARTIFACT-01). Две закреплённые записи в
      # proof/artifact/: tree.json (path -> blob id объявленных корней) и tests.json
      # (инвентарь тестов, разрешённый cargo/unittest, включая #[ignore]). CI только
      # пересчитывает и сравнивает; drift — red с названием файла/теста. Тавтология
      # extract | verify в одном шаге удалена. Sabotage-suites extractors и
      # anti-vacuum мутанты гейта исполняются здесь же, иначе их существование в
      # дереве не является гейтом.
      - name: tracked documentation bytes and protocol domain parity
        if: ${{ matrix.lane == 'proof-contracts' }}
        run: python3 scripts/test_document_bytes.py
      - name: artifact matrix - pinned records reproduce
        if: ${{ matrix.lane == 'proof-contracts' }}
        run: python3 scripts/artifact_matrix.py check
      - name: artifact matrix - extractor sabotage suites
        if: ${{ matrix.lane == 'proof-contracts' }}
        run: python3 -m unittest discover -s scripts -p 'test_extract_*.py'
      - name: artifact matrix - gate anti-vacuum mutants
        if: ${{ matrix.lane == 'proof-contracts' }}
        run: python3 scripts/test_artifact_matrix.py

  core-tests:
    name: core tests and artifact contracts
    if: ${{ always() }}
    needs: core-tests-worker
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: require every core test shard
        env:
          CORE_SHARDS: ${{ needs.core-tests-worker.result }}
        run: |
          set -euo pipefail
          test "$CORE_SHARDS" = success
          echo 'all required core test shards succeeded'

  # Сохраняет прежнее имя для publish-gate и требует все три независимых результата.
  test:
    name: test
    if: ${{ always() }}
    needs: [core-tests, region-proof, authority-mutation]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: require every proof lane to succeed
        shell: bash
        env:
          CORE_TESTS: ${{ needs.core-tests.result }}
          REGION_PROOF: ${{ needs.region-proof.result }}
          AUTHORITY_MUTATION: ${{ needs.authority-mutation.result }}
        run: |
          set -euo pipefail
          if [[ "$CORE_TESTS" != success || "$REGION_PROOF" != success || "$AUTHORITY_MUTATION" != success ]]; then
            printf 'Required proof results: core=%s region=%s mutation=%s\n' "$CORE_TESTS" "$REGION_PROOF" "$AUTHORITY_MUTATION" >&2
            exit 1
          fi
          echo 'all required proof lanes succeeded'

  transport-distribution:
    name: transport distribution evidence
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      subject-name: ${{ steps.handoff.outputs.subject-name }}
      subject-digest: ${{ steps.handoff.outputs.subject-digest }}
      sbom: ${{ steps.handoff.outputs.sbom }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
          # Pull-request `github.sha` names GitHub's ephemeral merge ref. Distribution
          # evidence must bind the reviewed source, not a synthetic merge commit.
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: toolchain env (runner.temp)
        run: |
          {
            echo "RUSTUP_HOME=$RUNNER_TEMP/rustup-$GITHUB_JOB"
            echo "CARGO_HOME=$RUNNER_TEMP/cargo-$GITHUB_JOB"
            echo "TMPDIR=$RUNNER_TEMP/tmp-$GITHUB_JOB"
          } >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/tmp-$GITHUB_JOB"
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master @ 2026-03-27
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          shared-key: transport-distribution
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          package-manager-cache: false
          node-version: ${{ env.NODE_TOOLCHAIN }}
      - name: distribution verifier hostile tests
        run: node --test scripts/test_transport_distribution.mjs scripts/test_distribution_outputs.mjs
      - name: build exact candidate transport artifact
        env:
          CARGO_TARGET_DIR: ${{ runner.temp }}/transport-candidate-target
        run: |
          set -euo pipefail
          export CARGO_ENCODED_RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=/workspace/lab-colors"$'\x1f'"--remap-path-prefix=$CARGO_HOME=/cargo-home"
          cargo build --release --locked -p labcolors-transport-cli
          test -x "$CARGO_TARGET_DIR/release/labcolors-transport"
          sha256sum "$CARGO_TARGET_DIR/release/labcolors-transport"
      - name: build paired merge-base control on pull requests
        id: base
        if: github.event_name == 'pull_request'
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BASE_ROOT: ${{ runner.temp }}/transport-base-source
          CARGO_TARGET_DIR: ${{ runner.temp }}/transport-base-target
        run: |
          set -euo pipefail
          test -n "$HEAD_SHA"
          test -n "$BASE_SHA"
          git cat-file -e "$HEAD_SHA^{commit}"
          git cat-file -e "$BASE_SHA^{commit}" || git fetch --no-tags origin "$BASE_SHA"
          CONTROL_SHA="$(git merge-base "$HEAD_SHA" "$BASE_SHA")"
          test -n "$CONTROL_SHA"
          git cat-file -e "$CONTROL_SHA^{commit}"
          echo "sha=$CONTROL_SHA" >> "$GITHUB_OUTPUT"
          git worktree add --detach "$BASE_ROOT" "$CONTROL_SHA"
          cd "$BASE_ROOT"
          export CARGO_ENCODED_RUSTFLAGS="--remap-path-prefix=$BASE_ROOT=/workspace/lab-colors"$'\x1f'"--remap-path-prefix=$CARGO_HOME=/cargo-home"
          cargo build --release --locked -p labcolors-transport-cli
          test -x "$CARGO_TARGET_DIR/release/labcolors-transport"
          sha256sum "$CARGO_TARGET_DIR/release/labcolors-transport"
      - name: generate exact-SHA SBOM, license, benchmark and in-toto statement
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
          BASE_SHA: ${{ steps.base.outputs.sha || '' }}
          CANDIDATE_BINARY: ${{ runner.temp }}/transport-candidate-target/release/labcolors-transport
          BASE_BINARY: ${{ runner.temp }}/transport-base-target/release/labcolors-transport
          EVIDENCE_DIR: ${{ runner.temp }}/transport-distribution
        run: |
          set -euo pipefail
          args=(
            generate
            --binary "$CANDIDATE_BINARY"
            --source-sha "$SOURCE_SHA"
            --out "$EVIDENCE_DIR"
          )
          if [ -n "$BASE_SHA" ]; then
            test -x "$BASE_BINARY"
            args+=(--baseline-binary "$BASE_BINARY" --baseline-sha "$BASE_SHA")
          fi
          node scripts/transport-distribution.mjs "${args[@]}"
          node scripts/transport-distribution.mjs verify \
            --dir "$EVIDENCE_DIR" \
            --source-sha "$SOURCE_SHA"
          find "$EVIDENCE_DIR" -maxdepth 1 -type f -print0 | sort -z | xargs -0 sha256sum
      - name: pass verified subject and SBOM to the isolated attester
        id: handoff
        env:
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: node scripts/ci/distribution_outputs.mjs "$RUNNER_TEMP/transport-distribution" transport.intoto.json "$SOURCE_SHA"

  transport-distribution-attestation:
