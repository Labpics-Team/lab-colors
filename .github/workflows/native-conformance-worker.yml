name: Native conformance (Swift) worker

# Нативная стратегия (#84): доказательство ДИНАМИЧНОГО рантайм-ядра.
# Swift зовёт ядро Rust В РАНТАЙМЕ через UniFFI; conformance-пак прогоняется
# против выхода FFI.
#
# Инфраструктура (миграция на GitHub-hosted раннеры, репо публичное): решение
# владельца от 2026-07-08 об исключении платных раннеров устарело — публичные
# репозитории получают GitHub-hosted минуты бесплатно. Swift-тулчейн больше не
# приходит из capability self-hosted образа: он закреплён digest'ом официального
# OCI-образа swift:6.1.3-noble ниже, а conformance-пак исполняется внутри него —
# тот же UniFFI-биндинг, тот же пак, ядро под x86_64-unknown-linux-gnu. Числовые
# семейства пака держатся толерантностью DRIFT_TOL=1e-6 (см.
# conformance/README.md). Glow stable проверяется как типизированный
# Indeterminate; для legacy CAM16 bit parity не заявляется.
#
# Линтеры/аудит/wasm/основной `cargo test --workspace` (включая толерантный
# раннер-референс пака на Linux) — в ci-worker.yml. Здесь — Swift-слой.
#
# Неизменяемый worker: caller (native-conformance.yml) закрепляет этот файл
# полным commit SHA и не может изменить ни job graph, ни пины. Своих inputs нет.

on:
  workflow_call:
  # ВРЕМЕННЫЙ триггер Stage A миграции на GitHub-hosted раннеры: прямой прогон
  # worker'а на миграционной ветке, пока caller в main закреплён на прежнем SHA.
  # Снимается в Stage B вместе с обновлением пинов caller'ов.
  push:
    branches: [ci-github-hosted-runners]

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: 1.96.0
  SWIFT_TOOLCHAIN: 6.1.3
  # swift:6.1.3-noble (multi-arch index, linux amd64/arm64), закреплён
  # content-addressed digest'ом; точное соответствие версии fail-closed
  # доказывает проверка `swift --version` внутри run-conformance.sh.
  SWIFT_IMAGE_V1: swift@sha256:fddaf02db3d41844916167ef4d199d5ca14c6003d052a0b9ab579646a9c720ec

jobs:
  # АКТИВНЫЙ ГЕЙТ: Swift-conformance на эфемерной GitHub-hosted VM.
  # Зеркало проверенного локального прогона (bindings/swift/ci/run-conformance.sh).
  #
  # ИМЯ JOB'А НЕ МЕНЯТЬ: publish-worker.yml принимает ровно это имя либо
  # reusable-суффикс «<caller> / <это имя>» внутри canonical run. Строка
  # «self-hosted Linux» — контракт с publish-гейтом, а не описание раннера.
  swift-conformance-linux:
    name: swift conformance (self-hosted Linux, pinned toolchain)
    runs-on: ubuntu-latest
    # 120 = запас сверху при переходе с DE-02 на GitHub-hosted раннеры (старый
    # 65-минутный конверт удвоен: history-replay на новом железе ещё невозможен);
    # перекалибровать по фактическим main-прогонам.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Rust остаётся workflow-owned версией; mutable каталоги живут только под
      # runner.temp конкретной job. Swift приходит из закреплённого OCI-образа.
      #
      # rustup ставится НАПРЯМУЮ в изолированные RUSTUP_HOME/CARGO_HOME этой
      # job: стандартный rust-toolchain action ставит в дефолтный HOME раннера,
      # который контейнер не видит — там мультиколл-прокси не находили тулчейн.
      # Версия rustup закреплена хешем скрипта, точный тулчейн fail-closed
      # доказывает run-conformance.sh.
      - name: prepare isolated Rust toolchain
        run: |
          {
            echo "RUSTUP_HOME=$RUNNER_TEMP/rustup-$GITHUB_JOB"
            echo "CARGO_HOME=$RUNNER_TEMP/cargo-$GITHUB_JOB"
          } >> "$GITHUB_ENV"
      - name: install rustup into the isolated homes
        run: |
          set -euo pipefail
          # rustup-init закреплён sha256 официального дистрибутива (см.
          # rustup-init.sha256 рядом с бинарником на static.rust-lang.org);
          # точный тулчейн независимо fail-closed проверяет run-conformance.sh.
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://static.rust-lang.org/rustup/dist/x86_64-unknown-linux-gnu/rustup-init \
            -o /tmp/rustup-init
          echo "4acc9acc76d5079515b46346a485974457b5a79893cfb01112423c89aeb5aa10  /tmp/rustup-init" \
            | sha256sum -c -
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --no-modify-path \
            --default-toolchain "$RUST_TOOLCHAIN" --profile minimal
        env:
          RUSTUP_HOME: ${{ runner.temp }}/rustup-${{ github.job }}
          CARGO_HOME: ${{ runner.temp }}/cargo-${{ github.job }}
      - name: verify the pinned toolchain is live
        run: |
          set -euo pipefail
          "$CARGO_HOME/bin/rustc" +"$RUST_TOOLCHAIN" --version
          "$CARGO_HOME/bin/cargo" +"$RUST_TOOLCHAIN" --version
      - name: acquire the exact pinned Swift toolchain image
        run: |
          set -euo pipefail
          docker_path="$(realpath "$(command -v docker)")"
          test -f "$docker_path"
          test ! -L "$docker_path"
          "$docker_path" image inspect "$SWIFT_IMAGE_V1" >/dev/null 2>&1 ||
            /usr/bin/timeout --signal=TERM --kill-after=30s 15m \
              "$docker_path" pull "$SWIFT_IMAGE_V1"
          echo "LABCOLORS_SWIFT_DOCKER=$docker_path" >> "$GITHUB_ENV"
      - name: swift conformance against UniFFI
        run: |
          set -euo pipefail
          job="$GITHUB_JOB"
          # Swift fail-closed требует существования TMPDIR ещё до первого
          # вызова драйвера: каталог создаётся на хосте, контейнер видит его
          # через bind-проброс runner.temp.
          mkdir -p "$RUNNER_TEMP/tmp-$job"
          "${LABCOLORS_SWIFT_DOCKER:?}" run --rm \
            --user "$(id -u):$(id -g)" \
            --workdir /workspace \
            --env "RUST_TOOLCHAIN=$RUST_TOOLCHAIN" \
            --env "SWIFT_TOOLCHAIN=$SWIFT_TOOLCHAIN" \
            --env "GITHUB_WORKSPACE=/workspace" \
            --env "RUNNER_TEMP=/runner-temp" \
            --env "HOME=/runner-temp" \
            --env "RUSTUP_HOME=/runner-temp/rustup-$job" \
            --env "CARGO_HOME=/runner-temp/cargo-$job" \
            --env "TMPDIR=/runner-temp/tmp-$job" \
            --env "PATH=/usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin:/runner-temp/cargo-$job/bin" \
            --mount "type=bind,src=$GITHUB_WORKSPACE,dst=/workspace,readonly" \
            --mount "type=bind,src=$RUNNER_TEMP,dst=/runner-temp" \
            "$SWIFT_IMAGE_V1" \
            bash bindings/swift/ci/run-conformance.sh

  # ССЫЛОЧНАЯ джоба (НЕ активный гейт): нативный macOS/arm64. Публичный репо
  # получает GitHub-hosted macOS-минуты бесплатно, но PR-гейт остаётся быстрым:
  # референс запускается только вручную. Активная валидация — job выше.
  swift-conformance-macos-reference:
    name: swift test (macOS arm64 — reference, ручной запуск)
    if: github.event_name == 'workflow_dispatch'
    runs-on: macos-15
    timeout-minutes: 65
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master @ 2026-03-27
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: versions
        run: |
          swift --version
          rustc --version
      - name: cargo test (reference runner + ffi units)
        run: cargo +${{ env.RUST_TOOLCHAIN }} test -p labcolors-conformance -p labcolors-ffi --locked
      - name: build labcolors-ffi (+ bindgen bin)
        run: cargo +${{ env.RUST_TOOLCHAIN }} build -p labcolors-ffi --features cli --locked
      - name: generate Swift bindings
        run: |
          cargo +${{ env.RUST_TOOLCHAIN }} run -p labcolors-ffi --features cli --bin uniffi-bindgen --locked -- \
            generate --library target/debug/liblabcolors.dylib \
            --language swift --out-dir bindings/swift/generated
      - name: arrange generated bindings
        run: |
          set -euo pipefail
          gen=bindings/swift/generated
          cp "$gen/labcolors.swift"        bindings/swift/Sources/LabColors/labcolors.swift
          cp "$gen/labcolorsFFI.h"         bindings/swift/Sources/labcolorsFFI/labcolorsFFI.h
          cp "$gen/labcolorsFFI.modulemap" bindings/swift/Sources/labcolorsFFI/module.modulemap
      - name: swift test (conformance pack vs FFI)
        working-directory: bindings/swift
        run: swift test -Xlinker -L"$GITHUB_WORKSPACE/target/debug"
