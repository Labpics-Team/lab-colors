name: Native conformance worker

# Потребители проверяют ту же исходную ревизию через сгенерированный UniFFI.
# Linux получает готовую библиотеку в закреплённом Swift-контейнере.
# Apple получает самостоятельный SwiftPM-архив с XCFramework и проверяет его
# вне checkout на macOS, iOS Simulator и сборкой для устройства.

on:
  workflow_call:
    inputs:
      authoring_baseline:
        required: false
        type: string
        default: ''

permissions:
  contents: read

env:
  RUST_TOOLCHAIN: 1.96.0
  SWIFT_TOOLCHAIN: 6.1.3
  # swift:6.1.3-noble (multi-arch index, linux amd64/arm64), закреплён
  # content-addressed digest'ом; точное соответствие версии fail-closed
  # доказывает проверка `swift --version` внутри run-conformance.sh.
  SWIFT_IMAGE_V1: swift@sha256:fddaf02db3d41844916167ef4d199d5ca14c6003d052a0b9ab579646a9c720ec

jobs:
  source-admission:
    name: source admission (native-conformance-worker)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      head_sha: ${{ steps.identity.outputs.head_sha }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
      caller_sha: ${{ steps.identity.outputs.caller_sha }}
      recipe_sha: ${{ steps.identity.outputs.recipe_sha }}
      recipe_ref: ${{ steps.identity.outputs.recipe_ref }}
      recipe_path: ${{ steps.identity.outputs.recipe_path }}
      run_id: ${{ steps.identity.outputs.run_id }}
      run_attempt: ${{ steps.identity.outputs.run_attempt }}
    steps:
      - name: Require owned source and native recipe identity
        id: identity
        shell: bash
        env:
          CI_REPOSITORY: ${{ github.repository }}
          CI_REPOSITORY_ID: ${{ github.repository_id }}
          CI_SOURCE_SHA: ${{ github.sha }}
          CI_CALLER_SHA: ${{ github.workflow_sha }}
          CI_NATIVE_JOB: ${{ toJSON(job) }}
          CI_EVENT: ${{ github.event_name }}
          CI_REF: ${{ github.ref }}
          CI_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          CI_HEAD_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_RUN_ID: ${{ github.run_id }}
          CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          CI_RUNNER_OS: ${{ runner.os }}
          CI_RUNNER_ARCH: ${{ runner.arch }}
          CI_RUNNER_NAME: ${{ runner.name }}
          CI_EXPECTED_RECIPE_PATH: .github/workflows/native-conformance-worker.yml
          CI_REQUIRED_RUNNER_ENVIRONMENT: self-hosted
        run: |
          python3 - <<'PY'
          import json, os, sys
          def validate_owned_source(environment, mode):
              """Служебные поля GitHub определяют источник; вход вызывающего файла не выдаёт полномочия."""
              import json, re
          
              def required(name):
                  value = environment.get(name, "")
                  if not isinstance(value, str) or not value:
                      raise ValueError("INCOMPLETE: missing native " + name)
                  return value
          
              def sha(name):
                  value = required(name)
                  if re.fullmatch(r"[0-9a-f]{40}", value) is None or value == "0" * 40:
                      raise ValueError("INCOMPLETE: invalid native " + name)
                  return value
          
              if environment.get("GITHUB_ACTIONS") != "true":
                  raise ValueError("INCOMPLETE: native GitHub Actions context is required")
              repository = required("CI_REPOSITORY")
              repository_id = required("CI_REPOSITORY_ID")
              if repository != "Labpics-Team/lab-colors" or repository_id != "1221255339":
                  raise ValueError("REFUSED: source repository is outside the owned scope")
          
              try:
                  native_job = json.loads(required("CI_NATIVE_JOB"))
              except (ValueError, TypeError) as error:
                  raise ValueError("INCOMPLETE: invalid native job context") from error
              if not isinstance(native_job, dict):
                  raise ValueError("INCOMPLETE: native job context is not an object")
              environment = dict(environment)
              for name, property_name in (
                  ("CI_RECIPE_SHA", "workflow_sha"),
                  ("CI_RECIPE_REF", "workflow_ref"),
                  ("CI_RECIPE_REPOSITORY", "workflow_repository"),
                  ("CI_RECIPE_PATH", "workflow_file_path"),
                  ("CI_CHECK_RUN_ID", "check_run_id"),
              ):
                  value = native_job.get(property_name)
                  if property_name == "check_run_id" and type(value) is int and value > 0:
                      value = str(value)
                  if not isinstance(value, str) or not value:
                      raise ValueError("INCOMPLETE: missing native job." + property_name)
                  environment[name] = value
              source_sha = sha("CI_SOURCE_SHA")
              caller_sha = sha("CI_CALLER_SHA")
              recipe_sha = sha("CI_RECIPE_SHA")
              recipe_repository = required("CI_RECIPE_REPOSITORY")
              recipe_path = required("CI_RECIPE_PATH")
              expected_path = required("CI_EXPECTED_RECIPE_PATH")
              recipe_ref = required("CI_RECIPE_REF")
              if recipe_repository != repository or recipe_path != expected_path:
                  raise ValueError("REFUSED: executing recipe repository or path differs")
              if re.fullmatch(r"\.github/workflows/[a-z0-9-]+\.yml", recipe_path) is None:
                  raise ValueError("REFUSED: invalid executing recipe path")
              prefix = repository + "/" + recipe_path + "@"
              if not recipe_ref.startswith(prefix) or not recipe_ref[len(prefix):]:
                  raise ValueError("INCOMPLETE: executing recipe ref is not bound to its file")
          
              event = required("CI_EVENT")
              ref = required("CI_REF")
              if event == "pull_request":
                  head_repository = required("CI_HEAD_REPOSITORY")
                  head_id = required("CI_HEAD_REPOSITORY_ID")
                  sha("CI_HEAD_SHA")
                  if head_repository != repository or head_id != repository_id:
                      raise ValueError("REFUSED: foreign pull request head")
                  if re.fullmatch(r"refs/pull/[1-9][0-9]*/merge", ref) is None:
                      raise ValueError("REFUSED: unsupported pull request source ref")
              elif event == "merge_group":
                  if not ref.startswith("refs/heads/gh-readonly-queue/main/"):
                      raise ValueError("REFUSED: merge group is outside main")
              elif event == "push":
                  if ref != "refs/heads/main" and not ref.startswith("refs/tags/colors-v"):
                      raise ValueError("REFUSED: push is outside main or the release scope")
              elif event in ("workflow_dispatch", "schedule"):
                  if mode == "protected" and ref != "refs/heads/main":
                      raise ValueError("REFUSED: manual or scheduled source is outside main")
                  if mode == "bootstrap" and not ref.startswith("refs/heads/"):
                      raise ValueError("REFUSED: bootstrap source is not an owned branch")
              else:
                  raise ValueError("REFUSED: unsupported source event")
          
              runner_environment = required("CI_RUNNER_ENVIRONMENT")
              runner_os = required("CI_RUNNER_OS")
              runner_arch = required("CI_RUNNER_ARCH")
              runner_name = required("CI_RUNNER_NAME")
              expected_environment = required("CI_REQUIRED_RUNNER_ENVIRONMENT")
              if runner_environment not in ("self-hosted", "github-hosted"):
                  raise ValueError("INCOMPLETE: unknown runner environment")
              if expected_environment not in ("any", "self-hosted", "github-hosted"):
                  raise ValueError("REFUSED: unknown execution requirement")
              if expected_environment != "any" and runner_environment != expected_environment:
                  raise ValueError("REFUSED: required runner environment is unavailable")
              for name in ("CI_RUN_ID", "CI_RUN_ATTEMPT", "CI_CHECK_RUN_ID"):
                  if re.fullmatch(r"[1-9][0-9]*", required(name)) is None:
                      raise ValueError("INCOMPLETE: invalid native " + name)
              if mode == "bootstrap":
                  # Только временный native FULLSHA allowlist разрешает этот recipe.
                  if recipe_sha != caller_sha:
                      raise ValueError("REFUSED: bootstrap recipe is not the caller snapshot")
              elif mode == "protected":
                  if recipe_ref != prefix + "refs/heads/main":
                      raise ValueError("REFUSED: recipe is not the protected main worker")
                  if event in ("push", "workflow_dispatch", "schedule") and recipe_sha != source_sha:
                      raise ValueError("REFUSED: exact main or release recipe has not executed")
              else:
                  raise ValueError("REFUSED: unknown recipe mode")
              binding = {
                  "source_sha": source_sha,
                  "head_sha": environment.get("CI_HEAD_SHA", "") if event == "pull_request" else "",
                  "caller_sha": caller_sha,
                  "recipe_sha": recipe_sha,
                  "recipe_ref": recipe_ref,
                  "recipe_repository": recipe_repository,
                  "recipe_path": recipe_path,
                  "runner_environment": runner_environment,
                  "runner_os": runner_os,
                  "runner_arch": runner_arch,
                  "runner_name": runner_name,
                  "run_id": environment["CI_RUN_ID"],
                  "run_attempt": environment["CI_RUN_ATTEMPT"],
                  "check_run_id": environment["CI_CHECK_RUN_ID"],
                  "identity_relation": "same-revision" if source_sha == recipe_sha else "distinct-revisions",
              }
              for key, value in binding.items():
                  if re.search(r"[\x00-\x1f\x7f]", value) is not None:
                      raise ValueError("REFUSED: control character in native " + key)
              return binding
          try:
              binding = validate_owned_source(os.environ, 'bootstrap')
          except ValueError as error:
              raise SystemExit(str(error))
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for key, value in binding.items():
                  output.write('CI_BOUND_' + key.upper() + '=' + value + '\n')
              output.write('CI_VERIFIED_SOURCE_SHA=' + binding['source_sha'] + '\n')
              output.write('CI_VERIFIED_CALLER_SHA=' + binding['caller_sha'] + '\n')
              output.write('CI_VERIFIED_RECIPE_SHA=' + binding['recipe_sha'] + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              for key, value in binding.items():
                  output.write(key + '=' + value + '\n')
          print(json.dumps(binding, sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write('Source ' + binding['source_sha'] + '\n\nCaller ' + binding['caller_sha'] + '\n\nExecuting recipe ' + binding['recipe_sha'] + '\n\nIdentity relation ' + binding['identity_relation'] + '\n')
          PY

  swift-conformance-linux:
    needs: ["source-admission"]
    name: swift package (Linux)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 120
    steps:
      - name: Require declared execution environment
        shell: bash
        env:
          ACTUAL_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          test "$ACTUAL_RUNNER_ENVIRONMENT" = self-hosted || { echo 'REFUSED: required runner environment is unavailable' >&2; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          ref: ${{ needs.source-admission.outputs.source_sha }}

      # Производитель владеет своим Rust toolchain; Swift входит только в consumer image.
      - name: prepare isolated Rust toolchain
        run: |
          {
            echo "RUSTUP_HOME=$RUNNER_TEMP/rustup-$GITHUB_JOB"
            echo "CARGO_HOME=$RUNNER_TEMP/cargo-$GITHUB_JOB"
          } >> "$GITHUB_ENV"
      - name: install rustup into the isolated homes
        run: |
          set -euo pipefail
          # rustup-init закреплён sha256 официального дистрибутива (см.
          # rustup-init.sha256 рядом с бинарником на static.rust-lang.org);
          # точный тулчейн независимо fail-closed проверяет run-conformance.sh.
          curl --proto '=https' --tlsv1.2 -fsSL \
            https://static.rust-lang.org/rustup/archive/1.29.1/x86_64-unknown-linux-gnu/rustup-init \
            -o /tmp/rustup-init
          echo "dda7234360b7f578ca8b0ddcb80145646fa61a67c1720a5abc7051b35c9fcb71  /tmp/rustup-init" \
            | sha256sum -c -
          chmod +x /tmp/rustup-init
          /tmp/rustup-init -y --no-modify-path \
            --default-toolchain "$RUST_TOOLCHAIN" --profile minimal
        env:
          RUSTUP_HOME: ${{ runner.temp }}/rustup-${{ github.job }}
          CARGO_HOME: ${{ runner.temp }}/cargo-${{ github.job }}
      - name: verify the pinned toolchain is live
        run: |
          set -euo pipefail
          "$CARGO_HOME/bin/rustc" +"$RUST_TOOLCHAIN" --version
          "$CARGO_HOME/bin/cargo" +"$RUST_TOOLCHAIN" --version
      - name: acquire the exact pinned Swift toolchain image
        run: |
          set -euo pipefail
          docker_path="$(realpath "$(command -v docker)")"
          test -f "$docker_path"
          test ! -L "$docker_path"
          "$docker_path" image inspect "$SWIFT_IMAGE_V1" >/dev/null 2>&1 ||
            /usr/bin/timeout --signal=TERM --kill-after=30s 15m \
              "$docker_path" pull "$SWIFT_IMAGE_V1"
          echo "LABCOLORS_SWIFT_DOCKER=$docker_path" >> "$GITHUB_ENV"
      - name: swift conformance against the compiled native library
        run: bash bindings/swift/ci/run-conformance.sh

  apple-package:
    needs: ["source-admission"]
    name: swift package (macOS and iOS)
    runs-on: [self-hosted, macOS]
    timeout-minutes: 40
    env:
      XCODE_VERSION: '16.4'
      XCODE_BUILD: '16F6'
    steps:
      - name: Require declared execution environment
        shell: bash
        env:
          ACTUAL_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          test "$ACTUAL_RUNNER_ENVIRONMENT" = self-hosted || { echo 'REFUSED: required runner environment is unavailable' >&2; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ needs.source-admission.outputs.source_sha }}
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: '. -> ${{ runner.temp }}/swift-distribution/target'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.14.0'
          package-manager-cache: false
      - name: select the declared Apple toolchain
        run: echo "DEVELOPER_DIR=/Applications/Xcode_$XCODE_VERSION.app/Contents/Developer" >> "$GITHUB_ENV"
      - name: verify Xcode identity
        run: |
          set -euo pipefail
          expected="$(printf 'Xcode %s\nBuild version %s' "$XCODE_VERSION" "$XCODE_BUILD")"
          test "$(xcodebuild -version)" = "$expected"
          swift --version
      - name: install declaration parser and test compiled API verification
        run: |
          npm ci --prefix packages/colors --ignore-scripts
          node --test scripts/test_swift_surface.mjs scripts/test_distribution_notices.mjs
      - name: assemble the self-contained Swift package
        run: python3 bindings/swift/ci/build-apple.py "$RUNNER_TEMP/swift-distribution"
      - name: exercise the exact archive as an external Apple consumer
        run: python3 bindings/swift/ci/test-apple.py "$RUNNER_TEMP/swift-distribution" "$RUNNER_TEMP/swift-consumer"
      - name: compare Swift authoring against an exact prior implementation
        if: inputs.authoring_baseline != ''
        env:
          BASELINE_COMMIT: ${{ inputs.authoring_baseline }}
        run: python3 bindings/swift/ci/benchmark-authoring.py "$RUNNER_TEMP/swift-consumer" "$BASELINE_COMMIT"
  android-build:
    needs: ["source-admission"]
    name: build Android SDK
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 35
    steps:
      - name: Require declared execution environment
        shell: bash
        env:
          ACTUAL_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          test "$ACTUAL_RUNNER_ENVIRONMENT" = self-hosted || { echo 'REFUSED: required runner environment is unavailable' >&2; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ needs.source-admission.outputs.source_sha }}
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
        with:
          workspaces: '. -> ${{ runner.temp }}/android-distribution/target'
          cache-on-failure: true
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: '24.14.0'
          package-manager-cache: false
      - name: install canonical declaration parser
        run: npm ci --prefix packages/colors --ignore-scripts
      - name: verify archive admission and native layout controls
        run: python3 -m unittest discover -s bindings/kotlin/ci -p 'test_*.py'
      - name: build the complete Android AAR and Maven distribution
        run: python3 bindings/kotlin/ci/build.py "$RUNNER_TEMP/android-distribution"
      - name: pass the exact SDK bytes to external consumers
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-sdk-${{ github.sha }}
          path: |
            ${{ runner.temp }}/android-distribution/LabColors.android.zip
            ${{ runner.temp }}/android-distribution/android-release-manifest.json
            ${{ runner.temp }}/android-distribution/SHA256SUMS
            ${{ runner.temp }}/android-distribution/native-surface.json
            ${{ runner.temp }}/android-distribution/authoring-surface.json
          if-no-files-found: error
          retention-days: 1
  android-consumer:
    name: android consumer (${{ matrix.name }})
    needs: ["android-build", "source-admission"]
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: minimum API
            api: 23
            target: default
            page: 4096
          - name: 16 KB
            api: 35
            target: google_apis_ps16k
            page: 16384
    steps:
      - name: Require declared execution environment
        shell: bash
        env:
          ACTUAL_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          test "$ACTUAL_RUNNER_ENVIRONMENT" = self-hosted || { echo 'REFUSED: required runner environment is unavailable' >&2; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ needs.source-admission.outputs.source_sha }}
      - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: android-sdk-${{ github.sha }}
          path: ${{ runner.temp }}/android-artifact
      - name: install the archive into an independent Android project
        run: python3 bindings/kotlin/ci/prepare-consumer.py "$RUNNER_TEMP/android-artifact" "$RUNNER_TEMP/android-consumer"
      - name: compile the independent application and tests before starting an emulator
        run: python3 bindings/kotlin/ci/test-consumer.py "$RUNNER_TEMP/android-consumer" --assemble
      - name: allow this ephemeral runner to use hardware virtualization
        run: sudo setfacl -m "u:$(id -un):rw" /dev/kvm
      - uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        with:
          api-level: ${{ matrix.api }}
          target: ${{ matrix.target }}
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim -camera-back none
          script: python3 bindings/kotlin/ci/test-consumer.py "$RUNNER_TEMP/android-consumer" ${{ matrix.page }}
      - name: verify staged failure artifact inventory
        if: failure()
        run: python3 bindings/kotlin/ci/test-consumer.py "$RUNNER_TEMP/android-consumer" --inventory
  android-package:
    name: android package
    needs: ["android-build", "android-consumer", "source-admission"]
    if: ${{ (always()) && needs.source-admission.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: require the artifact and every Android consumer
        env:
          BUILD_RESULT: ${{ needs.android-build.result }}
          CONSUMER_RESULT: ${{ needs.android-consumer.result }}
        run: |
          set -euo pipefail
          test "$BUILD_RESULT" = success
          test "$CONSUMER_RESULT" = success
