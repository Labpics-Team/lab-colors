name: temporary source preparation
on:
  push:
    branches: [maintenance/colors-source-preparation-20261012]
    paths: [.github/workflows/temporary-source-preparation.yml]
permissions:
  contents: read
jobs:
  prepare:
    if: github.repository == 'Labpics-Team/lab-colors' && github.actor == 'lemone112'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: da9ee6470aa2d75219e6628873985cd3096be9d3
          path: editor
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: 8af0264d024f8e799e0a06cc9c36801e85b0a880
          path: source
          persist-credentials: false
      - name: Prepare static source edits without moving any branch
        working-directory: source
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 ../editor/.maintenance/cleanup_editor.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: colors-source-preparation-${{ github.run_id }}
          path: /tmp/colors-source-preparation/
          if-no-files-found: error
          retention-days: 1
