name: Verification lane replay

# One lane is one run, so a full-domain cover is 512 of them and the dual
# proof needs their ids.  Naming the run after its coordinates makes that list
# a query instead of a guess about creation times.
run-name: >-
  lane ${{ inputs.evidence_artifact }}
  ${{ inputs.window_start }}+${{ inputs.window_points }}
  of ${{ inputs.evidence_run_id }}

on:
  workflow_dispatch:
    inputs:
      evidence_run_id:
        description: run carrying the engine verification evidence (job bytes + comparator bundle)
        required: true
      evidence_artifact:
        description: exact engine artifact name inside the evidence run (verification-evidence-arb | verification-evidence-mpfi)
        required: true
      window_start:
        description: verification lane window start ordinal
        required: true
      window_points:
        description: verification lane window width (packing-aligned multiple of shard_points)
        required: true
      shard_points:
        description: shard window width (multiple of the packing alignment)
        required: false
        default: "16384"

permissions:
  contents: read

concurrency:
  group: verification-lane-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  verification-lane:
    name: replay one verification window under the engine comparator
    # Dispatch-only: each lane replays one packing-aligned window of the
    # verified transcript's domain through the sharded corpus runner under
    # the engine's own comparator bundle, downloaded from the evidence run.
    runs-on: ubuntu-latest
    timeout-minutes: 480
    permissions:
      contents: read
      # Required by `gh run download` when fetching the engine evidence from
      # another run.
      actions: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
      EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
      EVIDENCE_ARTIFACT: ${{ inputs.evidence_artifact }}
      WINDOW_START: ${{ inputs.window_start }}
      WINDOW_POINTS: ${{ inputs.window_points }}
      SHARD_POINTS: ${{ inputs.shard_points }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: download the engine verification evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          case "${EVIDENCE_RUN_ID}" in
            ''|*[!0-9]*) echo "evidence_run_id must be a positive integer" >&2; exit 64;;
          esac
          # One evidence run carries one artifact per engine; a glob download
          # plus a directory-order pick could silently bind the foreign
          # engine's bundle, so the lane downloads exactly the bound artifact.
          case "${EVIDENCE_ARTIFACT}" in
            verification-evidence-arb|verification-evidence-mpfi) ;;
            *) echo "evidence_artifact must be an allowlisted engine artifact" >&2; exit 64;;
          esac
          mkdir -p "evidence-in/${EVIDENCE_ARTIFACT}"
          gh run download "${EVIDENCE_RUN_ID}" \
            --repo '${{ github.repository }}' \
            --name "${EVIDENCE_ARTIFACT}" \
            --dir "evidence-in/${EVIDENCE_ARTIFACT}"

      - name: replay the verification window lane
        shell: bash
        run: |
          set -euo pipefail
          for coordinate in WINDOW_START WINDOW_POINTS SHARD_POINTS; do
            value="${!coordinate}"
            case "${value}" in
              ''|*[!0-9]*) echo "${coordinate} must be a non-negative integer" >&2; exit 64;;
            esac
          done
          evidence="evidence-in/${EVIDENCE_ARTIFACT}"
          test -f "${evidence}/job.bin"
          test -f "${evidence}/comparator-bundle/comparator-manifest-v2.bin"
          python3 proof/region/v1/corpus_lane.py \
            --job "${evidence}/job.bin" \
            --comparator-bundle "${evidence}/comparator-bundle" \
            --window-start "${WINDOW_START}" \
            --window-points "${WINDOW_POINTS}" \
            --shard-points "${SHARD_POINTS}" \
            --out lane-out

      - name: upload the verification lane wire evidence
        # The engine belongs in the name because both engines replay the same
        # window plan: without it every Arb lane and its MPFI twin claim one
        # artifact name, and a cover gathered from many runs would overwrite
        # itself down to one engine.  The name is only for keeping the files
        # apart — which engine a lane actually serves is decided by the
        # comparator source identity inside its manifest.
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: verification-lane-${{ inputs.evidence_artifact }}-${{ inputs.window_start }}-${{ inputs.window_points }}
          path: lane-out/
          if-no-files-found: error
