name: Verification lane replay

# One lane is one run, so a full-domain cover is 512 of them and the dual
# proof needs their ids.  Naming the run after its coordinates makes that list
# a query instead of a guess about creation times.
run-name: >-
  lane ${{ inputs.evidence_artifact }}
  ${{ inputs.window_start }}+${{ inputs.window_points }}
  of ${{ inputs.evidence_run_id }}

on:
  workflow_dispatch:
    inputs:
      evidence_run_id:
        description: run carrying the engine verification evidence (job bytes + comparator bundle)
        required: true
      evidence_artifact:
        description: exact engine artifact name inside the evidence run (verification-evidence-arb | verification-evidence-mpfi)
        required: true
      window_start:
        description: verification lane window start ordinal
        required: true
      window_points:
        description: verification lane window width (packing-aligned multiple of shard_points)
        required: true
      shard_points:
        description: shard window width (multiple of the packing alignment)
        required: false
        default: "16384"
      # The coordinator's own safety flags live in the coordinator, so a
      # checkout older than the flag carries the older contract whole: this
      # project has twice dispatched a campaign while reading the newer rules
      # (133 runs, then 69).  No guard added to the client can protect a
      # client that is stale.  This input is the same invariant asserted
      # where it is always current — a dispatch that omits it never starts a
      # runner, and one that carries an incoherent campaign size stops in the
      # first second rather than after an hour of replay.
      expect_lanes:
        description: lanes in the full-domain campaign this lane belongs to (2^24 / window_points)
        required: true

permissions:
  contents: read

concurrency:
  group: verification-lane-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  verification-lane:
    name: replay one verification window under the engine comparator
    # Dispatch-only: each lane replays one packing-aligned window of the
    # verified transcript's domain through the sharded corpus runner under
    # the engine's own comparator bundle, downloaded from the evidence run.
    runs-on: self-hosted
    timeout-minutes: 480
    permissions:
      contents: read
      # Required by `gh run download` when fetching the engine evidence from
      # another run.
      actions: read
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
      EVIDENCE_RUN_ID: ${{ inputs.evidence_run_id }}
      EVIDENCE_ARTIFACT: ${{ inputs.evidence_artifact }}
      WINDOW_START: ${{ inputs.window_start }}
      WINDOW_POINTS: ${{ inputs.window_points }}
      SHARD_POINTS: ${{ inputs.shard_points }}
      EXPECT_LANES: ${{ inputs.expect_lanes }}
    steps:
      - name: refuse a lane that does not belong to a coherent campaign
        shell: bash
        run: |
          set -euo pipefail
          # Arithmetic, not a token: a lane is admissible only if its own
          # width tiles the full sRGB8 domain exactly into the campaign the
          # dispatcher claims.  Nothing here can be satisfied by an older
          # coordinator, and nothing here needs the repository to be read.
          # `case` compares raw bytes.  `[ -eq ]` and Python's `int()` both
          # accept surrounding whitespace, so either would admit a
          # coordinate carrying the carriage return a Windows shell leaves
          # behind; and `$(( ))` reads a leading zero as octal, so `0100000`
          # would be 32768 here and 100000 in the lane runner — one dispatch
          # describing two different windows.
          case "${WINDOW_POINTS}" in
            ''|*[!0-9]*|0) echo "window_points must be a positive integer" >&2; exit 64;;
            0*) echo "window_points must not carry leading zeros" >&2; exit 64;;
          esac
          case "${EXPECT_LANES}" in
            ''|*[!0-9]*|0) echo "expect_lanes must be a positive integer" >&2; exit 64;;
          esac
          # Both coordinates are bounded by the domain and the domain is
          # eight digits, so anything longer is out of range by
          # construction — and it has to be refused before the arithmetic
          # rather than by it: `$(( ))` wraps silently at 2^64, where
          # `18446744073709551616` reads as a perfectly aligned zero, and
          # `[ -ge ]` answers "not greater" for a value it cannot parse.
          if [ "${#WINDOW_POINTS}" -gt 8 ] || [ "${#WINDOW_START}" -gt 8 ]; then
            echo "window ${WINDOW_START}+${WINDOW_POINTS} is outside the sRGB8 domain" >&2
            exit 64
          fi
          domain=16777216
          if [ $(( domain % WINDOW_POINTS )) -ne 0 ]; then
            echo "window_points ${WINDOW_POINTS} does not tile the full domain" >&2
            exit 64
          fi
          lanes=$(( domain / WINDOW_POINTS ))
          # Compared as bytes, because both sides are canonical decimals by
          # now and a numeric comparison is the one that can answer "equal"
          # about something it failed to read: `[ -ne ]` errors out on a
          # size past the shell's own integer, and the guard would then
          # read that error as a match.
          if [ "${lanes}" != "${EXPECT_LANES}" ]; then
            echo "campaign size ${EXPECT_LANES} contradicts the plan: a" \
                 "${WINDOW_POINTS}-point window covers the domain in ${lanes} lanes" >&2
            exit 64
          fi
          # The run-name renders these coordinates, and the collector binds a
          # run to its plan window by reading that name back.  So a start the
          # name cannot render canonically is a lane whose hour of replay can
          # never be claimed: 254 lanes were dispatched with a carriage return
          # inside this value and were only discovered by counting the cover.
          # `case` compares the raw bytes, where `[ -eq ]` and `int()` would
          # both quietly accept the surrounding whitespace.
          case "${WINDOW_START}" in
            ''|*[!0-9]*) echo "window_start must be a canonical decimal" >&2; exit 64;;
            0) ;;
            0*) echo "window_start must not carry leading zeros" >&2; exit 64;;
          esac
          if [ "${WINDOW_START}" -ge "${domain}" ]; then
            echo "window_start ${WINDOW_START} is outside the sRGB8 domain" >&2
            exit 64
          fi
          if [ $(( WINDOW_START % WINDOW_POINTS )) -ne 0 ]; then
            echo "window_start ${WINDOW_START} is not a seam of a" \
                 "${WINDOW_POINTS}-point cover" >&2
            exit 64
          fi

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: download the engine verification evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          case "${EVIDENCE_RUN_ID}" in
            ''|*[!0-9]*) echo "evidence_run_id must be a positive integer" >&2; exit 64;;
          esac
          # One evidence run carries one artifact per engine; a glob download
          # plus a directory-order pick could silently bind the foreign
          # engine's bundle, so the lane downloads exactly the bound artifact.
          case "${EVIDENCE_ARTIFACT}" in
            verification-evidence-arb|verification-evidence-mpfi) ;;
            *) echo "evidence_artifact must be an allowlisted engine artifact" >&2; exit 64;;
          esac
          mkdir -p "evidence-in/${EVIDENCE_ARTIFACT}"
          gh run download "${EVIDENCE_RUN_ID}" \
            --repo '${{ github.repository }}' \
            --name "${EVIDENCE_ARTIFACT}" \
            --dir "evidence-in/${EVIDENCE_ARTIFACT}"

      - name: replay the verification window lane
        shell: bash
        run: |
          set -euo pipefail
          for coordinate in WINDOW_START WINDOW_POINTS SHARD_POINTS; do
            value="${!coordinate}"
            case "${value}" in
              ''|*[!0-9]*) echo "${coordinate} must be a non-negative integer" >&2; exit 64;;
            esac
          done
          evidence="evidence-in/${EVIDENCE_ARTIFACT}"
          test -f "${evidence}/job.bin"
          test -f "${evidence}/comparator-bundle/comparator-manifest-v2.bin"
          python3 proof/region/v1/corpus_lane.py \
            --job "${evidence}/job.bin" \
            --comparator-bundle "${evidence}/comparator-bundle" \
            --window-start "${WINDOW_START}" \
            --window-points "${WINDOW_POINTS}" \
            --shard-points "${SHARD_POINTS}" \
            --out lane-out

      - name: upload the verification lane wire evidence
        # The engine belongs in the name because both engines replay the same
        # window plan: without it every Arb lane and its MPFI twin claim one
        # artifact name, and a cover gathered from many runs would overwrite
        # itself down to one engine.  The name is only for keeping the files
        # apart — which engine a lane actually serves is decided by the
        # comparator source identity inside its manifest.
        uses: actions/upload-artifact@65c4c4a1ddee5b72f698fdd19549f0f0fb45cf08 # v4.6.0
        with:
          name: verification-lane-${{ inputs.evidence_artifact }}-${{ inputs.window_start }}-${{ inputs.window_points }}
          path: lane-out/
          if-no-files-found: error
