name: Arb evaluator build and runtime

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - .github/workflows/arb-proof-observation.yml
      - crates/labcolors-core/contracts/contextual-region-formula-v1.lcir
      - proof/region/v1/**
  pull_request:
    paths:
      - .github/workflows/arb-proof-observation.yml
      - crates/labcolors-core/contracts/contextual-region-formula-v1.lcir
      - proof/region/v1/**

permissions:
  contents: read

concurrency:
  group: arb-evaluator-build-runtime-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  diagnostic-build-runtime:
    name: two offline builds and runtime tests (no artifact)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 360
    if: >-
      (github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository)
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONHASHSEED: "0"
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: acquire and hash-check exact source archives
        shell: bash
        run: |
          set -euo pipefail
          source_dir="$RUNNER_TEMP/arb-source-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          install -d -m 0700 "$source_dir"
          echo "LABCOLORS_ARB_SOURCE_DIR=$source_dir" >> "$GITHUB_ENV"
          export PYTHONPATH="$GITHUB_WORKSPACE/proof/region/v1"
          python3 - <<'PY' > "$source_dir/lock.tsv"
          import provenance

          for source in provenance.arb_source_lock_v1().sources:
              print(
                  source.role.name,
                  source.archive_url,
                  source.archive_sha256.hex(),
                  source.archive_length,
                  sep="\t",
              )
          PY
          count=0
          while IFS=$'\t' read -r role url digest length; do
            archive="$source_dir/${role}.archive"
            curl --fail --location --silent --show-error "$url" --output "$archive"
            test "$(stat --format=%s "$archive")" = "$length"
            echo "$digest  $archive" | sha256sum --check --strict
            case "$role" in
              GMP) echo "LABCOLORS_GMP_ARCHIVE=$archive" >> "$GITHUB_ENV" ;;
              MPFR) echo "LABCOLORS_MPFR_ARCHIVE=$archive" >> "$GITHUB_ENV" ;;
              FLINT_ARB) echo "LABCOLORS_FLINT_ARCHIVE=$archive" >> "$GITHUB_ENV" ;;
              *) exit 64 ;;
            esac
            count=$((count + 1))
          done < "$source_dir/lock.tsv"
          test "$count" -eq 3

      - name: acquire the exact pinned OCI manifest
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/proof/region/v1:$GITHUB_WORKSPACE/proof/region/v1/arb"
          docker_path="$(realpath "$(command -v docker)")"
          test -f "$docker_path"
          test ! -L "$docker_path"
          image="$(python3 - <<'PY'
          import pipeline
          print(pipeline.OCI_IMAGE_REFERENCE_V1)
          PY
          )"
          "$docker_path" image inspect "$image" >/dev/null 2>&1 ||
            "$docker_path" pull "$image"
          echo "LABCOLORS_ARB_PIPELINE_DOCKER=$docker_path" >> "$GITHUB_ENV"

      - name: require the exact diagnostic Docker boundary
        shell: bash
        run: |
          set -euo pipefail
          export PYTHONPATH="$GITHUB_WORKSPACE/proof/region/v1:$GITHUB_WORKSPACE/proof/region/v1/arb"
          export LABCOLORS_ARB_PIPELINE_DOCKER
          python3 - <<'PY'
          import os
          import sys
          from pathlib import Path

          import pipeline

          docker = pipeline.NativeDockerBuildBackendV1(
              Path(os.environ["LABCOLORS_ARB_PIPELINE_DOCKER"])
          ).probe()
          print(repr(docker))
          if type(docker) is not pipeline.DockerSupportedV1:
              sys.exit(78)
          PY

      - name: two fresh offline builds and all evaluator tests
        shell: bash
        run: |
          set -euo pipefail
          log="$RUNNER_TEMP/arb-evaluator-build-runtime.log"
          python3 -m unittest -v \
            proof.region.v1.arb.tests.test_pipeline.NativeBuildIntegrationTests \
            2>&1 | tee "$log"
          if grep --ignore-case --quiet skipped "$log"; then
            echo "Arb build/runtime integration was vacuously skipped" >&2
            exit 1
          fi

      # No upload step: the static binary is an ephemeral observation until a
      # linker/member inventory plus notices/source/relink distribution gate exists.

      - name: remove acquired source archives
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "${LABCOLORS_ARB_SOURCE_DIR:-}" ]]; then
            rm -rf -- "$LABCOLORS_ARB_SOURCE_DIR"
          fi
