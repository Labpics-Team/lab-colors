name: FV-01 guarded core seam patch

on:
  push:
    branches:
      - r12/fv-01-attached-materialization-authority

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: r12/fv-01-attached-materialization-authority
          fetch-depth: 2
      - name: Apply exact guarded source edits
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f"{path}: expected exactly one anchor, found {count}: {old[:100]!r}")
              p.write_text(text.replace(old, new, 1))

          ps = "crates/labcolors-core/src/program_session.rs"
          replace_once(
              ps,
              "pub(crate) struct ProgramOwnerLeaseV1<Evaluation>(Rc<ProgramEpochV1<Evaluation>>)\nwhere\n    Evaluation: ProgramConstraintEvaluatorSetV1,\n    ProgramConstraintInvocationOf<Evaluation>: Copy;\n",
              "pub(crate) struct ProgramOwnerLeaseV1<Evaluation>(Rc<ProgramEpochV1<Evaluation>>)\nwhere\n    Evaluation: ProgramConstraintEvaluatorSetV1,\n    ProgramConstraintInvocationOf<Evaluation>: Copy;\n\nimpl<Evaluation> Clone for ProgramOwnerLeaseV1<Evaluation>\nwhere\n    Evaluation: ProgramConstraintEvaluatorSetV1,\n    ProgramConstraintInvocationOf<Evaluation>: Copy,\n{\n    fn clone(&self) -> Self {\n        Self(Rc::clone(&self.0))\n    }\n}\n\nimpl<Evaluation> ProgramOwnerLeaseV1<Evaluation>\nwhere\n    Evaluation: ProgramConstraintEvaluatorSetV1,\n    ProgramConstraintInvocationOf<Evaluation>: Copy,\n{\n    pub(crate) fn same_generation(&self, other: &Self) -> bool {\n        Rc::ptr_eq(&self.0, &other.0)\n    }\n}\n",
          )
          replace_once(
              ps,
              "    root: PresentationRootId,\n    occurrence: OccurrenceId,\n}\n\nimpl CompiledPointOutputPresentationV1 {",
              "    root: PresentationRootId,\n    occurrence: OccurrenceId,\n    terminal: OccurrenceId,\n    terminal_context: AppearanceContextId,\n}\n\nimpl CompiledPointOutputPresentationV1 {",
          )
          replace_once(
              ps,
              "    pub(crate) const fn occurrence(self) -> OccurrenceId {\n        self.occurrence\n    }\n}\n",
              "    pub(crate) const fn occurrence(self) -> OccurrenceId {\n        self.occurrence\n    }\n\n    pub(crate) const fn terminal(self) -> OccurrenceId {\n        self.terminal\n    }\n\n    pub(crate) const fn terminal_context(self) -> AppearanceContextId {\n        self.terminal_context\n    }\n}\n",
          )
          replace_once(
              ps,
              "        Ok(CompiledPointOutputPresentationV1 {\n            output_ordinal,\n            output,\n            paint: compiled_output.paint_id,\n            presentation_ordinal,\n            root,\n            occurrence,\n        })",
              "        let compiled_presentation = &self.owner_generation.point_presentations.entries[presentation_ordinal];\n        Ok(CompiledPointOutputPresentationV1 {\n            output_ordinal,\n            output,\n            paint: compiled_output.paint_id,\n            presentation_ordinal,\n            root,\n            occurrence,\n            terminal: compiled_presentation.terminal,\n            terminal_context: compiled_presentation.terminal_context,\n        })",
          )
          replace_once(
              ps,
              "struct CompiledPointPresentationV1 {\n    root: PresentationRootId,\n    terminal: OccurrenceId,\n    target: OccurrenceId,",
              "struct CompiledPointPresentationV1 {\n    root: PresentationRootId,\n    terminal: OccurrenceId,\n    terminal_context: AppearanceContextId,\n    target: OccurrenceId,",
          )
          replace_once(
              ps,
              "    let point_presentations = compile_point_presentations(\n        &graph,\n        &mut program.presentation_roots,\n        &mut program.presentation_targets,\n    )?;",
              "    let point_presentations = compile_point_presentations(\n        &graph,\n        &all_occurrence_contexts,\n        &mut program.presentation_roots,\n        &mut program.presentation_targets,\n    )?;",
          )
          replace_once(
              ps,
              "fn compile_point_presentations(\n    graph: &CompiledAppearanceGraph,\n    roots: &mut [PointPresentationRootV1],",
              "fn compile_point_presentations(\n    graph: &CompiledAppearanceGraph,\n    occurrence_contexts: &[CompiledOccurrenceContextV1],\n    roots: &mut [PointPresentationRootV1],",
          )
          replace_once(
              ps,
              "        let terminal = compiled_root.terminal();\n        let path = graph",
              "        let terminal = compiled_root.terminal();\n        let terminal_context_index = occurrence_contexts\n            .binary_search_by_key(&terminal, |binding| binding.occurrence)\n            .map_err(|_| ProgramCompileError::InternalInvariant)?;\n        let terminal_context = occurrence_contexts[terminal_context_index].context;\n        let path = graph",
          )
          replace_once(
              ps,
              "        compiled.push(CompiledPointPresentationV1 {\n            root: target.root,\n            terminal,\n            target: target.occurrence,",
              "        compiled.push(CompiledPointPresentationV1 {\n            root: target.root,\n            terminal,\n            terminal_context,\n            target: target.occurrence,",
          )

          attachment = "crates/labcolors-core/src/program/attachment.rs"
          replace_once(
              attachment,
              "#[cfg(feature = \"private-fixture\")]\npub(crate) mod handoff;",
              "pub(crate) mod fv01;\n#[cfg(feature = \"private-fixture\")]\npub(crate) mod handoff;",
          )
          PY
          cargo fmt --all
          rm .github/workflows/fv01-core-seam-patch.yml
      - name: Commit guarded patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/labcolors-core/src/program_session.rs crates/labcolors-core/src/program/attachment.rs crates/labcolors-core/src/program/attachment/fv01.rs .github/workflows/fv01-core-seam-patch.yml
          git diff --cached --check
          git commit -m "feat(fv-01): bind terminal context into attachment authority"
          git push origin HEAD:r12/fv-01-attached-materialization-authority
