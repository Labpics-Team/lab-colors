name: fmt-probe

on:
  pull_request:
    paths:
      - ".github/workflows/fmt-probe.yml"

permissions:
  contents: write

# Одноразовый редактор точной строки; удаляется после успешного push.
jobs:
  apply:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: agent/scientific-color-core
      - name: replace stale guidance and commit
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path("crates/labcolors-core/src/cleanliness_legacy.rs")
          text = path.read_text()
          old = """//! Новый код должен использовать явно версионированный отчёт V2 из родительского
//! модуля `cleanliness`.
"""
          new = """//! Новый production-код должен использовать типизированный экранный отчёт из
//! `crate::color_quality`; V1 остаётся только воспроизводимым research baseline.
"""
          if text.count(old) != 1:
              raise SystemExit("ожидалась ровно одна устаревшая формулировка")
          path.write_text(text.replace(old, new))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add crates/labcolors-core/src/cleanliness_legacy.rs
          git commit -m "docs(cleanliness): point legacy V1 to ColorQuality"
          git push origin HEAD:agent/scientific-color-core
