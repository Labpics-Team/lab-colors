name: fmt-probe

on:
  pull_request:
    paths:
      - "crates/labcolors-core/src/color_quality.rs"
      - "crates/labcolors-core/src/cleanliness.rs"
      - "crates/labcolors-core/src/lib.rs"
      - "crates/labcolors-core/tests/color_quality_contract.rs"
      - ".github/workflows/fmt-probe.yml"

permissions:
  contents: write

env:
  RUST_TOOLCHAIN: 1.96.0

jobs:
  apply:
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: agent/scientific-color-core
      - name: isolated toolchain environment
        run: |
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup-$GITHUB_JOB" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$RUNNER_TEMP/cargo-$GITHUB_JOB" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP/tmp-$GITHUB_JOB" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/tmp-$GITHUB_JOB"
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master @ 2026-03-27
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - name: apply and commit exact rustfmt output
        run: |
          cargo fmt --all
          if ! git diff --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add crates/labcolors-core/src/color_quality.rs \
              crates/labcolors-core/src/cleanliness.rs \
              crates/labcolors-core/src/lib.rs \
              crates/labcolors-core/tests/color_quality_contract.rs
            git commit -m "style(color-quality): apply pinned rustfmt 1.96"
            git push origin HEAD:agent/scientific-color-core
          fi
