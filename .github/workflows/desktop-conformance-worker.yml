name: Desktop Colors distribution

on:
  workflow_call:
    outputs:
      checks:
        description: Desktop package and its installed consumers
        value: ${{ format('{{"results":{0},"children":{1}}}', toJSON(jobs.*.result), toJSON(jobs.*.outputs.checks)) }}

permissions:
  contents: read

jobs:
  native:
    name: native library (${{ matrix.platform }})
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # BEGIN generated desktop platforms
      matrix: &desktop-platforms
        include:
          - {"target": "x86_64-pc-windows-msvc", "platform": "win32-x86-64", "library": "labcolors.dll", "runner": "windows-latest", "container": null, "java": "temurin"}
          - {"target": "aarch64-pc-windows-msvc", "platform": "win32-aarch64", "library": "labcolors.dll", "runner": "windows-11-arm", "container": null, "java": "microsoft"}
          - {"target": "aarch64-apple-darwin", "platform": "darwin-aarch64", "library": "liblabcolors.dylib", "runner": "macos-15", "container": null, "java": "temurin"}
          - {"target": "x86_64-unknown-linux-gnu", "platform": "linux-x86-64", "library": "liblabcolors.so", "runner": "ubuntu-24.04", "container": "ubuntu:20.04", "java": "temurin"}
          - {"target": "aarch64-unknown-linux-gnu", "platform": "linux-aarch64", "library": "liblabcolors.so", "runner": "ubuntu-24.04-arm", "container": "ubuntu:20.04", "java": "temurin"}
      # END generated desktop platforms
    steps:
      - name: prepare minimum Linux userspace
        if: runner.os == 'Linux'
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates curl git python3 build-essential pkg-config
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions-rust-lang/setup-rust-toolchain@a188e68d0fd2bd36ad51dccb2b07ba6e75105f30
        with:
          cache: false
          rustflags: ""
      - name: Carry the selected Rust environment into every build root
        shell: bash
        run: python3 scripts/ci/rust_environment.py
      - name: trust this mounted checkout inside the Linux container
        if: runner.os == 'Linux'
        shell: bash
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: '. -> ${{ runner.temp }}/desktop-native/target'
          key: ${{ matrix.platform }}-ubuntu20
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: '24.14.0'
          package-manager-cache: false
      - name: build native library and matching Kotlin API
        shell: bash
        run: python3 bindings/kotlin/desktop/ci/build_native.py "$RUNNER_TEMP/desktop-native"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-native-${{ matrix.platform }}-${{ github.sha }}
          path: ${{ runner.temp }}/desktop-native/LabColors.*.zip
          if-no-files-found: error
          retention-days: 3

  package:
    name: assemble desktop Maven package
    needs: native
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: temurin
          java-version: '17'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          pattern: desktop-native-*-${{ github.sha }}
          path: ${{ runner.temp }}/desktop-parts
          merge-multiple: true
      - name: assemble all platforms from the same revision
        run: python3 bindings/kotlin/desktop/ci/package.py "$RUNNER_TEMP/desktop-parts" "$RUNNER_TEMP/desktop-distribution"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: desktop-sdk-${{ github.sha }}
          path: |
            ${{ runner.temp }}/desktop-distribution/LabColors.desktop.zip
            ${{ runner.temp }}/desktop-distribution/desktop-release-manifest.json
            ${{ runner.temp }}/desktop-distribution/SHA256SUMS
          if-no-files-found: error
          retention-days: 3

  complete:
    name: desktop package
    needs: [native, package, consumer]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: require the complete package and every installed consumer
        env:
          NATIVE_RESULT: ${{ needs.native.result }}
          PACKAGE_RESULT: ${{ needs.package.result }}
          CONSUMER_RESULT: ${{ needs.consumer.result }}
        run: |
          test "$NATIVE_RESULT" = success
          test "$PACKAGE_RESULT" = success
          test "$CONSUMER_RESULT" = success

  consumer:
    name: installed desktop Program (${{ matrix.platform }})
    needs: package
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.container }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix: *desktop-platforms
    steps:
      - name: prepare minimum Linux userspace
        if: runner.os == 'Linux'
        run: apt-get update && DEBIAN_FRONTEND=noninteractive apt-get install -y ca-certificates curl git python3 libfreetype6 libfontconfig1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880
        with:
          distribution: ${{ matrix.java }}
          java-version: '17'
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        with:
          name: desktop-sdk-${{ github.sha }}
          path: ${{ runner.temp }}/desktop-distribution
      - name: run exact published bytes with automatic JNA loading
        shell: bash
        run: |
          if [ "$RUNNER_OS" = "Linux" ]; then git config --global --add safe.directory "$GITHUB_WORKSPACE"; fi
          python3 bindings/kotlin/desktop/ci/test_consumer.py "$RUNNER_TEMP/desktop-distribution" "$RUNNER_TEMP/desktop-consumer"
