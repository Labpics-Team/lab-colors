name: FV-01 guarded authority-parts patch

on:
  push:
    branches:
      - r12/fv-01-attached-materialization-authority

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: r12/fv-01-attached-materialization-authority
          fetch-depth: 2
      - name: Replace positional mint args with one typed parts object
        shell: bash
        run: |
          python3 - <<'PY'
          from base64 import b64decode
          from pathlib import Path
          d = lambda value: b64decode(value).decode()

          def once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if text.count(old) != 1:
                  raise SystemExit(f'{path}: expected one guarded anchor, found {text.count(old)}')
              p.write_text(text.replace(old, new, 1))

          facade = 'crates/labcolors-core/src/program_wire/fv01.rs'
          once(facade, d('aW1wbCBBdHRhY2hlZE1hdGVyaWFsaXphdGlvbkF1dGhvcml0eVYxIHsK'), d(''))
          once(facade, d(''), d(''))

          root = 'crates/labcolors-core/src/program_wire.rs'
          once(root, d('cHViKGNyYXRlKSB1c2UgZnYwMTo6QXR0YWNoZWRNYXRlcmlhbGl6YXRpb25DYXNlUHJvb2ZWMTsK'), d('cHViKGNyYXRlKSB1c2UgZnYwMTo6ewogICAgQXR0YWNoZWRNYXRlcmlhbGl6YXRpb25BdXRob3JpdHlQYXJ0c1YxLCBBdHRhY2hlZE1hdGVyaWFsaXphdGlvbkNhc2VQcm9vZlYxLAp9Owo='))

          implp = 'crates/labcolors-core/src/program/attachment/fv01.rs'
          once(implp, d('ICAgIEF0dGFjaGVkTWF0ZXJpYWxpemF0aW9uQXV0aG9yaXR5RXJyb3JWMSwgQXR0YWNoZWRNYXRlcmlhbGl6YXRpb25BdXRob3JpdHlWMSwKICAgIEF0dGFjaGVkTWF0ZXJpYWxpemF0aW9uQ2FzZVByb29mVjEsIEF0dGFjaGVkUG9pbnRTaW5rQWRtaXNzaW9uRXJyb3JWMSwK'), d('ICAgIEF0dGFjaGVkTWF0ZXJpYWxpemF0aW9uQXV0aG9yaXR5RXJyb3JWMSwgQXR0YWNoZWRNYXRlcmlhbGl6YXRpb25BdXRob3JpdHlQYXJ0c1YxLAogICAgQXR0YWNoZWRNYXRlcmlhbGl6YXRpb25BdXRob3JpdHlWMSwgQXR0YWNoZWRNYXRlcmlhbGl6YXRpb25DYXNlUHJvb2ZWMSwKICAgIEF0dGFjaGVkUG9pbnRTaW5rQWRtaXNzaW9uRXJyb3JWMSwK'))
          once(implp, d(''), d(''))
          PY
          cargo fmt --all
          rm .github/workflows/fv01-authority-parts-patch.yml
      - name: Commit guarded patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/labcolors-core/src/program_wire/fv01.rs crates/labcolors-core/src/program_wire.rs crates/labcolors-core/src/program/attachment/fv01.rs .github/workflows/fv01-authority-parts-patch.yml
          git diff --cached --check
          git commit -m "refactor(fv-01): group authority mint inputs"
          git push origin HEAD:r12/fv-01-attached-materialization-authority
