name: FV-01 finalize exact evidence

on:
  push:
    branches:
      - r12/fv-01-attached-materialization-authority

permissions:
  contents: write

jobs:
  finalize:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: r12/fv-01-attached-materialization-authority
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.96.0
          components: rustfmt
      - name: Bind measured WASM identity and refresh exact evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import re
          from pathlib import Path

          budget_path = Path("packages/colors/bench/wasm.json")
          budget = json.loads(budget_path.read_text(encoding="utf-8"))
          if budget["measurement"]["rawBytes"] != 433669:
              raise SystemExit("unexpected previous WASM measurement")
          if budget["policy"]["maxRawBytes"] != 433669:
              raise SystemExit("unexpected previous WASM ceiling")
          budget["measurement"]["source"] = "github-actions-run-34916537177"
          budget["measurement"]["rawBytes"] = 432200
          budget["policy"]["maxRawBytes"] = 432200
          encoded = json.dumps(budget, indent=2, ensure_ascii=False) + "\n"
          digest = hashlib.sha256(encoded.encode("utf-8")).hexdigest()
          if digest != "58f975ca1c5125bea830c13d784a974d2dc07251de14e83eaf4c86a66c349390":
              raise SystemExit(f"unexpected canonical WASM budget digest: {digest}")
          budget_path.write_text(encoded, encoding="utf-8")

          script_path = Path("scripts/check-wasm-size-budget.mjs")
          script = script_path.read_text(encoding="utf-8")
          updated, count = re.subn(
              r'export const WASM_BUDGET_FILE_SHA256 = "[0-9a-f]{64}";',
              f'export const WASM_BUDGET_FILE_SHA256 = "{digest}";',
              script,
          )
          if count != 1:
              raise SystemExit(f"expected exactly one WASM budget hash binding, got {count}")
          script_path.write_text(updated, encoding="utf-8")
          PY
          cargo fmt --all --check
          rm .github/workflows/fv01-finalize-evidence.yml
          python3 scripts/_regen_receipt_wt.py
          python3 scripts/verify_clean_set_receipt.py product --product-root "$PWD"
          python3 scripts/artifact_matrix.py refresh
          python3 scripts/artifact_matrix.py check
          git diff --check
      - name: Commit final evidence tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "chore(fv-01): bind final measured evidence"
          git push origin HEAD:r12/fv-01-attached-materialization-authority
