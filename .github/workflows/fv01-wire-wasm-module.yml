name: FV-01 wire attached WASM module

on:
  push:
    branches:
      - r12/fv-01-attached-materialization-authority

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: r12/fv-01-attached-materialization-authority
          fetch-depth: 2
      - name: Re-export the attached WASM boundary
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('crates/labcolors-wasm/src/lib.rs')
          text = path.read_text()
          old = 'mod error;\nmod terminal_projection;\n'
          new = 'mod attached;\nmod error;\nmod terminal_projection;\n\npub use attached::*;\n'
          if text.count(old) != 1:
              raise SystemExit('WASM module root anchor changed')
          if 'pub use attached::*;' in text:
              raise SystemExit('attached WASM module already re-exported')
          path.write_text(text.replace(old, new, 1))
          PY
          cargo fmt --all
          rm .github/workflows/fv01-wire-wasm-module.yml
      - name: Commit module wiring
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/labcolors-wasm/src/lib.rs crates/labcolors-wasm/src/attached.rs crates/labcolors-wasm/tests/fv01_attached_surface.rs .github/workflows/fv01-wire-wasm-module.yml
          git diff --cached --check
          git commit -m "feat(fv-01): wire attached WASM exports"
          git push origin HEAD:r12/fv-01-attached-materialization-authority
