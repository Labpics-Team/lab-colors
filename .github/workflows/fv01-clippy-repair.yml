name: FV-01 clippy contract repair

on:
  push:
    branches:
      - r12/fv-01-attached-materialization-authority

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: r12/fv-01-attached-materialization-authority
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.96.0
          components: clippy,rustfmt
      - name: Repair typed result seam and stale lint expectation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          attachment_path = Path("crates/labcolors-core/src/program/attachment.rs")
          attachment = attachment_path.read_text(encoding="utf-8")
          anchor = '''type AttachmentUpdateResultV1<'a, L> = Result<
              AttachmentCommitV1<'a, <L as PointSinkWriterV1>::OutputId>,
              AttachmentUpdateErrorV1<<L as PointSinkWriterV1>::Error>,
          >;
          '''
          if attachment.count(anchor) != 1:
              raise SystemExit("AttachmentUpdateResultV1 anchor drifted")
          alias = anchor + '''
          type AttachmentPreinstallResultV1<'a, L, R, E> = Result<
              (AttachmentCommitV1<'a, <L as PointSinkWriterV1>::OutputId>, R),
              AttachmentPreinstallErrorV1<<L as PointSinkWriterV1>::Error, E>,
          >;
          '''
          attachment = attachment.replace(anchor, alias, 1)
          old_signature = ''') -> Result<(AttachmentCommitV1<'_, W::OutputId>, R), AttachmentPreinstallErrorV1<W::Error, E>>'''
          count = attachment.count(old_signature)
          if count != 2:
              raise SystemExit(f"expected two preinstall result signatures, got {count}")
          attachment = attachment.replace(
              old_signature,
              ") -> AttachmentPreinstallResultV1<'_, W, R, E>",
          )
          attachment_path.write_text(attachment, encoding="utf-8")

          lib_path = Path("crates/labcolors-core/src/lib.rs")
          lib = lib_path.read_text(encoding="utf-8")
          stale = '''#[cfg_attr(
              not(test),
              expect(
                  dead_code,
                  reason = "the generic Session engine is used only through the staged Program owner"
              )
          )]
          pub(crate) mod session;
          '''
          if lib.count(stale) != 1:
              raise SystemExit("session dead-code expectation drifted")
          lib = lib.replace(stale, "pub(crate) mod session;\n", 1)
          lib_path.write_text(lib, encoding="utf-8")
          PY
          cargo fmt --all
          cargo fmt --all --check
          cargo clippy --workspace --all-targets --locked -- -D warnings
          rm .github/workflows/fv01-clippy-repair.yml
          python3 scripts/_regen_receipt_wt.py
          python3 scripts/verify_clean_set_receipt.py product --product-root "$PWD"
          python3 scripts/artifact_matrix.py refresh
          python3 scripts/artifact_matrix.py check
          git diff --check
      - name: Commit repaired final tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "fix(fv-01): close strict lint contract"
          git push origin HEAD:r12/fv-01-attached-materialization-authority
