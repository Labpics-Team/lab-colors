name: comment-audit-export

on:
  pull_request:
    paths:
      - ".github/workflows/comment-audit-export.yml"

permissions:
  contents: read

env:
  AUDIT_SHA: 9ce2a1f8c6100e313138c50572dadf67d1a02296

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          ref: ${{ env.AUDIT_SHA }}
          fetch-depth: 0

      - name: package exact tracked snapshot and comment index
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/comment-audit"
          git archive --format=tar.gz --output="$RUNNER_TEMP/comment-audit/lab-colors-main.tar.gz" HEAD
          python3 - <<'PY'
          from __future__ import annotations

          import os
          import pathlib
          import subprocess

          root = pathlib.Path.cwd()
          out = pathlib.Path(os.environ['RUNNER_TEMP']) / 'comment-audit' / 'tracked-files.txt'
          paths = subprocess.check_output(['git', 'ls-files', '-z']).split(b'\0')
          text_paths: list[str] = []
          for raw in paths:
              if not raw:
                  continue
              path = raw.decode('utf-8', errors='strict')
              p = root / path
              try:
                  p.read_text(encoding='utf-8')
              except (UnicodeDecodeError, OSError):
                  continue
              text_paths.append(path)
          out.write_text('\n'.join(text_paths) + '\n', encoding='utf-8')
          print(f'text files: {len(text_paths)}')
          PY

      - name: upload audit snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: lab-colors-main-comment-audit
          path: |
            ${{ runner.temp }}/comment-audit/lab-colors-main.tar.gz
            ${{ runner.temp }}/comment-audit/tracked-files.txt
          retention-days: 1
