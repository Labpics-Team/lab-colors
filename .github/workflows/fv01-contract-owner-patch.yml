name: FV-01 guarded contract ownership patch

on:
  push:
    branches:
      - r12/fv-01-attached-materialization-authority

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: r12/fv-01-attached-materialization-authority
          fetch-depth: 2
      - name: Move public contract ownership without changing attachment physics
        shell: bash
        run: |
          python3 - <<'PY'
          from base64 import b64decode
          from pathlib import Path
          decode = lambda value: b64decode(value).decode()
          path = Path('crates/labcolors-core/src/program/attachment/fv01.rs')
          text = path.read_text()
          old_imports = decode('')
          new_imports = decode('')
          if text.count(old_imports) != 1:
              raise SystemExit('attachment public-contract import anchor changed')
          text = text.replace(old_imports, new_imports, 1)
          start = text.find('/// One complete host patch entry after compiler admission.\n')
          end = text.find('pub(crate) type AttachedProgramAttachmentV1<H> =\n')
          if start < 0 or end <= start:
              raise SystemExit('attachment public-contract range anchors changed')
          text = text[:start] + text[end:]
          mint_start = text.find('pub(crate) fn mint_authorities(\n')
          validate_start = text.find('pub(crate) fn validate_authority<W>(\n')
          if mint_start < 0 or validate_start <= mint_start:
              raise SystemExit('attachment mint anchors changed')
          new_mint = decode('')
          text = text[:mint_start] + new_mint + text[validate_start:]
          old_validate = decode('')
          new_validate = decode('')
          if text.count(old_validate) != 1:
              raise SystemExit('attachment authority validation anchor changed')
          text = text.replace(old_validate, new_validate, 1)
          path.write_text(text)
          PY
          cargo fmt --all
          rm .github/workflows/fv01-contract-owner-patch.yml
      - name: Commit guarded contract ownership patch
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/labcolors-core/src/program/attachment/fv01.rs crates/labcolors-core/src/program_wire.rs crates/labcolors-core/src/program_wire/fv01.rs .github/workflows/fv01-contract-owner-patch.yml
          git diff --cached --check
          git commit -m "refactor(fv-01): keep public contract outside staged Program"
          git push origin HEAD:r12/fv-01-attached-materialization-authority
