name: FV-01 WASM SSOT refactor

on:
  push:
    branches:
      - r12/fv-01-attached-materialization-authority

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: r12/fv-01-attached-materialization-authority
          fetch-depth: 2
      - name: Apply guarded SSOT migration
        run: |
          python3 scripts/fv01-wasm-ssot.py
          cargo fmt --all
          rm scripts/fv01-wasm-ssot.py .github/workflows/fv01-wasm-ssot.yml
      - name: Commit SSOT refactor
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add crates/labcolors-wasm/src/lib.rs crates/labcolors-wasm/src/attached.rs scripts/fv01-wasm-ssot.py .github/workflows/fv01-wasm-ssot.yml
          git diff --cached --check
          git commit -m "refactor(fv-01): make WASM attachment inputs single-owner"
          git push origin HEAD:r12/fv-01-attached-materialization-authority
