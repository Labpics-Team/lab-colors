name: FV-01 attached browser proof migration

on:
  push:
    branches:
      - r12/fv-01-attached-materialization-authority

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: r12/fv-01-attached-materialization-authority
          fetch-depth: 2
      - name: Apply attached browser proof migration
        run: |
          python3 scripts/fv01-browser-attachment.py
          rm scripts/fv01-browser-attachment.py .github/workflows/fv01-browser-migrate.yml
      - name: Commit browser proof
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/test-program-runtime-browser.mjs scripts/fv01-browser-attachment.py .github/workflows/fv01-browser-migrate.yml
          git diff --cached --check
          git commit -m "test(fv-01): prove attached authority in browser harness"
          git push origin HEAD:r12/fv-01-attached-materialization-authority
