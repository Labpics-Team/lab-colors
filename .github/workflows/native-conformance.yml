name: Native conformance

# Тонкий caller: триггеры, concurrency и права. Локальный uses выбирает worker
# из того же коммита, что и caller, независимо от checkout и squash-истории.
# Граф заданий и toolchain-пины проверяются вместе с этим snapshot. Задания идут
# на одноразовых эфемерных GitHub-hosted VM без секретов и общего состояния.
# Ручное сравнение authoring не меняет обязательные проверки пакета.

on:
  push:
    branches: [main]
  pull_request:
  merge_group:
  workflow_dispatch:
    inputs:
      authoring_baseline:
        description: Exact commit for an optional paired Swift authoring benchmark
        required: false
        type: string
        default: ''
      formal_model_diagnostic:
        description: One-shot isolated exact proof diagnostic of canceled formal run 42140643837
        required: false
        type: boolean
        default: false

# Первый запуск PR делит типизированную pr-группу. Re-run получает собственную
# run-группу, выполняет conformance и не отменяет новый SHA. Push evidence и
# ручной reference остаются независимыми exact-run.
concurrency:
  group: native-conformance-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

permissions:
  contents: read

jobs:
  # ИМЯ JOB'А НЕ МЕНЯТЬ БЕЗ ПРАВКИ publish.yml: GitHub публикует job'ы reusable-
  # воркфлоу как «<имя этого job'а> / <имя job'а worker'а>», а publish-гейт сверяет
  # эти имена буквально.
  worker:
    name: Native conformance
    if: ${{ github.event_name != 'workflow_dispatch' || !inputs.formal_model_diagnostic }}
    permissions:
      contents: read
    uses: ./.github/workflows/native-conformance-worker.yml
    with:
      authoring_baseline: ${{ inputs.authoring_baseline || '' }}

  # Только разовая диагностическая ветка: не сливать в main. Это изолированный
  # запуск одного proof, а не замена обязательного formal core (Kani).
  formal-model-diagnostic:
    name: Formal model diagnostic (isolated exact proof)
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.formal_model_diagnostic }}
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      FORMAL_SOURCE_SHA: fa8409d6e563ab560ccd037b41f5e8b6a7775539
      FORMAL_FAILED_RUN: '42140643837'
      RUST_TOOLCHAIN: 1.96.0
      CARGO_BUILD_JOBS: 2
      CARGO_TERM_COLOR: never
      WORKFLOW_SHA: ${{ github.workflow_sha }}
    steps:
      - name: create owned source and toolchain paths
        id: isolate
        shell: bash
        run: |
          export DIAGNOSTIC_ROOT="$RUNNER_TEMP/formal-model-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          mkdir "$DIAGNOSTIC_ROOT"
          echo 'owned=true' >> "$GITHUB_OUTPUT"
          {
            echo "DIAGNOSTIC_ROOT=$DIAGNOSTIC_ROOT"
            echo "RUSTUP_HOME=$DIAGNOSTIC_ROOT/rustup"
            echo "CARGO_HOME=$DIAGNOSTIC_ROOT/cargo"
            echo "KANI_HOME=$DIAGNOSTIC_ROOT/kani"
            echo "TMPDIR=$DIAGNOSTIC_ROOT/tmp"
            echo "CARGO_TARGET_DIR=$DIAGNOSTIC_ROOT/target"
          } >> "$GITHUB_ENV"
          mkdir "$DIAGNOSTIC_ROOT/tmp" "$DIAGNOSTIC_ROOT/kani"
          echo "$DIAGNOSTIC_ROOT/cargo/bin" >> "$GITHUB_PATH"
          git init "$DIAGNOSTIC_ROOT/source"
          git -C "$DIAGNOSTIC_ROOT/source" -c credential.helper= fetch --depth=1 \
            https://github.com/Labpics-Team/lab-colors.git "$FORMAL_SOURCE_SHA"
          git -C "$DIAGNOSTIC_ROOT/source" checkout --detach FETCH_HEAD
          test "$(git -C "$DIAGNOSTIC_ROOT/source" rev-parse HEAD)" = "$FORMAL_SOURCE_SHA"
          git -C "$DIAGNOSTIC_ROOT/source" diff --exit-code "$FORMAL_SOURCE_SHA" --
      # Пины и setup взяты из ci-worker.yml именно FORMAL_SOURCE_SHA.
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: install pinned Kani
        shell: bash
        working-directory: ${{ env.DIAGNOSTIC_ROOT }}/source
        run: |
          test "$(python3 scripts/verify_core_formal.py --kani-version)" = '0.68.0'
          cargo install kani-verifier --version "$(python3 scripts/verify_core_formal.py --kani-version)" --locked
          cargo kani setup
      - name: collect complete bounded exact proof stdout
        id: capture
        shell: bash
        run: |
          python3 - <<'PY'
          import gzip
          import hashlib
          import importlib.util
          import json
          import re
          import os
          from pathlib import Path
          import selectors
          import shlex
          import signal
          import subprocess
          import sys
          import time

          root = Path(os.environ['DIAGNOSTIC_ROOT'])
          source = root / 'source'
          artifact = root / 'artifact'
          artifact.mkdir()
          stdout_path = artifact / 'proof-stdout.gz'
          json_path = root / 'proof.json'
          json_gzip_path = artifact / 'proof-json.gz'
          artifact_limit = 16 * 1024 * 1024
          # Both compressed corpora share this allowance, including gzip footers.
          # Reserve room for the manifest and the upload-artifact ZIP envelope.
          observation_limit = 32 * 1024
          observation_path = artifact / 'executor-observations.jsonl'
          observation_size = 0
          journal = None
          journal_buffer = b''
          journal_bytes = 0
          observed_pids = set()
          gzip_limit = artifact_limit - 64 * 1024 - observation_limit
          json_limit = artifact_limit
          manifest_limit = 16 * 1024
          deadline = time.monotonic() + 600
          compressed_size = 0
          harness = 'program::attachment::handoff::proofs::stale_prepared_command_never_reaches_the_host_revoke_all'
          command = [
              'cargo', 'kani', '-p', 'labcolors-core', '--lib', '--harness',
              harness,
              '--exact', '-Z', 'unstable-options', '--output-format', 'regular',
              '--jobs=1', '--harness-timeout', '300s', '--export-json', str(json_path),
          ]
          manifest = {
              'diagnostic_only': True,
              'representation': 'canonical isolated exact proof JSON and regular stdout',
              'proof_result': 'unvalidated',
              'failed_required_run': os.environ['FORMAL_FAILED_RUN'],
              'source_repository': 'https://github.com/Labpics-Team/lab-colors.git',
              'base_sha': os.environ['FORMAL_SOURCE_SHA'],
              'workflow_sha': os.environ['WORKFLOW_SHA'],
              'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'command': command,
              'command_shell': shlex.join(command),
              'command_sha256': hashlib.sha256(json.dumps(command, separators=(',', ':')).encode()).hexdigest(),
              'observation_target': 'complete isolated RevokeAll property results versus original runner cancellation',
              'stdout_capture': 'raw bytes streamed without a raw file; no filtering, no line or sample limit',
              'stderr_capture': 'runner log only',
              'limits': {
                  'gzip_bytes': gzip_limit,
                  'raw_json_bytes': json_limit,
                  'manifest_bytes': manifest_limit,
                  'artifact_bytes': artifact_limit,
                  'command_seconds': 600,
                  'harness_seconds': 300,
              },
              'status': 'refused',
              'complete': False,
          }

          class Refusal(Exception):
              pass

          class BoundedWriter:
              def __init__(self, stream):
                  self.stream = stream
                  self.size = 0

              def write(self, data):
                  global compressed_size
                  if compressed_size + len(data) > gzip_limit:
                      raise Refusal('compressed JSON and stdout exceed the shared artifact budget')
                  written = self.stream.write(data)
                  self.size += written
                  compressed_size += written
                  return written

              def flush(self):
                  self.stream.flush()

          def remaining():
              seconds = deadline - time.monotonic()
              if seconds <= 0:
                  raise Refusal('diagnostic capture exceeded the overall 600 seconds')
              return seconds

          def phase(name):
              manifest['phase'] = name
              print(f'Diagnostic phase: {name}', flush=True)
              remaining()

          def observe(event, **fields):
              global observation_size
              payload = (json.dumps(dict(event=event, monotonic=time.monotonic(), **fields), sort_keys=True) + '\n').encode()
              if observation_size + len(payload) > observation_limit:
                  raise Refusal('executor observations exceed their reserved 32 KiB allowance')
              with observation_path.open('ab') as output:
                  output.write(payload)
              observation_size += len(payload)
              print('Executor observation: ' + payload.decode().rstrip(), flush=True)

          def identity(pid, event):
              try:
                  fields = Path(f'/proc/{pid}/stat').read_text().rsplit(')', 1)[1].split()
                  values = dict(pid=pid, ppid=int(fields[1]), pgid=int(fields[2]), sid=int(fields[3]), start_ticks=int(fields[19]))
                  cgroup = Path(f'/proc/{pid}/cgroup').read_text().strip().split(':', 2)[-1]
                  values['cgroup_sha256'] = hashlib.sha256(cgroup.encode()).hexdigest()
              except (OSError, ValueError, IndexError) as error:
                  observe('identity_unavailable', pid=pid, error_type=type(error).__name__)
                  return 0
              # Only numeric identity and fingerprint; never comm, cmdline or environment.
              observe(event, **values)
              return values['ppid']

          def descendants(pid):
              pending = [pid]
              visited = set()
              while pending:
                  current = pending.pop()
                  if current in visited:
                      continue
                  visited.add(current)
                  if len(visited) > 256:
                      raise Refusal('executor process tree exceeds 256 identities')
                  if current not in observed_pids:
                      identity(current, 'proof_descendant')
                      observed_pids.add(current)
                  try:
                      tasks = list(Path(f'/proc/{current}/task').iterdir())
                  except OSError:
                      continue
                  if len(tasks) > 256:
                      raise Refusal('executor process exceeds 256 task observations')
                  for task in tasks:
                      try:
                          pending.extend(map(int, (task / 'children').read_text().split()))
                      except (OSError, ValueError):
                          # This live snapshot is best-effort; exited tasks can disappear.
                          pass

          def journal_record(raw):
              try:
                  record = json.loads(raw)
              except (ValueError, UnicodeDecodeError):
                  observe('journal_record_invalid')
                  return
              message = record.get('MESSAGE', '')
              if not isinstance(message, str):
                  return
              victim = re.search(r'Killed process (\d+) \(([A-Za-z0-9_.-]{1,64})\)', message)
              if record.get('_TRANSPORT') == 'kernel' and victim:
                  observe('kernel_oom_victim', pid=int(victim[1]))
              elif record.get('_SYSTEMD_UNIT') == 'systemd-oomd.service' and 'Killed ' in message:
                  # Group path is fingerprinted, never publish arbitrary message text.
                  group = re.search(r'Killed (\S+)', message)
                  observe('oomd_group_kill', group_sha256=hashlib.sha256(group[1].encode()).hexdigest() if group else None)

          def read_journal(selector):
              global journal_buffer, journal_bytes
              chunk = os.read(journal.stdout.fileno(), 64 * 1024)
              if not chunk:
                  selector.unregister(journal.stdout)
                  observe('journal_exit', exit_code=journal.poll())
                  return
              journal_bytes += len(chunk)
              if journal_bytes > artifact_limit:
                  raise Refusal('executor journal input exceeds 16 MiB')
              journal_buffer += chunk
              while b'\n' in journal_buffer:
                  raw, journal_buffer = journal_buffer.split(b'\n', 1)
                  if len(raw) > 64 * 1024:
                      raise Refusal('executor journal record exceeds 64 KiB')
                  journal_record(raw)
              if len(journal_buffer) > 64 * 1024:
                  raise Refusal('executor journal record exceeds 64 KiB')

          def metadata(args):
              phase('metadata: ' + shlex.join(args))
              child = subprocess.Popen(args, stdout=subprocess.PIPE, text=True, start_new_session=True)
              try:
                  identity(child.pid, 'metadata_launch')
                  output, _ = child.communicate(timeout=remaining())
                  if child.returncode:
                      raise subprocess.CalledProcessError(child.returncode, args, output=output)
                  return output.strip()
              finally:
                  errors = stop_group(child)
                  child.stdout.close()
                  if errors:
                      raise Refusal('metadata process group cleanup failed: ' + '; '.join(errors))

          def git(*args):
              return metadata(['git', '-C', str(source), *args])

          def stop_group(process):
              errors = []
              if process is None:
                  return errors
              try:
                  try:
                      observe('owned_killpg', pgid=process.pid, signal='SIGTERM')
                  except Exception as error:
                      errors.append(str(error))
                  os.killpg(process.pid, signal.SIGTERM)
              except ProcessLookupError:
                  pass
              except OSError as error:
                  errors.append(str(error))
              try:
                  process.wait(timeout=5)
              except subprocess.TimeoutExpired:
                  pass
              except Exception as error:
                  errors.append(str(error))
              # The leader may have exited while a child ignores TERM. Always
              # kill the group after the bounded grace, including that case.
              try:
                  try:
                      observe('owned_killpg', pgid=process.pid, signal='SIGKILL')
                  except Exception as error:
                      errors.append(str(error))
                  os.killpg(process.pid, signal.SIGKILL)
              except ProcessLookupError:
                  pass
              except OSError as error:
                  errors.append(str(error))
              try:
                  process.wait(timeout=5)
              except Exception as error:
                  errors.append(str(error))
              return errors

          process = None
          raw_size = 0
          raw_digest = hashlib.sha256()
          try:
              ancestor = os.getpid()
              for _ in range(8):
                  if not ancestor:
                      break
                  ancestor = identity(ancestor, 'controller_ancestry')
              journal = subprocess.Popen(
                  ['journalctl', '--follow', '--since=@' + str(time.time()), '--output=json',
                   '_TRANSPORT=kernel', '+', '_SYSTEMD_UNIT=systemd-oomd.service'],
                  stdout=subprocess.PIPE, start_new_session=True,
              )
              identity(journal.pid, 'journal_launch')
              manifest['source_sha'] = git('rev-parse', 'HEAD')
              manifest['source_tree'] = git('rev-parse', 'HEAD^{tree}')
              if manifest['source_sha'] != manifest['base_sha'] or git('status', '--porcelain'):
                  raise Refusal('source checkout does not match the frozen clean snapshot')
              manifest['source_file_sha256'] = {
                  name: hashlib.sha256((source / name).read_bytes()).hexdigest()
                  for name in ['Cargo.lock', '.github/workflows/ci-worker.yml', 'scripts/verify_core_formal.py']
              }
              manifest['rustc_version'] = metadata(['rustc', '--version'])
              manifest['kani_version'] = metadata(['cargo', 'kani', '--version'])
              if manifest['kani_version'].splitlines() != ['Kani Rust Verifier 0.68.0 (cargo plugin)', 'CBMC 6.11.0']:
                  raise Refusal('installed Kani version is not the frozen 0.68.0')
              phase('canonical exact proof')
              with stdout_path.open('xb') as output:
                  bounded = BoundedWriter(output)
                  with gzip.GzipFile(filename='', mode='wb', fileobj=bounded, mtime=0) as compressed:
                      process = subprocess.Popen(command, cwd=source, stdout=subprocess.PIPE, start_new_session=True)
                      identity(process.pid, 'proof_launch')
                      with selectors.DefaultSelector() as selector:
                          selector.register(process.stdout, selectors.EVENT_READ)
                          selector.register(journal.stdout, selectors.EVENT_READ)
                          while True:
                              seconds = remaining()
                              descendants(process.pid)
                              if json_path.exists() and json_path.stat().st_size > json_limit:
                                  raise Refusal('raw canonical JSON exceeds its bounded allowance')
                              ready = selector.select(timeout=min(1, seconds))
                              for key, _ in ready:
                                  if key.fileobj is journal.stdout:
                                      read_journal(selector)
                              if not any(key.fileobj is process.stdout for key, _ in ready):
                                  continue
                              chunk = os.read(process.stdout.fileno(), 64 * 1024)
                              if not chunk:
                                  break
                              raw_size += len(chunk)
                              raw_digest.update(chunk)
                              compressed.write(chunk)
                      manifest['command_exit_code'] = process.wait(timeout=remaining())
                      if manifest['command_exit_code'] not in (0, 1):
                          raise Refusal('exact proof command failed outside verification result; corpus is not complete')
              if not raw_size:
                  raise Refusal('exact proof command returned empty stdout')
              if git('diff', '--name-only', manifest['base_sha'], '--'):
                  raise Refusal('tracked source bytes changed during collection')
              phase('bounded canonical JSON capture')
              if not json_path.is_file() or not 0 < json_path.stat().st_size <= json_limit:
                  raise Refusal('canonical JSON missing, empty, or above its bounded allowance')
              json_digest = hashlib.sha256()
              json_size = 0
              with json_path.open('rb') as raw, json_gzip_path.open('xb') as output:
                  with gzip.GzipFile(filename='', mode='wb', fileobj=BoundedWriter(output), mtime=0) as compressed:
                      while chunk := raw.read(64 * 1024):
                          remaining()
                          json_size += len(chunk)
                          if json_size > json_limit:
                              raise Refusal('raw canonical JSON exceeds its bounded allowance')
                          json_digest.update(chunk)
                          compressed.write(chunk)
              phase('canonical contract validation')
              report = json.loads(json_path.read_text(encoding='utf-8'))
              sys.path.insert(0, str(source / 'scripts'))
              spec = importlib.util.spec_from_file_location('frozen_formal_validator', source / 'scripts/verify_core_formal.py')
              validator = importlib.util.module_from_spec(spec)
              spec.loader.exec_module(validator)
              try:
                  validator.validate_positive_subset(report, (harness,))
                  if manifest['command_exit_code'] != 0:
                      raise ValueError('canonical properties passed but command exited nonzero')
              except ValueError as error:
                  manifest['proof_result'] = 'canonical_validation_rejected'
                  manifest['canonical_validation_error'] = str(error)
              else:
                  manifest['proof_result'] = 'canonical_validation_passed'
              remaining()
              manifest.update({
                  'json_file': json_gzip_path.name,
                  'raw_json_bytes': json_size,
                  'raw_json_sha256': json_digest.hexdigest(),
                  'json_gzip_bytes': json_gzip_path.stat().st_size,
                  'json_gzip_sha256': hashlib.sha256(json_gzip_path.read_bytes()).hexdigest(),
                  'status': 'complete',
                  'complete': True,
                  'stdout_file': stdout_path.name,
                  'raw_stdout_bytes': raw_size,
                  'raw_stdout_sha256': raw_digest.hexdigest(),
                  'gzip_bytes': stdout_path.stat().st_size,
                  'gzip_sha256': hashlib.sha256(stdout_path.read_bytes()).hexdigest(),
              })
          except Exception as error:
              manifest.update({
                  'status': 'refused', 'complete': False,
                  'reason': str(error), 'observed_raw_stdout_bytes': raw_size,
                  'command_exit_code': None if process is None else process.returncode,
              })
          finally:
              cleanup_errors = stop_group(process)
              cleanup_errors.extend(stop_group(journal))
              if journal is not None:
                  with selectors.DefaultSelector() as selector:
                      selector.register(journal.stdout, selectors.EVENT_READ)
                      while selector.get_map() and selector.select(timeout=0):
                          try:
                              read_journal(selector)
                          except Refusal as error:
                              cleanup_errors.append(str(error))
                              break
                  journal.stdout.close()
              if process is not None and process.stdout is not None:
                  try:
                      process.stdout.close()
                  except OSError as error:
                      cleanup_errors.append(str(error))
              if cleanup_errors:
                  manifest.update({
                      'status': 'refused', 'complete': False,
                      'reason': manifest.get('reason', 'command group cleanup failed'),
                      'cleanup_errors': cleanup_errors,
                  })
              if not manifest['complete']:
                  for path in (stdout_path, json_gzip_path):
                      try:
                          path.unlink(missing_ok=True)
                      except OSError as error:
                          manifest.setdefault('discard_errors', []).append(str(error))
                  manifest['partial_corpus_discarded'] = not stdout_path.exists() and not json_gzip_path.exists()
              json_path.unlink(missing_ok=True)
          print('Diagnostic phase: publish bounded artifact', flush=True)
          payload = (json.dumps(manifest, indent=2, sort_keys=True) + '\n').encode()
          if len(payload) > manifest_limit:
              raise RuntimeError('diagnostic manifest exceeds 16 KiB; refusing upload')
          manifest_path = artifact / 'manifest.json'
          manifest_path.write_bytes(payload)
          # Publish readiness only after both files are closed and bounded.
          if manifest_path.read_bytes() != payload:
              raise RuntimeError('diagnostic manifest readback failed; refusing upload')
          if manifest['complete']:
              if not stdout_path.is_file() or stdout_path.stat().st_size != manifest['gzip_bytes']:
                  raise RuntimeError('complete stdout file readback failed; refusing upload')
              if not json_gzip_path.is_file() or json_gzip_path.stat().st_size != manifest['json_gzip_bytes']:
                  raise RuntimeError('complete JSON file readback failed; refusing upload')
              if compressed_size > gzip_limit or compressed_size + len(payload) > artifact_limit:
                  raise RuntimeError('closed diagnostic files exceed the artifact budget; refusing upload')
          elif stdout_path.exists() or json_gzip_path.exists():
              raise RuntimeError('partial corpus could not be discarded; refusing upload')
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as output:
              output.write('artifact_ready=true\n')
          print(f"Diagnostic status: {manifest['status']}; proof result: {manifest['proof_result']}", flush=True)
          if not manifest['complete']:
              print(f"Refusal: {manifest['reason']}; no partial stdout artifact retained")
          PY
      - name: retain stdout and manifest for one day
        if: ${{ always() && steps.capture.outputs.artifact_ready == 'true' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: formal-model-${{ env.FORMAL_FAILED_RUN }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ env.DIAGNOSTIC_ROOT }}/artifact/proof-stdout.gz
            ${{ env.DIAGNOSTIC_ROOT }}/artifact/proof-json.gz
            ${{ env.DIAGNOSTIC_ROOT }}/artifact/manifest.json
            ${{ env.DIAGNOSTIC_ROOT }}/artifact/executor-observations.jsonl
          retention-days: 1
          compression-level: 0
          if-no-files-found: error
      - name: require a complete diagnostic corpus
        if: ${{ always() && steps.capture.outputs.artifact_ready == 'true' }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import os
          from pathlib import Path
          manifest = json.loads((Path(os.environ['DIAGNOSTIC_ROOT']) / 'artifact/manifest.json').read_text())
          if manifest['status'] != 'complete' or not manifest['complete']:
              raise SystemExit('Diagnostic refused: ' + manifest['reason'])
          PY
      - name: remove owned source toolchains and output
        if: ${{ always() && steps.isolate.outputs.owned == 'true' }}
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from pathlib import Path
          import shutil
          root = Path(os.environ['DIAGNOSTIC_ROOT']).resolve()
          temporary = Path(os.environ['RUNNER_TEMP']).resolve()
          if root.parent != temporary or not root.name.startswith('formal-model-'):
              raise SystemExit('Refusing cleanup outside the owned RUNNER_TEMP child')
          shutil.rmtree(root)
          PY
