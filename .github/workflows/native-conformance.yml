name: P1 compatibility diagnostics

on:
  pull_request:

permissions:
  contents: read

jobs:
  exact:
    if: github.event.pull_request.number == 366
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.85.0
      - name: capture MSRV
        shell: bash
        run: |
          set +e
          cargo check --workspace --all-targets --locked --message-format=short > p1-msrv.log 2>&1
          echo $? > p1-msrv-status.txt
          exit 0
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.96.0
          components: clippy
      - name: capture tests and clippy
        shell: bash
        run: |
          set +e
          cargo test --workspace --locked -- --nocapture > p1-test.log 2>&1
          echo $? > p1-test-status.txt
          cargo clippy --workspace --all-targets --locked --message-format=short -- -D warnings > p1-clippy.log 2>&1
          echo $? > p1-clippy-status.txt
          exit 0
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: p1-compatibility-diagnostics
          path: |
            p1-msrv.log
            p1-msrv-status.txt
            p1-test.log
            p1-test-status.txt
            p1-clippy.log
            p1-clippy-status.txt
          if-no-files-found: error
