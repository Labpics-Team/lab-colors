name: Native conformance (Swift)

# Ручная сверка Linux Swift с настоящим macOS reference. Обязательная Linux-
# проверка входит в ci.yml; этот запуск не служит допуском публикации.

on:
  workflow_dispatch:

concurrency:
  group: native-conformance-${{ github.run_id }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  worker:
    name: Native conformance (Swift)
    permissions:
      contents: read
    uses: Labpics-Team/lab-colors/.github/workflows/native-conformance-worker.yml@1beda3770a990bb62d1b97e0188b1f2620e16c07
