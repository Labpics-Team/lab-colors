name: mutation (scheduled, report-only)

# Тонкий caller: только расписание, concurrency и права. Job graph, шардирование и
# пины закреплены в immutable mutation-worker.yml на полном commit SHA —
# runner-group ACL допускает в одноразовую gVisor-ячейку DE-02 только jobs из
# закреплённых worker'ов. Своих inputs у worker нет by design.

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Все report-only прогоны делят FIFO-очередь репозитория: queue=max сохраняет до
# 100 pending runs вместо default single, который отменяет предыдущий pending.
concurrency:
  group: mutation
  queue: max

jobs:
  worker:
    name: mutation
    permissions:
      contents: read
    uses: Labpics-Team/lab-colors/.github/workflows/mutation-worker.yml@dc972fafa323bc0a7f7f87275708a6d6fb6b7708
