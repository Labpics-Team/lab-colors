name: mutation (scheduled, report-only)

# Тонкий caller: только расписание, concurrency и права. Job graph, шардирование и
# пины принадлежат worker того же коммита, что и caller —
# каждый job исполняется на одноразовой эфемерной GitHub-hosted VM без секретов
# и общего состояния. Своих inputs у worker нет by design.

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Report-only прогоны не отменяют выполняющийся запуск. GitHub Actions держит
# не более одного pending запуска в группе и заменяет его более новым; это
# намеренная latest-pending семантика, а не несуществующий FIFO-параметр.
concurrency:
  group: mutation

jobs:
  worker:
    name: mutation
    permissions:
      contents: read
    uses: ./.github/workflows/mutation-worker.yml
