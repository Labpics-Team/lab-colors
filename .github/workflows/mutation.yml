name: mutation (scheduled, report-only)

# Тонкий caller задаёт расписание, concurrency и права. Job graph, шардирование
# и пины принадлежат mutation-worker.yml. Изоляция и очистка self-hosted раннеров
# принадлежат инфраструктурному контракту Labpics-infra. Своих inputs у worker нет.

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Report-only прогоны не отменяют выполняющийся запуск. GitHub Actions держит
# не более одного pending запуска в группе и заменяет его более новым; это
# намеренная latest-pending семантика, а не несуществующий FIFO-параметр.
concurrency:
  group: mutation

jobs:
  worker:
    name: mutation
    permissions:
      contents: read
    uses: Labpics-Team/lab-colors/.github/workflows/mutation-worker.yml@main
