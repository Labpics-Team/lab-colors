name: mutation (scheduled, report-only)

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Concurrency сохраняет последний pending run; FIFO не гарантируется.
concurrency:
  group: mutation

jobs:
  worker:
    name: mutation
    permissions:
      contents: read
    uses: ./.github/workflows/mutation-worker.yml
