name: mutation (scheduled, report-only)

# Тонкий caller: только расписание, concurrency и права. Job graph, шардирование и
# пины закреплены в immutable mutation-worker.yml на полном commit SHA —
# runner-group ACL допускает в одноразовую gVisor-ячейку DE-02 только jobs из
# закреплённых worker'ов. Своих inputs у worker нет by design.

on:
  schedule:
    - cron: "0 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

# Report-only прогоны не отменяют выполняющийся запуск и не вытесняют уже
# ожидающее evidence: `queue: max` — штатный FIFO-режим GitHub Actions.
concurrency:
  group: mutation
  queue: max

jobs:
  worker:
    name: mutation
    permissions:
      contents: read
    uses: Labpics-Team/lab-colors/.github/workflows/mutation-worker.yml@7827981724ad75bfcf15bd5b2f74be2d5337d9b5
