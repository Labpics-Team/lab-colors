          exactOrderedKeys(
            privateMetadata.source?.core?.digest,
            ["algorithm", "framing", "symlinks", "scope", "files", "sha256"],
            "packed private Program Core digest",
          );
          exactOrderedKeys(
            privateMetadata.artifacts,
            ["consumer", "wasm"],
            "packed private Program nested artifacts",
          );
          exactOrderedKeys(
            privateMetadata.artifacts?.consumer,
            ["path", "bytes", "sha256"],
            "packed private Program nested consumer",
          );
          exactOrderedKeys(
            privateMetadata.artifacts?.wasm,
            ["path", "bytes", "sha256"],
            "packed private Program nested WASM",
          );
          if (
            privateMetadata.schemaVersion !== 1 ||
            privateMetadata.role !== privateProgram.role ||
            privateMetadata.package.name !== "@labpics/colors" ||
            privateMetadata.package.version !== expectedVersion ||
            privateMetadata.source.gitSha !== expectedSha ||
            privateMetadata.source.core.crate !== "labcolors-core" ||
            privateMetadata.source.core.version !== manifest.core
          ) {
            fail("packed private Program metadata identity is not canonical");
          }
          if (
            JSON.stringify(privateMetadata.artifacts.consumer) !==
              JSON.stringify(privateProgram.consumer) ||
            JSON.stringify(privateMetadata.artifacts.wasm) !==
              JSON.stringify(privateWasmArtifact)
          ) {
            fail("packed private Program metadata artifacts differ from manifest V5");
          }
          const expectedCoreDigest = await privateProgramCoreSourceDigest();
          if (
            JSON.stringify(privateMetadata.source.core.digest) !== JSON.stringify(expectedCoreDigest)
          ) {
            fail("packed private Program metadata Core digest differs from the exact tag source");
          }
          if (
            JSON.stringify(privateMetadata.build) !== JSON.stringify(PRIVATE_PROGRAM_CANONICAL_BUILD)
          ) {
            fail("packed private Program metadata build descriptor is not canonical");
          }

          const packedPackage = JSON.parse(
            packedMember(tarball, tarMembers, "package.json", "packed package").toString(
              "utf8",
            ),
          );
          if (packedPackage.name !== "@labpics/colors" || packedPackage.version !== expectedVersion) {
            fail(`packed identity ${packedPackage.name}@${packedPackage.version}`);
          }
          if (
            !Array.isArray(packedPackage.files) ||
            JSON.stringify(packedPackage.files) !== JSON.stringify(EXPECTED_PACKAGE_FILES)
          ) {
            fail("packed package files declaration differs from the admitted inventory");
          }
          if (JSON.stringify(packedPackage.exports) !== JSON.stringify(EXPECTED_PACKAGE_EXPORTS)) {
            fail("packed package exports differ from the admitted public surface");
          }
          const exportKeys = packedPackage.exports &&
              typeof packedPackage.exports === "object" &&
              !Array.isArray(packedPackage.exports)
            ? Object.keys(packedPackage.exports)
            : [];
          const privateExport = exportKeys.find(
            (key) =>
              key.includes("*") ||
              key === "./private-program" || key.startsWith("./private-program/"),
          );
          if (privateExport) fail(`private Program path is exported: ${privateExport}`);

          if (tarball.includes("\n") || tarball.includes("\r")) fail("unsafe tarball path");
          appendFileSync(output, `tarball=${tarball}\nsha256=${digest}\n`, "utf8");
          console.log(`verified ${basename(tarball)}: ${bytes.length} bytes, sha256 ${digest}`);
          })().catch((error) => {
            console.error(error instanceof Error ? error.stack : String(error));
            process.exitCode = 1;
          });
          NODE
      # The snapshot is tamper-evident, not immutable against same-UID code. Keep this
      # token-bearing step adjacent; never insert checked-out or artifact code between them.
      - name: npm publish verified CI tarball (granular token, no rebuild/repack)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TARBALL_PATH: ${{ steps.verified-artifact.outputs.tarball }}
          TARBALL_SHA256: ${{ steps.verified-artifact.outputs.sha256 }}
        run: |
          set -euo pipefail
          actual_sha256="$(sha256sum --binary -- "$TARBALL_PATH")"
          actual_sha256="${actual_sha256%% *}"
          if [[ ! "$TARBALL_SHA256" =~ ^[0-9a-f]{64}$ || "$actual_sha256" != "$TARBALL_SHA256" ]]; then
            echo "verified tarball changed before npm publish" >&2
            exit 1
          fi
          npm publish --ignore-scripts --@labpics:registry=https://registry.npmjs.org "$TARBALL_PATH"
