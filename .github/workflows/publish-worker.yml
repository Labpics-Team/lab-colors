name: publish worker

# Публикация @labpics/colors в npm по тегу colors-vX.Y.Z.
#
# Публикация идёт через explicit granular token: npm не поддерживает безтокенный
# trust flow на собственных раннерах. Secret `NPM_TOKEN` хранится в environment
# `npm-publish`, выдаёт write только пакету @labpics/colors и передаётся ровно
# publish-step. Environment ОБЪЯВЛЕН НА JOB'Е ЗДЕСЬ, а не в caller'е: у job'а с
# `uses:` ключ `environment` не поддерживается, и именно объявление внутри
# reusable-воркфлоу заставляет GitHub резолвить environment-секрет.
#
# Publish ничего не собирает и не перепаковывает. Он принимает только immutable
# attempt-scoped artifact `colors-release-$GITHUB_SHA-attempt-$RUN_ATTEMPT` из
# canonical successful push-run
# `.github/workflows/ci.yml` для exact tag SHA. Отдельно требуется canonical
# successful push-run `.github/workflows/native-conformance.yml`. Имена jobs
# проверяются только внутри выбранных run IDs, поэтому чужой check-run с таким
# же display name не может удовлетворить gate.
#
# Provenance-аттестация отключена (package.json publishConfig.provenance:false):
# npm выдаёт sigstore provenance только публичным репозиториям. При открытии
# репозитория вернуть provenance и короткоживущую аутентификацию.
#
# Неизменяемый worker: caller (publish.yml) закрепляет этот файл полным commit
# SHA и не может изменить ни job graph, ни пины. Своих inputs у worker нет.

on:
  workflow_call:

env:
  # Node 24.14.0 ships the npm 11.9.0 release packer/publisher contract.
  NODE_TOOLCHAIN: "24.14.0"
  NPM_TOOLCHAIN: "11.9.0"

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: ubuntu-latest
    # Environment secrets are resolved for this job. Keep the trust boundary
    # intrinsic to the immutable worker so PR/workflow_call/wrong-repository
    # invocations are skipped before `npm-publish` can expose NPM_TOKEN.
    if: >-
      github.repository == 'Labpics-Team/lab-colors' &&
      github.event_name == 'push' &&
      github.ref_type == 'tag' &&
      startsWith(github.ref_name, 'colors-v')
    # 15 = запас сверху при переходе с DE-02 на GitHub-hosted раннеры (старый
    # 10-минутный конверт поднят: history-replay на новом железе ещё невозможен);
    # перекалибровать по фактическим publish-прогонам.
    timeout-minutes: 15
    environment: npm-publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Нужен только exact tag commit; ancestry доказывается read-only API
          # без сохранения workflow credential в git config.
          fetch-depth: 1
          persist-credentials: false
      - name: isolated publish env (runner.temp)
        run: |
          echo "TMPDIR=$RUNNER_TEMP/tmp-$GITHUB_JOB" >> "$GITHUB_ENV"
          echo "NPM_CONFIG_CACHE=$RUNNER_TEMP/npm-$GITHUB_JOB" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/tmp-$GITHUB_JOB" "$RUNNER_TEMP/npm-$GITHUB_JOB"
      - name: guard — exact tag SHA is in origin/main
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          checked_out="$(git rev-parse HEAD)"
          if [ "$checked_out" != "$GITHUB_SHA" ]; then
            echo "checkout HEAD $checked_out != tag SHA $GITHUB_SHA" >&2
            exit 1
          fi
          node <<'NODE'
          const repository = process.env.GITHUB_REPOSITORY;
          const expectedSha = process.env.GITHUB_SHA;
          const apiRoot = process.env.GITHUB_API_URL;
          const token = process.env.GH_READ_TOKEN;
          if (!repository || !apiRoot || !token || !/^[0-9a-f]{40}$/u.test(expectedSha ?? "")) {
            throw new Error("tag ancestry guard is missing valid GitHub environment");
          }

          const path = `/repos/${repository}/compare/${encodeURIComponent(expectedSha)}...main`;
          (async () => {
            const response = await fetch(`${apiRoot}${path}`, {
              headers: {
                Accept: "application/vnd.github+json",
                Authorization: `Bearer ${token}`,
                "X-GitHub-Api-Version": "2022-11-28",
              },
            });
            if (!response.ok) {
              throw new Error(`GitHub API ${response.status} for ${path}: ${await response.text()}`);
            }
            const comparison = await response.json();
            const statusAllowsAncestor =
              comparison.status === "identical" || comparison.status === "ahead";
            if (
              !statusAllowsAncestor ||
              comparison.base_commit?.sha !== expectedSha ||
              comparison.merge_base_commit?.sha !== expectedSha
            ) {
              throw new Error(
                `tag ${process.env.GITHUB_REF_NAME ?? expectedSha} points outside main history`,
              );
            }
            console.log(`verified tag commit is in main history: ${expectedSha}`);
          })().catch((error) => {
            console.error(error instanceof Error ? error.stack : String(error));
            process.exitCode = 1;
          });
          NODE
      - name: guard — canonical exact-SHA workflow runs and their own jobs
        id: canonical-runs
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const { appendFileSync } = require("node:fs");

          const repository = process.env.GITHUB_REPOSITORY;
          const expectedSha = process.env.GITHUB_SHA;
          const apiRoot = process.env.GITHUB_API_URL;
          const output = process.env.GITHUB_OUTPUT;
          const token = process.env.GH_READ_TOKEN;
          if (!repository || !expectedSha || !apiRoot || !output || !token) {
            throw new Error("canonical-run guard is missing required GitHub environment");
          }

          const workflows = [
            {
              key: "ci",
              file: "ci.yml",
              path: ".github/workflows/ci.yml",
              worker: {
                path: "Labpics-Team/lab-colors/.github/workflows/ci-worker.yml@1461bc2ed60142aed3a8723e618b883be6418156",
                sha: "1461bc2ed60142aed3a8723e618b883be6418156",
              },
              requiredJobs: [
                "Node 22 consumer floor",
                "MSRV workspace check",
                "clippy + rustfmt",
                "cargo doc (intra-doc links)",
                "test",
                "cargo audit (rustsec)",
                "wasm build + headless test + size",
              ],
            },
            {
              key: "native",
              file: "native-conformance.yml",
              path: ".github/workflows/native-conformance.yml",
              worker: {
                path: "Labpics-Team/lab-colors/.github/workflows/native-conformance-worker.yml@1461bc2ed60142aed3a8723e618b883be6418156",
                sha: "1461bc2ed60142aed3a8723e618b883be6418156",
              },
              requiredJobs: [
                "swift conformance (self-hosted Linux, pinned toolchain)",
              ],
            },
          ];

          async function api(path) {
            const response = await fetch(`${apiRoot}/repos/${repository}${path}`, {
              headers: {
                Accept: "application/vnd.github+json",
                Authorization: `Bearer ${token}`,
                "X-GitHub-Api-Version": "2022-11-28",
              },
            });
            if (!response.ok) {
              throw new Error(`GitHub API ${response.status} for ${path}: ${await response.text()}`);
            }
            return response.json();
          }

          async function paginated(path, field) {
            const values = [];
            for (let page = 1; page <= 10; page += 1) {
              const separator = path.includes("?") ? "&" : "?";
              const payload = await api(`${path}${separator}per_page=100&page=${page}`);
              if (!Array.isArray(payload[field])) {
                throw new Error(`GitHub API response has no ${field} array for ${path}`);
              }
              values.push(...payload[field]);
              if (payload[field].length < 100) return values;
            }
            throw new Error(`GitHub API pagination exceeded 1000 ${field} records for ${path}`);
          }

          async function canonicalRun(spec) {
            const query = new URLSearchParams({
              branch: "main",
              event: "push",
              head_sha: expectedSha,
            });
            const runs = await paginated(
              `/actions/workflows/${encodeURIComponent(spec.file)}/runs?${query}`,
              "workflow_runs",
            );
            const candidates = runs
              .filter((run) =>
                run.path === spec.path &&
                run.head_sha === expectedSha &&
                run.head_branch === "main" &&
                run.event === "push")
              .sort((left, right) => Number(right.id) - Number(left.id));
            const run = candidates[0];
            if (!run) throw new Error(`${spec.path}: no canonical push run for ${expectedSha}`);
            if (!(run.status === "completed" && run.conclusion === "success")) {
              throw new Error(`${spec.path} run ${run.id}: ${run.status}/${run.conclusion ?? "none"}`);
            }
            const references = run.referenced_workflows;
            if (!Array.isArray(references) || references.length !== 1) {
              throw new Error(
                `${spec.path} run ${run.id}: expected exactly one immutable worker reference`,
              );
            }
            const [reference] = references;
            if (reference?.path !== spec.worker.path || reference?.sha !== spec.worker.sha) {
              throw new Error(
                `${spec.path} run ${run.id}: worker reference does not match the admitted worker`,
              );
            }
            return run;
          }

          async function requireSuccessfulJobs(spec, run) {
            const jobs = await paginated(
              `/actions/runs/${run.id}/jobs?filter=latest`,
              "jobs",
            );
            const failures = [];
            for (const name of spec.requiredJobs) {
              // GitHub добавляет слева имена каждого reusable-caller. Последний
              // сегмент — каноничное имя worker-job независимо от глубины вызова;
              // run path, run_id и ровно одно совпадение замыкают его identity.
              const matches = jobs.filter((job) => {
                const workerName = job.name.split(" / ").at(-1);
                return workerName === name && Number(job.run_id) === Number(run.id);
              });
              if (matches.length !== 1) {
                failures.push(`${name}: expected one job in run ${run.id}, got ${matches.length}`);
                continue;
              }
              const job = matches[0];
              if (!(job.status === "completed" && job.conclusion === "success")) {
                failures.push(`${name}: ${job.status}/${job.conclusion ?? "none"}`);
              }
            }
            if (failures.length > 0) {
              throw new Error(`${spec.path} failed job gate:\n${failures.join("\n")}`);
            }
          }

          (async () => {
            const outputs = [];
            for (const spec of workflows) {
              const run = await canonicalRun(spec);
              await requireSuccessfulJobs(spec, run);
              outputs.push(`${spec.key}_run_id=${run.id}`);
              if (spec.key === "ci") {
                if (!Number.isSafeInteger(run.run_attempt) || run.run_attempt < 1) {
                  throw new Error(`${spec.path} run ${run.id}: invalid run_attempt`);
                }
                outputs.push(`ci_run_attempt=${run.run_attempt}`);
              }
              console.log(`${spec.path}: canonical successful push run ${run.id}`);
            }
            appendFileSync(output, `${outputs.join("\n")}\n`, "utf8");
          })().catch((error) => {
            console.error(error instanceof Error ? error.stack : String(error));
            process.exitCode = 1;
          });
          NODE
      - name: download immutable exact-SHA release artifact from canonical CI run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: colors-release-${{ github.sha }}-attempt-${{ steps.canonical-runs.outputs.ci_run_attempt }}
          path: ${{ runner.temp }}/colors-release-${{ github.sha }}-attempt-${{ steps.canonical-runs.outputs.ci_run_attempt }}
          github-token: ${{ github.token }}
          run-id: ${{ steps.canonical-runs.outputs.ci_run_id }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Одноразовый слот: GitHub-кэш не нужен. У setup-node вход `cache` — это
          # перечисление пакетных менеджеров, поэтому кэш выключается ОТСУТСТВИЕМ
          # `cache` плюс явным гашением автокэша npm (`cache: false` там падает).
          package-manager-cache: false
          node-version: ${{ env.NODE_TOOLCHAIN }}
          registry-url: "https://registry.npmjs.org"
      - name: validate manifest identity and byte-exact tarball
        id: verified-artifact
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/colors-release-${{ github.sha }}-attempt-${{ steps.canonical-runs.outputs.ci_run_attempt }}
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_TAG: ${{ github.ref_name }}
          EXPECTED_NODE: ${{ env.NODE_TOOLCHAIN }}
          EXPECTED_NPM: ${{ env.NPM_TOOLCHAIN }}
        run: |
          node <<'NODE'
          const { createHash } = require("node:crypto");
          const { execFileSync } = require("node:child_process");
          const {
            appendFileSync,
            chmodSync,
            closeSync,
            fsyncSync,
            lstatSync,
            mkdtempSync,
            openSync,
            readFileSync,
            readdirSync,
            writeSync,
          } = require("node:fs");
          const { basename, dirname, join } = require("node:path");
          const {
            POINT_SUPPORT_CERTIFIED_CLAIM,
            POINT_SUPPORT_EXCLUDED_CLAIM,
            POINT_SUPPORT_SOURCE_BINDING_SCOPE: POINT_SUPPORT_SOURCE_SCOPE,
            POINT_SUPPORT_SOURCE_BINDING_EXCLUSIONS: POINT_SUPPORT_SOURCE_EXCLUSIONS,
            POINT_SUPPORT_SOURCE_PATHS,
            exactJsonPayloadWithoutTopLevelField,
          } = require(
            `${process.env.GITHUB_WORKSPACE}/scripts/point-support-release-contract.cjs`,
          );

          const PRIVATE_PROGRAM_ROLE = "private-program-consumer";
          const PRIVATE_PROGRAM_METADATA_PATH = "private-program/build-metadata.json";
          const PRIVATE_PROGRAM_CONSUMER_PATH = "private-program/consumer.js";
          const PRIVATE_PROGRAM_WASM_PATH =
            "private-program/labcolors_private_program.wasm";
          const TAR_INSPECTOR_SHA256 =
            "c838aac0b1f918113d55839a77b913d1d4225dda39063c57f80efeb9fc153022";
          const EXPECTED_PACKAGE_FILES = [
            "LICENSE",
            "build-metadata.json",
            "index.js",
            "index.d.ts",
            "wcag22.d.ts",
            "apply-theme.js",
            "apply-theme.d.ts",
            "snapshot.js",
            "output-sink.js",
            "output-bindings.js",
            "sequence-identity-matches.js",
            "watch-theme.js",
            "watch-theme.d.ts",
            "adapt-theme.js",
            "adapt-theme.d.ts",
            "background-observation.js",
            "effective-bg.js",
            "evidence/wcag22-srgb8-v1.json",
            "evidence/wcag22-srgb8-q55-v1.bin",
            "evidence/wcag22-srgb8-q55-proof-v1.json",
            "evidence/point-support-reference-surplus-q55-bps-proof-v1.json",
            PRIVATE_PROGRAM_CONSUMER_PATH,
            PRIVATE_PROGRAM_WASM_PATH,
            PRIVATE_PROGRAM_METADATA_PATH,
            "pkg/labcolors.js",
            "pkg/labcolors.d.ts",
            "pkg/labcolors_bg.wasm",
            "pkg/labcolors_bg.wasm.d.ts",
          ];
          const EXPECTED_PACKAGE_EXPORTS = {
            ".": { types: "./index.d.ts", default: "./index.js" },
            "./apply-theme": {
              types: "./apply-theme.d.ts",
              default: "./apply-theme.js",
            },
            "./watch-theme": {
              types: "./watch-theme.d.ts",
              default: "./watch-theme.js",
            },
            "./adapt-theme": {
              types: "./adapt-theme.d.ts",
              default: "./adapt-theme.js",
            },
            "./pkg/labcolors_bg.wasm": "./pkg/labcolors_bg.wasm",
            "./build-metadata.json": "./build-metadata.json",
            "./package.json": "./package.json",
          };
          const EXPECTED_TAR_INVENTORY = [
            ...EXPECTED_PACKAGE_FILES,
            "README.md",
            "package.json",
          ].sort((left, right) =>
            Buffer.compare(Buffer.from(left, "utf8"), Buffer.from(right, "utf8")),
          );

          function fail(message) {
            throw new Error(`release artifact rejected: ${message}`);
          }

          if (
            EXPECTED_PACKAGE_FILES.length !== 28 ||
            new Set(EXPECTED_PACKAGE_FILES).size !== 28 ||
            EXPECTED_PACKAGE_FILES.some((path) => path.includes("*")) ||
            EXPECTED_TAR_INVENTORY.length !== 30 ||
            new Set(EXPECTED_TAR_INVENTORY).size !== 30
          ) {
            fail("worker package inventory allowlist is not canonical");
          }

          function sha256(bytes) {
            return createHash("sha256").update(bytes).digest("hex");
          }

          function exactKeys(value, expected, label) {
            const actual = value && typeof value === "object" && !Array.isArray(value)
              ? Object.keys(value).sort()
              : [];
            if (actual.join(",") !== [...expected].sort().join(",")) {
              fail(`${label} has a non-canonical shape`);
            }
          }

          function exactOrderedKeys(value, expected, label) {
            const actual = value && typeof value === "object" && !Array.isArray(value)
              ? Object.keys(value)
              : [];
            if (actual.join(",") !== expected.join(",")) {
              fail(`${label} has a non-canonical key order or shape`);
            }
          }

          function walk(directory, files = []) {
            for (const entry of readdirSync(directory, { withFileTypes: true })) {
              const path = join(directory, entry.name);
              const stat = lstatSync(path);
              if (stat.isSymbolicLink()) fail(`symlink is forbidden: ${path}`);
              if (stat.isDirectory()) walk(path, files);
              else if (stat.isFile()) files.push(path);
              else fail(`non-regular artifact entry: ${path}`);
            }
            return files;
          }

          function packedMember(tarball, members, path, label) {
            const matches = members.filter((member) => member.normalizedPath === path);
            if (matches.length !== 1) {
              fail(`${label} must have exactly one inspected packed member ${path}`);
            }
            const member = matches[0];
            if (
              member.rawPath !== `package/${path}` ||
              member.type !== "file" ||
              !Number.isSafeInteger(member.size) ||
              member.size < 0 ||
              !/^[0-9a-f]{64}$/u.test(member.sha256 ?? "")
            ) {
              fail(`${label} inspected member is not canonical`);
            }
            const packed = execFileSync("tar", ["-xOzf", tarball, member.rawPath], {
              maxBuffer: 64 * 1024 * 1024,
            });
            if (packed.length !== member.size || sha256(packed) !== member.sha256) {
              fail(`${label} extracted bytes differ from the inspected member`);
            }
            return packed;
          }

          function packedEvidence(tarball, members, records, path, label) {
            if (!Array.isArray(records)) fail(`${label} artifacts are not an array`);
            const matches = records.filter((record) => record?.path === path);
            if (matches.length !== 1) {
              fail(`${label} must bind exactly one ${path}, got ${matches.length}`);
            }
            const record = matches[0];
            exactKeys(record, ["path", "bytes", "sha256"], `${label} artifact`);
            const packed = packedMember(tarball, members, path, label);
            const digest = sha256(packed);
            if (
              !Number.isSafeInteger(record.bytes) ||
              record.bytes !== packed.length ||
              !/^[0-9a-f]{64}$/u.test(record.sha256 ?? "") ||
              record.sha256 !== digest
            ) {
              fail(`${label} does not bind the exact packed ${path} bytes`);
            }
            return packed;
          }

          function packedArtifact(
            tarball,
            members,
            record,
            expectedPath,
            label,
            expectedKeys = ["path", "bytes", "sha256"],
          ) {
            exactOrderedKeys(record, expectedKeys, `${label} record`);
            if (record.path !== expectedPath) {
              fail(`${label} path ${record.path} != ${expectedPath}`);
            }
            const packed = packedMember(tarball, members, expectedPath, label);
            const actualSha256 = sha256(packed);
            if (
              !Number.isSafeInteger(record.bytes) ||
              record.bytes <= 0 ||
              record.bytes !== packed.length ||
              !/^[0-9a-f]{64}$/u.test(record.sha256 ?? "") ||
              record.sha256 !== actualSha256
            ) {
              fail(`${label} does not bind the exact packed ${expectedPath} bytes`);
            }
            return packed;
          }

          function writeExclusiveFsyncedFile(path, bytes, label) {
            const handle = openSync(path, "wx", 0o600);
            try {
              let offset = 0;
              while (offset < bytes.length) {
                const written = writeSync(
                  handle,
                  bytes,
                  offset,
                  bytes.length - offset,
                  offset,
                );
                if (written <= 0) fail(`${label} write made no progress`);
                offset += written;
              }
              fsyncSync(handle);
            } finally {
              closeSync(handle);
            }
          }

          function fsyncDirectory(directory) {
            // The publish job is Linux-only. Win32 lacks a Node directory-handle
            // flush primitive, so local contract execution relies on file fsync + readback.
            if (process.platform === "win32") return;
            const directoryHandle = openSync(directory, "r");
            try {
              fsyncSync(directoryHandle);
            } finally {
              closeSync(directoryHandle);
            }
          }

          function materializeVerifiedTarball(bytes, digest, runnerTemp) {
            const directory = mkdtempSync(join(runnerTemp, "colors-publish-verified-"));
            chmodSync(directory, 0o700);
            const path = join(directory, `${digest}.tgz`);
            writeExclusiveFsyncedFile(path, bytes, "verified tarball snapshot");
            fsyncDirectory(directory);
            const snapshot = readFileSync(path);
            if (!snapshot.equals(bytes) || sha256(snapshot) !== digest) {
              fail("verified tarball snapshot differs from the validated bytes");
            }
            return path;
          }

          function inspectCanonicalTarball(tarball, bytes, digest, workspace) {
            const inspectorPath = join(workspace, "scripts/inspect-npm-tarball.py");
            const inspectorBytes = readFileSync(inspectorPath);
            if (sha256(inspectorBytes) !== TAR_INSPECTOR_SHA256) {
              fail("tar inspector bytes differ from the worker-pinned helper");
            }

            const inventoryPath = join(dirname(tarball), "declared-inventory.json");
            const inventoryBytes = Buffer.from(
              `${JSON.stringify({ schemaVersion: 1, files: EXPECTED_TAR_INVENTORY })}\n`,
              "utf8",
            );
            writeExclusiveFsyncedFile(
              inventoryPath,
              inventoryBytes,
              "declared tar inventory",
            );
            fsyncDirectory(dirname(tarball));

            const output = execFileSync(
              "python3",
              [
                inspectorPath,
                "--tarball",
                tarball,
                "--declared-inventory-json",
                inventoryPath,
              ],
              { encoding: "utf8", maxBuffer: 1024 * 1024 },
            );
            let inspection;
            try {
              inspection = JSON.parse(output);
            } catch {
              fail("tar inspector output is not JSON");
            }
            exactOrderedKeys(
              inspection,
              ["schemaVersion", "verdict", "tarball", "limits", "members", "inventory"],
              "tar inspection",
            );
            exactOrderedKeys(inspection.tarball, ["bytes", "sha256"], "tar inspection identity");
            exactOrderedKeys(
              inspection.limits,
              ["maxMembers", "maxTarballBytes", "maxTotalFileBytes"],
              "tar inspection limits",
            );
            exactOrderedKeys(
              inspection.inventory,
              ["files", "totalFileBytes"],
              "tar inspection inventory",
            );
            if (
              inspection.schemaVersion !== 1 ||
              inspection.verdict !== "canonical" ||
              inspection.tarball.bytes !== bytes.length ||
              inspection.tarball.sha256 !== digest ||
              inspection.limits.maxMembers !== EXPECTED_TAR_INVENTORY.length ||
              inspection.limits.maxTarballBytes !== 16 * 1024 * 1024 ||
              inspection.limits.maxTotalFileBytes !== 64 * 1024 * 1024 ||
              !Array.isArray(inspection.inventory.files) ||
              JSON.stringify(inspection.inventory.files) !==
                JSON.stringify(EXPECTED_TAR_INVENTORY) ||
              !Number.isSafeInteger(inspection.inventory.totalFileBytes) ||
              inspection.inventory.totalFileBytes < 0 ||
              inspection.inventory.totalFileBytes > inspection.limits.maxTotalFileBytes ||
              !Array.isArray(inspection.members) ||
              inspection.members.length !== EXPECTED_TAR_INVENTORY.length
            ) {
              fail("tar inspection does not bind the admitted archive and inventory");
            }

