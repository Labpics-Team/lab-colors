              "source_binding_law",
              "source_binding_scope",
              "source_binding_exclusions",
              "source_closure_sha256",
              "source_negative_controls",
              "source_files",
              "universal_algebraic_certificate",
              "reference_and_anchor_proof",
              "basis_point_proof",
