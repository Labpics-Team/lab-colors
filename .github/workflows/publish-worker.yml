name: publish worker

# Публикует проверенный архив без повторной сборки.
# npm проверяет OIDC вызывающего publish.yml и environment npm-publish.
# Подготовка и публичная проверка не получают OIDC permission или секреты.

on:
  workflow_call:

permissions:
  contents: read
  actions: read

jobs:
  source-admission:
    if: >-
      github.repository == 'Labpics-Team/lab-colors' &&
      github.event_name == 'push' && github.ref_type == 'tag' &&
      startsWith(github.ref_name, 'colors-v')
    name: source admission (publish-worker)
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      head_sha: ${{ steps.identity.outputs.head_sha }}
      source_sha: ${{ steps.identity.outputs.source_sha }}
      caller_sha: ${{ steps.identity.outputs.caller_sha }}
      recipe_sha: ${{ steps.identity.outputs.recipe_sha }}
      recipe_ref: ${{ steps.identity.outputs.recipe_ref }}
      recipe_path: ${{ steps.identity.outputs.recipe_path }}
      run_id: ${{ steps.identity.outputs.run_id }}
      run_attempt: ${{ steps.identity.outputs.run_attempt }}
    steps:
      - name: Require owned source and native recipe identity
        id: identity
        shell: bash
        env:
          CI_REPOSITORY: ${{ github.repository }}
          CI_REPOSITORY_ID: ${{ github.repository_id }}
          CI_SOURCE_SHA: ${{ github.sha }}
          CI_CALLER_SHA: ${{ github.workflow_sha }}
          CI_NATIVE_JOB: ${{ toJSON(job) }}
          CI_EVENT: ${{ github.event_name }}
          CI_REF: ${{ github.ref }}
          CI_HEAD_REPOSITORY: ${{ github.event.pull_request.head.repo.full_name }}
          CI_HEAD_REPOSITORY_ID: ${{ github.event.pull_request.head.repo.id }}
          CI_HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          CI_RUN_ID: ${{ github.run_id }}
          CI_RUN_ATTEMPT: ${{ github.run_attempt }}
          CI_RUNNER_ENVIRONMENT: ${{ runner.environment }}
          CI_RUNNER_OS: ${{ runner.os }}
          CI_RUNNER_ARCH: ${{ runner.arch }}
          CI_RUNNER_NAME: ${{ runner.name }}
          CI_EXPECTED_RECIPE_PATH: .github/workflows/publish-worker.yml
          CI_REQUIRED_RUNNER_ENVIRONMENT: self-hosted
        run: |
          python3 - <<'PY'
          import json, os, sys
          def validate_owned_source(environment):
              """Служебные поля GitHub определяют источник; вход вызывающего файла не выдаёт полномочия."""
              import json, re

              def required(name):
                  value = environment.get(name, "")
                  if not isinstance(value, str) or not value:
                      raise ValueError("INCOMPLETE: missing native " + name)
                  return value

              def sha(name):
                  value = required(name)
                  if re.fullmatch(r"[0-9a-f]{40}", value) is None or value == "0" * 40:
                      raise ValueError("INCOMPLETE: invalid native " + name)
                  return value

              if environment.get("GITHUB_ACTIONS") != "true":
                  raise ValueError("INCOMPLETE: native GitHub Actions context is required")
              repository = required("CI_REPOSITORY")
              repository_id = required("CI_REPOSITORY_ID")
              if repository != "Labpics-Team/lab-colors" or repository_id != "1221255339":
                  raise ValueError("REFUSED: source repository is outside the owned scope")

              try:
                  native_job = json.loads(required("CI_NATIVE_JOB"))
              except (ValueError, TypeError) as error:
                  raise ValueError("INCOMPLETE: invalid native job context") from error
              if not isinstance(native_job, dict):
                  raise ValueError("INCOMPLETE: native job context is not an object")
              environment = dict(environment)
              for name, property_name in (
                  ("CI_RECIPE_SHA", "workflow_sha"),
                  ("CI_RECIPE_REF", "workflow_ref"),
                  ("CI_RECIPE_REPOSITORY", "workflow_repository"),
                  ("CI_RECIPE_PATH", "workflow_file_path"),
                  ("CI_CHECK_RUN_ID", "check_run_id"),
              ):
                  value = native_job.get(property_name)
                  if property_name == "check_run_id" and type(value) is int and value > 0:
                      value = str(value)
                  if not isinstance(value, str) or not value:
                      raise ValueError("INCOMPLETE: missing native job." + property_name)
                  environment[name] = value
              source_sha = sha("CI_SOURCE_SHA")
              caller_sha = sha("CI_CALLER_SHA")
              recipe_sha = sha("CI_RECIPE_SHA")
              recipe_repository = required("CI_RECIPE_REPOSITORY")
              recipe_path = required("CI_RECIPE_PATH")
              expected_path = required("CI_EXPECTED_RECIPE_PATH")
              recipe_ref = required("CI_RECIPE_REF")
              if recipe_repository != repository or recipe_path != expected_path:
                  raise ValueError("REFUSED: executing recipe repository or path differs")
              if re.fullmatch(r"\.github/workflows/[a-z0-9-]+\.yml", recipe_path) is None:
                  raise ValueError("REFUSED: invalid executing recipe path")
              prefix = repository + "/" + recipe_path + "@"
              if not recipe_ref.startswith(prefix) or not recipe_ref[len(prefix):]:
                  raise ValueError("INCOMPLETE: executing recipe ref is not bound to its file")

              protected_main = recipe_ref == prefix + "refs/heads/main"

              event = required("CI_EVENT")
              ref = required("CI_REF")
              if event == "pull_request":
                  head_repository = required("CI_HEAD_REPOSITORY")
                  head_id = required("CI_HEAD_REPOSITORY_ID")
                  sha("CI_HEAD_SHA")
                  if head_repository != repository or head_id != repository_id:
                      raise ValueError("REFUSED: foreign pull request head")
                  if re.fullmatch(r"refs/pull/[1-9][0-9]*/merge", ref) is None:
                      raise ValueError("REFUSED: unsupported pull request source ref")
              elif event == "merge_group":
                  if not ref.startswith("refs/heads/gh-readonly-queue/main/"):
                      raise ValueError("REFUSED: merge group is outside main")
              elif event == "push":
                  if ref != "refs/heads/main" and not ref.startswith("refs/tags/colors-v"):
                      raise ValueError("REFUSED: push is outside main or the release scope")
              elif event in ("workflow_dispatch", "schedule"):
                  if protected_main and ref != "refs/heads/main":
                      raise ValueError("REFUSED: manual or scheduled source is outside main")
                  if not protected_main and not ref.startswith("refs/heads/"):
                      raise ValueError("REFUSED: bootstrap source is not an owned branch")
              else:
                  raise ValueError("REFUSED: unsupported source event")

              runner_environment = required("CI_RUNNER_ENVIRONMENT")
              runner_os = required("CI_RUNNER_OS")
              runner_arch = required("CI_RUNNER_ARCH")
              runner_name = required("CI_RUNNER_NAME")
              expected_environment = required("CI_REQUIRED_RUNNER_ENVIRONMENT")
              if runner_environment not in ("self-hosted", "github-hosted"):
                  raise ValueError("INCOMPLETE: unknown runner environment")
              if expected_environment not in ("any", "self-hosted", "github-hosted"):
                  raise ValueError("REFUSED: unknown execution requirement")
              if expected_environment != "any" and runner_environment != expected_environment:
                  raise ValueError("REFUSED: required runner environment is unavailable")
              for name in ("CI_RUN_ID", "CI_RUN_ATTEMPT", "CI_CHECK_RUN_ID"):
                  if re.fullmatch(r"[1-9][0-9]*", required(name)) is None:
                      raise ValueError("INCOMPLETE: invalid native " + name)
              if protected_main:
                  if event in ("push", "workflow_dispatch", "schedule") and recipe_sha != source_sha:
                      raise ValueError("REFUSED: exact main or release recipe has not executed")
              elif not source_sha == caller_sha == recipe_sha:
                  # Допуск конкретного FULLSHA принадлежит native Listener, а не этому
                  # guard. Здесь разрешённый snapshot не вправе подменять свою identity.
                  raise ValueError("REFUSED: admitted snapshot differs from source or caller")
              binding = {
                  "source_sha": source_sha,
                  "head_sha": environment.get("CI_HEAD_SHA", "") if event == "pull_request" else "",
                  "caller_sha": caller_sha,
                  "recipe_sha": recipe_sha,
                  "recipe_ref": recipe_ref,
                  "recipe_repository": recipe_repository,
                  "recipe_path": recipe_path,
                  "runner_environment": runner_environment,
                  "runner_os": runner_os,
                  "runner_arch": runner_arch,
                  "runner_name": runner_name,
                  "run_id": environment["CI_RUN_ID"],
                  "run_attempt": environment["CI_RUN_ATTEMPT"],
                  "check_run_id": environment["CI_CHECK_RUN_ID"],
                  "identity_relation": "same-revision" if source_sha == recipe_sha else "distinct-revisions",
              }
              for key, value in binding.items():
                  if re.search(r"[\x00-\x1f\x7f]", value) is not None:
                      raise ValueError("REFUSED: control character in native " + key)
              return binding
          try:
              binding = validate_owned_source(os.environ)
          except ValueError as error:
              raise SystemExit(str(error))
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as output:
              for key, value in binding.items():
                  output.write('CI_BOUND_' + key.upper() + '=' + value + '\n')
              output.write('CI_VERIFIED_SOURCE_SHA=' + binding['source_sha'] + '\n')
              output.write('CI_VERIFIED_CALLER_SHA=' + binding['caller_sha'] + '\n')
              output.write('CI_VERIFIED_RECIPE_SHA=' + binding['recipe_sha'] + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              for key, value in binding.items():
                  output.write(key + '=' + value + '\n')
          print(json.dumps(binding, sort_keys=True))
          with open(os.environ['GITHUB_STEP_SUMMARY'], 'a', encoding='utf-8') as output:
              output.write('Source ' + binding['source_sha'] + '\n\nCaller ' + binding['caller_sha'] + '\n\nExecuting recipe ' + binding['recipe_sha'] + '\n\nIdentity relation ' + binding['identity_relation'] + '\n')
          PY

  prepare:
    needs: ["source-admission"]
    if: >-
      github.repository == 'Labpics-Team/lab-colors' &&
      github.event_name == 'push' && github.ref_type == 'tag' &&
      startsWith(github.ref_name, 'colors-v')
    uses: ./.github/workflows/package-worker.yml
    permissions:
      contents: read
  publish:
    needs: ["prepare", "source-admission"]
    outputs:
      tarball_sha256: ${{ steps.verified-artifact.outputs.sha256 }}
    env:
      NODE_TOOLCHAIN: ${{ needs.prepare.outputs.node }}
      NPM_TOOLCHAIN: ${{ needs.prepare.outputs.npm }}
    runs-on: ubuntu-latest
    # OIDC publisher remains scoped to this job; untrusted refs are rejected
    # before npm can obtain a short-lived publishing identity.
    if: >-
      github.repository == 'Labpics-Team/lab-colors' &&
      github.event_name == 'push' &&
      github.ref_type == 'tag' &&
      startsWith(github.ref_name, 'colors-v')
    # 15 = запас сверху при переходе с DE-02 на GitHub-hosted раннеры (старый
    # 10-минутный конверт поднят: history-replay на новом железе ещё невозможен);
    # перекалибровать по фактическим publish-прогонам.
    timeout-minutes: 15
    environment: npm-publish
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - name: Require declared execution environment
        shell: bash
        env:
          ACTUAL_RUNNER_ENVIRONMENT: ${{ runner.environment }}
        run: |
          test "$ACTUAL_RUNNER_ENVIRONMENT" = github-hosted || { echo 'REFUSED: required runner environment is unavailable' >&2; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Нужен только exact tag commit; ancestry доказывается read-only API
          # без сохранения workflow credential в git config.
          fetch-depth: 1
          persist-credentials: false
          ref: ${{ needs.source-admission.outputs.source_sha }}
      - name: isolated publish env (runner.temp)
        run: |
          echo "TMPDIR=$RUNNER_TEMP/tmp-$GITHUB_JOB" >> "$GITHUB_ENV"
          echo "NPM_CONFIG_CACHE=$RUNNER_TEMP/npm-$GITHUB_JOB" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/tmp-$GITHUB_JOB" "$RUNNER_TEMP/npm-$GITHUB_JOB"
      - name: guard — exact tag SHA is in origin/main
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          checked_out="$(git rev-parse HEAD)"
          if [ "$checked_out" != "$GITHUB_SHA" ]; then
            echo "checkout HEAD $checked_out != tag SHA $GITHUB_SHA" >&2
            exit 1
          fi
          node <<'NODE'
          const repository = process.env.GITHUB_REPOSITORY;
          const expectedSha = process.env.GITHUB_SHA;
          const apiRoot = process.env.GITHUB_API_URL;
          const token = process.env.GH_READ_TOKEN;
          if (!repository || !apiRoot || !token || !/^[0-9a-f]{40}$/u.test(expectedSha ?? "")) {
            throw new Error("tag ancestry guard is missing valid GitHub environment");
          }

          const path = `/repos/${repository}/compare/${encodeURIComponent(expectedSha)}...main`;
          (async () => {
            const response = await fetch(`${apiRoot}${path}`, {
              headers: {
                Accept: "application/vnd.github+json",
                Authorization: `Bearer ${token}`,
                "X-GitHub-Api-Version": "2022-11-28",
              },
            });
            if (!response.ok) {
              throw new Error(`GitHub API ${response.status} for ${path}: ${await response.text()}`);
            }
            const comparison = await response.json();
            const statusAllowsAncestor =
              comparison.status === "identical" || comparison.status === "ahead";
            if (
              !statusAllowsAncestor ||
              comparison.base_commit?.sha !== expectedSha ||
              comparison.merge_base_commit?.sha !== expectedSha
            ) {
              throw new Error(
                `tag ${process.env.GITHUB_REF_NAME ?? expectedSha} points outside main history`,
              );
            }
            console.log(`verified tag commit is in main history: ${expectedSha}`);
          })().catch((error) => {
            console.error(error instanceof Error ? error.stack : String(error));
            process.exitCode = 1;
          });
          NODE
      - name: guard — canonical exact-SHA workflow runs and their own jobs
        id: canonical-runs
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const { appendFileSync } = require("node:fs");

          const repository = process.env.GITHUB_REPOSITORY;
          const expectedSha = process.env.GITHUB_SHA;
          const apiRoot = process.env.GITHUB_API_URL;
          const output = process.env.GITHUB_OUTPUT;
          const token = process.env.GH_READ_TOKEN;
          if (!repository || !expectedSha || !apiRoot || !output || !token) {
            throw new Error("canonical-run guard is missing required GitHub environment");
          }

          const workflows = [
            {
              key: "ci",
              file: "ci.yml",
              path: ".github/workflows/ci.yml",
              worker: {
                path: "Labpics-Team/lab-colors/.github/workflows/ci-worker.yml",
              },
              requiredJobs: [
                "source admission (ci-worker)",
                "source admission (package-worker)",
                "formal core (Kani)",
                "MSRV workspace check",
                "clippy + rustfmt",
                "cargo doc (intra-doc links)",
                "test",
                "cargo audit (rustsec)",
                "wasm build + headless test + size",
              ],
            },
            {
              key: "native",
              file: "native-conformance.yml",
              path: ".github/workflows/native-conformance.yml",
              worker: {
                path: "Labpics-Team/lab-colors/.github/workflows/native-conformance-worker.yml",
              },
              requiredJobs: [
                "source admission (native-conformance-worker)",
                "swift package (Linux)",
                "swift package (macOS and iOS)",
                "android package",
              ],
            },
          ];

          async function api(path) {
            const response = await fetch(`${apiRoot}/repos/${repository}${path}`, {
              headers: {
                Accept: "application/vnd.github+json",
                Authorization: `Bearer ${token}`,
                "X-GitHub-Api-Version": "2022-11-28",
              },
            });
            if (!response.ok) {
              throw new Error(`GitHub API ${response.status} for ${path}: ${await response.text()}`);
            }
            return response.json();
          }

          async function paginated(path, field) {
            const values = [];
            for (let page = 1; page <= 10; page += 1) {
              const separator = path.includes("?") ? "&" : "?";
              const payload = await api(`${path}${separator}per_page=100&page=${page}`);
              if (!Array.isArray(payload[field])) {
                throw new Error(`GitHub API response has no ${field} array for ${path}`);
              }
              values.push(...payload[field]);
              if (payload[field].length < 100) return values;
            }
            throw new Error(`GitHub API pagination exceeded 1000 ${field} records for ${path}`);
          }

          // path сохраняет выбранный ref; sha отдельно связывает его с выполненным commit.
          // Локальный reusable-call имеет path@SHA и наследует тот же main ref.
          function admittedWorkflowPath(reference) {
            if (reference?.sha !== expectedSha || reference?.ref !== "refs/heads/main") return null;
            const path = reference?.path;
            if (typeof path !== "string") return null;
            const separator = path.lastIndexOf("@");
            if (separator < 0) return null;
            const ref = path.slice(separator + 1);
            if (ref !== "main" && ref !== expectedSha) return null;
            return path.slice(0, separator);
          }

          async function canonicalRun(spec) {
            const query = new URLSearchParams({
              branch: "main",
              event: "push",
              head_sha: expectedSha,
            });
            const runs = await paginated(
              `/actions/workflows/${encodeURIComponent(spec.file)}/runs?${query}`,
              "workflow_runs",
            );
            const candidates = runs
              .filter((run) =>
                run.path === spec.path &&
                run.head_sha === expectedSha &&
                run.head_branch === "main" &&
                run.event === "push")
              .sort((left, right) => Number(right.id) - Number(left.id));
            const run = candidates[0];
            if (!run) throw new Error(`${spec.path}: no canonical push run for ${expectedSha}`);
            if (!(run.status === "completed" && run.conclusion === "success")) {
              throw new Error(`${spec.path} run ${run.id}: ${run.status}/${run.conclusion ?? "none"}`);
            }
            const references = run.referenced_workflows;
            if (!Array.isArray(references) || references.length === 0 || references.length > 16) {
              throw new Error(`${spec.path} run ${run.id}: immutable workflow references are incomplete`);
            }
            const workflowPaths = references.map(admittedWorkflowPath);
            const primary = workflowPaths.filter(path => path === spec.worker.path);
            if (primary.length !== 1 || new Set(workflowPaths).size !== references.length) {
              throw new Error(`${spec.path} run ${run.id}: primary worker is missing or repeated`);
            }
            if (spec.key === 'ci') {
              for (const path of workflowPaths) {
                const expectedPrefix = repository + '/.github/workflows/';
                const name = typeof path === 'string' && path.startsWith(expectedPrefix)
                  ? path.slice(expectedPrefix.length) : '';
                if (!/^[A-Za-z0-9_-]+\.ya?ml$/u.test(name)) {
                  throw new Error(`${spec.path} run ${run.id}: workflow escaped the admitted source revision`);
                }
              }
            } else if (references.length !== 1) {
              throw new Error(`${spec.path} run ${run.id}: native worker reference is ambiguous`);
            }
            return run;
          }

          async function requireSuccessfulJobs(spec, run) {
            const jobs = await paginated(
              `/actions/runs/${run.id}/jobs?filter=latest`,
              "jobs",
            );
            const failures = [];
            for (const name of spec.requiredJobs) {
              // GitHub добавляет слева имена каждого reusable-caller. Последний
              // сегмент — каноничное имя worker-job независимо от глубины вызова;
              // run path, run_id и ровно одно совпадение замыкают его identity.
              const matches = jobs.filter((job) => {
                const workerName = job.name.split(" / ").at(-1);
                return workerName === name && Number(job.run_id) === Number(run.id);
              });
              if (matches.length !== 1) {
                failures.push(`${name}: expected one job in run ${run.id}, got ${matches.length}`);
                continue;
              }
              const job = matches[0];
              if (!(job.status === "completed" && job.conclusion === "success")) {
                failures.push(`${name}: ${job.status}/${job.conclusion ?? "none"}`);
              }
            }
            if (failures.length > 0) {
              throw new Error(`${spec.path} failed job gate:\n${failures.join("\n")}`);
            }
          }

          (async () => {
            const outputs = [];
            for (const spec of workflows) {
              const run = await canonicalRun(spec);
              await requireSuccessfulJobs(spec, run);
              outputs.push(`${spec.key}_run_id=${run.id}`);
              if (spec.key === "ci") {
                if (!Number.isSafeInteger(run.run_attempt) || run.run_attempt < 1) {
                  throw new Error(`${spec.path} run ${run.id}: invalid run_attempt`);
                }
                outputs.push(`ci_run_attempt=${run.run_attempt}`);
              }
              console.log(`${spec.path}: canonical successful push run ${run.id}`);
            }
            appendFileSync(output, `${outputs.join("\n")}\n`, "utf8");
          })().catch((error) => {
            console.error(error instanceof Error ? error.stack : String(error));
            process.exitCode = 1;
          });
          NODE
      - name: download verified package from the isolated preparation job
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: colors-release-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/colors-release-${{ github.sha }}-attempt-${{ github.run_attempt }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Одноразовый слот: GitHub-кэш не нужен. У setup-node вход `cache` — это
          # перечисление пакетных менеджеров, поэтому кэш выключается ОТСУТСТВИЕМ
          # `cache` плюс явным гашением автокэша npm (`cache: false` там падает).
          package-manager-cache: false
          node-version: ${{ env.NODE_TOOLCHAIN }}
          # No registry-url: setup-node would insert an authToken placeholder
          # that suppresses npm OIDC authentication when no token is provided.
      - name: validate manifest identity and byte-exact tarball
        id: verified-artifact
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/colors-release-${{ github.sha }}-attempt-${{ github.run_attempt }}
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_TAG: ${{ github.ref_name }}
          EXPECTED_NODE: ${{ env.NODE_TOOLCHAIN }}
          EXPECTED_NPM: ${{ env.NPM_TOOLCHAIN }}
          EXPECTED_TARBALL_SHA256: ${{ needs.prepare.outputs.tarball_sha256 }}
        run: |
          node <<'NODE'
          const { createHash } = require("node:crypto");
          const { execFileSync } = require("node:child_process");
          const {
            appendFileSync,
            chmodSync,
            closeSync,
            fsyncSync,
            lstatSync,
            mkdtempSync,
            openSync,
            readFileSync,
            readdirSync,
            writeSync,
          } = require("node:fs");
          const { basename, dirname, join } = require("node:path");
          const {
            POINT_SUPPORT_CERTIFIED_CLAIM,
            POINT_SUPPORT_EXCLUDED_CLAIM,
            POINT_SUPPORT_SOURCE_BINDING_SCOPE: POINT_SUPPORT_SOURCE_SCOPE,
            POINT_SUPPORT_SOURCE_BINDING_EXCLUSIONS: POINT_SUPPORT_SOURCE_EXCLUSIONS,
            POINT_SUPPORT_SOURCE_PATHS,
            exactJsonPayloadWithoutTopLevelField,
          } = require(
            `${process.env.GITHUB_WORKSPACE}/scripts/point-support-release-contract.cjs`,
          );

          const TAR_INSPECTOR_SHA256 =
            "c838aac0b1f918113d55839a77b913d1d4225dda39063c57f80efeb9fc153022";
          // The checked-out tag owns the package surface. Artifact declarations
          // must match this source; they cannot authorize their own contents.
          const sourcePackage = JSON.parse(readFileSync(
            join(process.env.GITHUB_WORKSPACE, "packages/colors/package.json"), "utf8",
          ));
          const EXPECTED_PACKAGE_FILES = sourcePackage.files;
          const EXPECTED_PACKAGE_EXPORTS = sourcePackage.exports;
          const EXPECTED_SNIPPET_PATTERN =
            /^pkg\/snippets\/labcolors-wasm-[0-9a-f]{16}\/inline0\.js$/u;
          const DECLARED_SNIPPET = "pkg/snippets/labcolors-wasm-" + "[0-9a-f]".repeat(16) + "/inline0.js";

          function expectedTarInventory(packageFiles, snippetFiles) {
            if (
              snippetFiles.length !== 1 ||
              snippetFiles.some((path) => !EXPECTED_SNIPPET_PATTERN.test(path)) ||
              new Set(snippetFiles).size !== snippetFiles.length
            ) {
              fail("worker generated snippet inventory is not canonical");
            }
            return [...new Set([
              ...packageFiles.filter((path) => path !== DECLARED_SNIPPET),
              ...snippetFiles,
              "README.md",
              "package.json",
            ])].sort((left, right) =>
              Buffer.compare(Buffer.from(left, "utf8"), Buffer.from(right, "utf8")),
            );
          }

          function fail(message) {
            throw new Error(`release artifact rejected: ${message}`);
          }

          if (
            !Array.isArray(EXPECTED_PACKAGE_FILES) ||
            EXPECTED_PACKAGE_FILES.length === 0 ||
            new Set(EXPECTED_PACKAGE_FILES).size !== EXPECTED_PACKAGE_FILES.length ||
            EXPECTED_PACKAGE_FILES.filter((path) => path === DECLARED_SNIPPET).length !== 1 ||
            EXPECTED_PACKAGE_FILES.some((path) => typeof path !== "string" ||
              (path !== DECLARED_SNIPPET && !/^[A-Za-z0-9_.-]+(?:\/[A-Za-z0-9_.-]+)*$/u.test(path)) ||
              path.split("/").some((part) => part === "." || part === "..")) ||
            !EXPECTED_PACKAGE_EXPORTS || typeof EXPECTED_PACKAGE_EXPORTS !== "object" ||
            Array.isArray(EXPECTED_PACKAGE_EXPORTS)
          ) {
            fail("worker package inventory allowlist is not canonical");
          }

          function sha256(bytes) {
            return createHash("sha256").update(bytes).digest("hex");
          }

          function exactKeys(value, expected, label) {
            const actual = value && typeof value === "object" && !Array.isArray(value)
              ? Object.keys(value).sort()
              : [];
            if (actual.join(",") !== [...expected].sort().join(",")) {
              fail(`${label} has a non-canonical shape`);
            }
          }

          function exactOrderedKeys(value, expected, label) {
            const actual = value && typeof value === "object" && !Array.isArray(value)
              ? Object.keys(value)
              : [];
            if (actual.join(",") !== expected.join(",")) {
              fail(`${label} has a non-canonical key order or shape`);
            }
          }

          function walk(directory, files = []) {
            for (const entry of readdirSync(directory, { withFileTypes: true })) {
              const path = join(directory, entry.name);
              const stat = lstatSync(path);
              if (stat.isSymbolicLink()) fail(`symlink is forbidden: ${path}`);
              if (stat.isDirectory()) walk(path, files);
              else if (stat.isFile()) files.push(path);
              else fail(`non-regular artifact entry: ${path}`);
            }
            return files;
          }

          function packedMember(tarball, members, path, label) {
            const matches = members.filter((member) => member.normalizedPath === path);
            if (matches.length !== 1) {
              fail(`${label} must have exactly one inspected packed member ${path}`);
            }
            const member = matches[0];
            if (
              member.rawPath !== `package/${path}` ||
              member.type !== "file" ||
              !Number.isSafeInteger(member.size) ||
              member.size < 0 ||
              !/^[0-9a-f]{64}$/u.test(member.sha256 ?? "")
            ) {
              fail(`${label} inspected member is not canonical`);
            }
            const packed = execFileSync("tar", ["-xOzf", tarball, member.rawPath], {
              maxBuffer: 64 * 1024 * 1024,
            });
            if (packed.length !== member.size || sha256(packed) !== member.sha256) {
              fail(`${label} extracted bytes differ from the inspected member`);
            }
            return packed;
          }

          function packedEvidence(tarball, members, records, path, label) {
            if (!Array.isArray(records)) fail(`${label} artifacts are not an array`);
            const matches = records.filter((record) => record?.path === path);
            if (matches.length !== 1) {
              fail(`${label} must bind exactly one ${path}, got ${matches.length}`);
            }
            const record = matches[0];
            exactKeys(record, ["path", "bytes", "sha256"], `${label} artifact`);
            const packed = packedMember(tarball, members, path, label);
            const digest = sha256(packed);
            if (
              !Number.isSafeInteger(record.bytes) ||
              record.bytes !== packed.length ||
              !/^[0-9a-f]{64}$/u.test(record.sha256 ?? "") ||
              record.sha256 !== digest
            ) {
              fail(`${label} does not bind the exact packed ${path} bytes`);
            }
            return packed;
          }

          function packedArtifact(
            tarball,
            members,
            record,
            expectedPath,
            label,
            expectedKeys = ["path", "bytes", "sha256"],
          ) {
            exactOrderedKeys(record, expectedKeys, `${label} record`);
            if (record.path !== expectedPath) {
              fail(`${label} path ${record.path} != ${expectedPath}`);
            }
            const packed = packedMember(tarball, members, expectedPath, label);
            const actualSha256 = sha256(packed);
            if (
              !Number.isSafeInteger(record.bytes) ||
              record.bytes <= 0 ||
              record.bytes !== packed.length ||
              !/^[0-9a-f]{64}$/u.test(record.sha256 ?? "") ||
              record.sha256 !== actualSha256
            ) {
              fail(`${label} does not bind the exact packed ${expectedPath} bytes`);
            }
            return packed;
          }

          function writeExclusiveFsyncedFile(path, bytes, label) {
            const handle = openSync(path, "wx", 0o600);
            try {
              let offset = 0;
              while (offset < bytes.length) {
                const written = writeSync(
                  handle,
                  bytes,
                  offset,
                  bytes.length - offset,
                  offset,
                );
                if (written <= 0) fail(`${label} write made no progress`);
                offset += written;
              }
              fsyncSync(handle);
            } finally {
              closeSync(handle);
            }
          }

          function fsyncDirectory(directory) {
            // The publish job is Linux-only. Win32 lacks a Node directory-handle
            // flush primitive, so local contract execution relies on file fsync + readback.
            if (process.platform === "win32") return;
            const directoryHandle = openSync(directory, "r");
            try {
              fsyncSync(directoryHandle);
            } finally {
              closeSync(directoryHandle);
            }
          }

          function materializeVerifiedTarball(bytes, digest, runnerTemp) {
            const directory = mkdtempSync(join(runnerTemp, "colors-publish-verified-"));
            chmodSync(directory, 0o700);
            const path = join(directory, `${digest}.tgz`);
            writeExclusiveFsyncedFile(path, bytes, "verified tarball snapshot");
            fsyncDirectory(directory);
            const snapshot = readFileSync(path);
            if (!snapshot.equals(bytes) || sha256(snapshot) !== digest) {
              fail("verified tarball snapshot differs from the validated bytes");
            }
            return path;
          }

          function inspectCanonicalTarball(tarball, bytes, digest, workspace, expectedInventory) {
            const inspectorPath = join(workspace, "scripts/inspect-npm-tarball.py");
            const inspectorBytes = readFileSync(inspectorPath);
            if (sha256(inspectorBytes) !== TAR_INSPECTOR_SHA256) {
              fail("tar inspector bytes differ from the worker-pinned helper");
            }

            const inventoryPath = join(dirname(tarball), "declared-inventory.json");
            const inventoryBytes = Buffer.from(
              `${JSON.stringify({ schemaVersion: 1, files: expectedInventory })}\n`,
              "utf8",
            );
            writeExclusiveFsyncedFile(
              inventoryPath,
              inventoryBytes,
              "declared tar inventory",
            );
            fsyncDirectory(dirname(tarball));

            const output = execFileSync(
              "python3",
              [
                inspectorPath,
                "--tarball",
                tarball,
                "--declared-inventory-json",
                inventoryPath,
              ],
              { encoding: "utf8", maxBuffer: 1024 * 1024 },
            );
            let inspection;
            try {
              inspection = JSON.parse(output);
            } catch {
              fail("tar inspector output is not JSON");
            }
            exactOrderedKeys(
              inspection,
              ["schemaVersion", "verdict", "tarball", "limits", "members", "inventory"],
              "tar inspection",
            );
            exactOrderedKeys(inspection.tarball, ["bytes", "sha256"], "tar inspection identity");
            exactOrderedKeys(
              inspection.limits,
              ["maxMembers", "maxTarballBytes", "maxTotalFileBytes"],
              "tar inspection limits",
            );
            exactOrderedKeys(
              inspection.inventory,
              ["files", "totalFileBytes"],
              "tar inspection inventory",
            );
            if (
              inspection.schemaVersion !== 1 ||
              inspection.verdict !== "canonical" ||
              inspection.tarball.bytes !== bytes.length ||
              inspection.tarball.sha256 !== digest ||
              inspection.limits.maxMembers !== expectedInventory.length ||
              inspection.limits.maxTarballBytes !== 16 * 1024 * 1024 ||
              inspection.limits.maxTotalFileBytes !== 64 * 1024 * 1024 ||
              !Array.isArray(inspection.inventory.files) ||
              JSON.stringify(inspection.inventory.files) !==
                JSON.stringify(expectedInventory) ||
              !Number.isSafeInteger(inspection.inventory.totalFileBytes) ||
              inspection.inventory.totalFileBytes < 0 ||
              inspection.inventory.totalFileBytes > inspection.limits.maxTotalFileBytes ||
              !Array.isArray(inspection.members) ||
              inspection.members.length !== expectedInventory.length
            ) {
              fail("tar inspection does not bind the admitted archive and inventory");
            }

            let totalFileBytes = 0;
            const memberPaths = [];
            for (let index = 0; index < inspection.members.length; index += 1) {
              const member = inspection.members[index];
              exactOrderedKeys(
                member,
                ["index", "rawPath", "normalizedPath", "type", "size", "sha256"],
                `tar inspection member ${index}`,
              );
              if (
                member.index !== index ||
                typeof member.normalizedPath !== "string" ||
                member.rawPath !== `package/${member.normalizedPath}` ||
                member.type !== "file" ||
                !Number.isSafeInteger(member.size) ||
                member.size < 0 ||
                !/^[0-9a-f]{64}$/u.test(member.sha256 ?? "")
              ) {
                fail(`tar inspection member ${index} is not canonical`);
              }
              memberPaths.push(member.normalizedPath);
              totalFileBytes += member.size;
            }
            memberPaths.sort((left, right) =>
              Buffer.compare(Buffer.from(left, "utf8"), Buffer.from(right, "utf8")),
            );
