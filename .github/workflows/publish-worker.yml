            point.excludedClaim !== pointProof.excluded_claim ||
            point.sourceBinding.schemaVersion !== pointProof.source_binding_schema_version ||
            point.sourceBinding.law !== pointProof.source_binding_law ||
            point.sourceBinding.scope !== pointProof.source_binding_scope ||
            JSON.stringify(point.sourceBinding.exclusions) !==
              JSON.stringify(pointProof.source_binding_exclusions) ||
            point.sourceBinding.closureSha256 !== pointProof.source_closure_sha256 ||
            pointProof.source_negative_controls !== 44 ||
            pointAlgebra?.method !==
              "exact-sparse-integer-polynomial-identities-plus-positive-denominator-order-lemma-v1" ||
            pointAlgebra?.wolfram_language_cross_check?.query_sha256 !==
              "8cdbb9964583030c8b92498961896cb2a98613f1cb31eb7c54acdf8e16beff10" ||
            pointAlgebra?.wolfram_language_cross_check?.result !==
              "{True, True, True, True, True}" ||
            pointAlgebra?.wolfram_language_cross_check?.result_sha256 !==
              "13a8f2ee8d0fde335a638e46d7cc8a8427b9a1437c77d22cfcf925bb87fa6303" ||
            point.q55Dependency.artifactId !== dependency?.artifact_id ||
            point.q55Dependency.artifactSha256 !== dependency?.artifact_sha256 ||
            point.q55Dependency.proofId !== dependency?.proof_id ||
            point.q55Dependency.proofSha256 !== dependency?.proof_sha256 ||
            point.q55Dependency.proofPayloadSha256 !== dependency?.proof_payload_sha256 ||
            dependency?.artifact_id !== wcagProof.artifact_id ||
            dependency?.artifact_sha256 !== wcagProof.artifact_sha256 ||
            dependency?.proof_id !== wcagProof.proof_id ||
            dependency?.proof_sha256 !== sha256(wcagProofBytes) ||
            dependency?.proof_payload_sha256 !== wcagProof.proof_payload_sha256
          ) {
            fail("point-support manifest evidence does not match its packed proof and Q55 dependency");
          }

          exactKeys(
            manifest.numericalCapabilities,
            ["schemaVersion", "coverage", "sites", "checksum"],
            "numerical capabilities",
          );
          if (
            manifest.numericalCapabilities.schemaVersion !== 2 ||
            manifest.numericalCapabilities.coverage !== "migrated-sites-only-v1" ||
            !/^[0-9a-f]{8}$/u.test(manifest.numericalCapabilities.checksum ?? "")
          ) {
            fail("numerical capabilities identity is not canonical");
          }
          const capabilitySites = manifest.numericalCapabilities.sites;
          if (!Array.isArray(capabilitySites)) {
            fail("numerical capabilities sites are not an array");
          }
          const siteIds = new Set();
          for (const site of capabilitySites) {
            exactKeys(
              site,
              ["siteId", ...CAPABILITY_SITE_LIST_FIELDS],
              "numerical capability site",
            );
            if (
              typeof site.siteId !== "string" ||
              site.siteId.length === 0 ||
              siteIds.has(site.siteId)
            ) {
              fail("numerical capabilities contain an invalid or duplicate site ID");
            }
            siteIds.add(site.siteId);
            for (const field of CAPABILITY_SITE_LIST_FIELDS) {
              if (
                !Array.isArray(site[field]) ||
                site[field].some((value) => typeof value !== "string" || value.length === 0) ||
                new Set(site[field]).size !== site[field].length
              ) {
                fail("numerical capability site contains a malformed or duplicate key list");
              }
            }
          }
          const expectedPointCapability = {
            siteId: point.siteId,
            stableOutcomes: ["canonical-finite-bounded"],
            compatibilityReleases: [],
            evidenceClasses: ["canonical-finite-bounded"],
            artifactIds: [point.artifactId],
            boundIds: [point.boundId],
            proofIds: [point.proofId],
            runtimeAttestations: [],
          };
          const expectedWcagCapability = {
            siteId: wcag.profileId,
            stableOutcomes: ["canonical-finite-bounded"],
            compatibilityReleases: [],
            evidenceClasses: ["canonical-finite-bounded"],
            artifactIds: [wcag.artifactId],
            boundIds: [wcag.boundId],
            proofIds: [wcag.proofId],
            runtimeAttestations: [],
          };
          const expectedCapabilitySites = [
            expectedPointCapability,
            expectedWcagCapability,
          ];
          if (
            JSON.stringify(capabilitySites) !== JSON.stringify(expectedCapabilitySites) ||
            manifest.numericalCapabilities.checksum !==
              capabilityChecksum(manifest.numericalCapabilities)
          ) {
            fail("numerical capabilities do not exactly bind the canonical evidence rows");
          }
          const expectedSupported = [
            "canonical-program-wire-v1",
            "atomic-program-runtime-v1",
            wcag.profileId,
          ];
          const expectedUnsupported = [
            "renderer-or-output-pipeline-equivalence",
            "spatial-glow-field",
          ];
          if (
            JSON.stringify(manifest.supported) !== JSON.stringify(expectedSupported) ||
            JSON.stringify(manifest.unsupported) !== JSON.stringify(expectedUnsupported)
          ) {
            fail("supported and unsupported claims are not the exact canonical disjoint sets");
          }

          const expectedWasm = [["runtime", "pkg/labcolors_bg.wasm"]];
          const wasmEvidence = manifest.artifacts?.wasm;
          if (!Array.isArray(wasmEvidence) || wasmEvidence.length !== 1) {
            fail("manifest must bind exactly the terminal runtime WASM");
          }
          const [runtimeRecord] = wasmEvidence;
          const [runtimeRole, runtimePath] = expectedWasm[0];
          if (runtimeRecord.role !== runtimeRole || runtimeRecord.path !== runtimePath) {
            fail(`WASM role must be ${runtimeRole} at ${runtimePath}`);
          }
          packedArtifact(
            tarball,
            tarMembers,
            runtimeRecord,
            runtimePath,
            "runtime WASM",
            ["role", "path", "bytes", "sha256"],
          );

          const metadataEvidence = manifest.artifacts.buildMetadata;
          const packedMetadata = packedArtifact(
            tarball,
            tarMembers,
            metadataEvidence,
            "build-metadata.json",
            "public build metadata",
          );
          const metadata = JSON.parse(packedMetadata.toString("utf8"));
          exactKeys(
            metadata,
            ["schemaVersion", "package", "sourceSha", "coreVersion", "conformance", "wasm"],
            "packed build metadata",
          );
          exactKeys(metadata.package, ["name", "version"], "packed build metadata package");
          exactKeys(
            metadata.conformance,
            ["packVersion", "packDigest", "manifestSha256", "familySetSha256"],
            "packed build metadata conformance",
          );
          if (
            metadata.schemaVersion !== 2 ||
            metadata.package.name !== "@labpics/colors" ||
            metadata.package.version !== expectedVersion ||
            metadata.sourceSha !== expectedSha ||
            metadata.coreVersion !== manifest.core ||
            metadata.conformance.packVersion !== manifest.conformance?.packVersion ||
            metadata.conformance.packDigest !== manifest.conformance?.packDigest ||
            metadata.conformance.manifestSha256 !== manifest.conformance?.manifestSha256 ||
            metadata.conformance.familySetSha256 !== manifest.conformance?.familySetSha256 ||
            !Array.isArray(metadata.wasm) ||
            metadata.wasm.length !== 1
          ) {
            fail("packed build metadata does not bind the release identity and conformance");
          }
          const [metadataWasm] = metadata.wasm;
          exactOrderedKeys(
            metadataWasm,
            ["role", "path", "bytes", "sha256"],
            "metadata WASM record",
          );
          if (JSON.stringify(metadataWasm) !== JSON.stringify(wasmEvidence[0])) {
            fail("public metadata runtime WASM differs from the release manifest");
          }

          const packedPackage = JSON.parse(
            packedMember(tarball, tarMembers, "package.json", "packed package").toString(
              "utf8",
            ),
          );
          if (packedPackage.name !== "@labpics/colors" || packedPackage.version !== expectedVersion) {
            fail(`packed identity ${packedPackage.name}@${packedPackage.version}`);
          }
          if (
            !Array.isArray(packedPackage.files) ||
            JSON.stringify(packedPackage.files) !== JSON.stringify(EXPECTED_PACKAGE_FILES)
          ) {
            fail("packed package files declaration differs from the admitted inventory");
          }
          if (JSON.stringify(packedPackage.exports) !== JSON.stringify(EXPECTED_PACKAGE_EXPORTS)) {
            fail("packed package exports differ from the admitted public surface");
          }
          const exportKeys = packedPackage.exports &&
              typeof packedPackage.exports === "object" &&
              !Array.isArray(packedPackage.exports)
            ? Object.keys(packedPackage.exports)
            : [];
          const privateExport = exportKeys.find(
            (key) =>
              key.includes("*") ||
              key === "./private-program" || key.startsWith("./private-program/"),
          );
          if (privateExport) fail(`private Program path is exported: ${privateExport}`);

          if (tarball.includes("\n") || tarball.includes("\r")) fail("unsafe tarball path");
          appendFileSync(output, `tarball=${tarball}\nsha256=${digest}\n`, "utf8");
          console.log(`verified ${basename(tarball)}: ${bytes.length} bytes, sha256 ${digest}`);
          })().catch((error) => {
            console.error(error instanceof Error ? error.stack : String(error));
            process.exitCode = 1;
          });
          NODE
      # Выпуск требует фактически выполняемой процедуры защищённого main.
      - name: Require protected publication recipe
        env:
          NATIVE_RECIPE_REF: ${{ needs.source-admission.outputs.recipe_ref }}
        run: |
          set -euo pipefail
          test "$NATIVE_RECIPE_REF" = "Labpics-Team/lab-colors/.github/workflows/publish-worker.yml@refs/heads/main"
      # Повторная проверка хеша перед единственным npm publish обнаруживает
      # изменение архива между проверкой и выпуском под тем же UID.
      - name: npm publish verified CI tarball (trusted OIDC, no rebuild/repack)
        env:
          TARBALL_PATH: ${{ steps.verified-artifact.outputs.tarball }}
          TARBALL_SHA256: ${{ steps.verified-artifact.outputs.sha256 }}
        run: |
          set -euo pipefail
          if [[ -z "${ACTIONS_ID_TOKEN_REQUEST_URL:-}" || -z "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:-}" ]]; then
            echo "npm OIDC identity is unavailable" >&2
            exit 1
          fi
          if [[ -n "${NODE_AUTH_TOKEN:-}" ]]; then
            echo "legacy npm token is not permitted" >&2
            exit 1
          fi
          actual_sha256="$(sha256sum --binary -- "$TARBALL_PATH")"
          actual_sha256="${actual_sha256%% *}"
          if [[ ! "$TARBALL_SHA256" =~ ^[0-9a-f]{64}$ || "$actual_sha256" != "$TARBALL_SHA256" ]]; then
            echo "verified tarball changed before npm publish" >&2
            exit 1
          fi
          npm publish --ignore-scripts --@labpics:registry=https://registry.npmjs.org "$TARBALL_PATH"

  verify-publication:
    name: installed public package
    needs: ["prepare", "publish", "source-admission"]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ needs.source-admission.outputs.source_sha }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ needs.prepare.outputs.node }}
          package-manager-cache: false
      - name: install the exact public archive and run its consumer examples
        env:
          EXPECTED_TARBALL_SHA256: ${{ needs.publish.outputs.tarball_sha256 }}
        run: node scripts/verify-published-package.mjs
