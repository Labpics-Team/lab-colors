name: publish worker

# Публикация @labpics/colors в npm по тегу colors-vX.Y.Z.
#
# Публикация идёт через explicit granular token: npm не поддерживает безтокенный
# trust flow на собственных раннерах. Secret `NPM_TOKEN` хранится в environment
# `npm-publish`, выдаёт write только пакету @labpics/colors и передаётся ровно
# publish-step. Environment ОБЪЯВЛЕН НА JOB'Е ЗДЕСЬ, а не в caller'е: у job'а с
# `uses:` ключ `environment` не поддерживается, и именно объявление внутри
# reusable-воркфлоу заставляет GitHub резолвить environment-секрет.
#
# Publish ничего не собирает и не перепаковывает. Он принимает только immutable
# attempt-scoped artifact `colors-release-$GITHUB_SHA-attempt-$RUN_ATTEMPT` из
# canonical successful push-run
# `.github/workflows/ci.yml` для exact tag SHA. Отдельно требуется canonical
# successful push-run `.github/workflows/native-conformance.yml`. Имена jobs
# проверяются только внутри выбранных run IDs, поэтому чужой check-run с таким
# же display name не может удовлетворить gate.
#
# Provenance-аттестация отключена (package.json publishConfig.provenance:false):
# npm выдаёт sigstore provenance только публичным репозиториям. При открытии
# репозитория вернуть provenance и короткоживущую аутентификацию.
#
# Неизменяемый worker: caller (publish.yml) закрепляет этот файл полным commit
# SHA и не может изменить ни job graph, ни пины. Своих inputs у worker нет.

on:
  workflow_call:

env:
  # Node 24.14.0 ships the npm 11.9.0 release packer/publisher contract.
  NODE_TOOLCHAIN: "24.14.0"
  NPM_TOOLCHAIN: "11.9.0"

permissions:
  contents: read
  actions: read

jobs:
  publish:
    runs-on: { group: labpics-ci-sandbox, labels: [labpics-ci-gvisor-v1] }
    environment: npm-publish
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # Нужен только exact tag commit; ancestry доказывается read-only API
          # без сохранения workflow credential в git config.
          fetch-depth: 1
          persist-credentials: false
      - name: isolated publish env (runner.temp)
        run: |
          echo "TMPDIR=$RUNNER_TEMP/tmp-$GITHUB_JOB" >> "$GITHUB_ENV"
          echo "NPM_CONFIG_CACHE=$RUNNER_TEMP/npm-$GITHUB_JOB" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/tmp-$GITHUB_JOB" "$RUNNER_TEMP/npm-$GITHUB_JOB"
      - name: guard — exact tag SHA is in origin/main
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          checked_out="$(git rev-parse HEAD)"
          if [ "$checked_out" != "$GITHUB_SHA" ]; then
            echo "checkout HEAD $checked_out != tag SHA $GITHUB_SHA" >&2
            exit 1
          fi
          node <<'NODE'
          const repository = process.env.GITHUB_REPOSITORY;
          const expectedSha = process.env.GITHUB_SHA;
          const apiRoot = process.env.GITHUB_API_URL;
          const token = process.env.GH_READ_TOKEN;
          if (!repository || !apiRoot || !token || !/^[0-9a-f]{40}$/u.test(expectedSha ?? "")) {
            throw new Error("tag ancestry guard is missing valid GitHub environment");
          }

          const path = `/repos/${repository}/compare/${encodeURIComponent(expectedSha)}...main`;
          (async () => {
            const response = await fetch(`${apiRoot}${path}`, {
              headers: {
                Accept: "application/vnd.github+json",
                Authorization: `Bearer ${token}`,
                "X-GitHub-Api-Version": "2022-11-28",
              },
            });
            if (!response.ok) {
              throw new Error(`GitHub API ${response.status} for ${path}: ${await response.text()}`);
            }
            const comparison = await response.json();
            const statusAllowsAncestor =
              comparison.status === "identical" || comparison.status === "ahead";
            if (
              !statusAllowsAncestor ||
              comparison.base_commit?.sha !== expectedSha ||
              comparison.merge_base_commit?.sha !== expectedSha
            ) {
              throw new Error(
                `tag ${process.env.GITHUB_REF_NAME ?? expectedSha} points outside main history`,
              );
            }
            console.log(`verified tag commit is in main history: ${expectedSha}`);
          })().catch((error) => {
            console.error(error instanceof Error ? error.stack : String(error));
            process.exitCode = 1;
          });
          NODE
      - name: guard — canonical exact-SHA workflow runs and their own jobs
        id: canonical-runs
        env:
          GH_READ_TOKEN: ${{ github.token }}
        run: |
          node <<'NODE'
          const { appendFileSync } = require("node:fs");

          const repository = process.env.GITHUB_REPOSITORY;
          const expectedSha = process.env.GITHUB_SHA;
          const apiRoot = process.env.GITHUB_API_URL;
          const output = process.env.GITHUB_OUTPUT;
          const token = process.env.GH_READ_TOKEN;
          if (!repository || !expectedSha || !apiRoot || !output || !token) {
            throw new Error("canonical-run guard is missing required GitHub environment");
          }

          const workflows = [
            {
              key: "ci",
              file: "ci.yml",
              path: ".github/workflows/ci.yml",
              requiredJobs: [
                "Node 22 consumer floor",
                "MSRV workspace check",
                "clippy + rustfmt",
                "cargo doc (intra-doc links)",
                "test",
                "cargo audit (rustsec)",
                "wasm build + headless test + size",
              ],
            },
            {
              key: "native",
              file: "native-conformance.yml",
              path: ".github/workflows/native-conformance.yml",
              requiredJobs: [
                "swift conformance (self-hosted Linux, swift container)",
              ],
            },
          ];

          async function api(path) {
            const response = await fetch(`${apiRoot}/repos/${repository}${path}`, {
              headers: {
                Accept: "application/vnd.github+json",
                Authorization: `Bearer ${token}`,
                "X-GitHub-Api-Version": "2022-11-28",
              },
            });
            if (!response.ok) {
              throw new Error(`GitHub API ${response.status} for ${path}: ${await response.text()}`);
            }
            return response.json();
          }

          async function paginated(path, field) {
            const values = [];
            for (let page = 1; page <= 10; page += 1) {
              const separator = path.includes("?") ? "&" : "?";
              const payload = await api(`${path}${separator}per_page=100&page=${page}`);
              if (!Array.isArray(payload[field])) {
                throw new Error(`GitHub API response has no ${field} array for ${path}`);
              }
              values.push(...payload[field]);
              if (payload[field].length < 100) return values;
            }
            throw new Error(`GitHub API pagination exceeded 1000 ${field} records for ${path}`);
          }

          async function canonicalRun(spec) {
            const query = new URLSearchParams({
              branch: "main",
              event: "push",
              head_sha: expectedSha,
            });
            const runs = await paginated(
              `/actions/workflows/${encodeURIComponent(spec.file)}/runs?${query}`,
              "workflow_runs",
            );
            const candidates = runs
              .filter((run) =>
                run.path === spec.path &&
                run.head_sha === expectedSha &&
                run.head_branch === "main" &&
                run.event === "push")
              .sort((left, right) => Number(right.id) - Number(left.id));
            const run = candidates[0];
            if (!run) throw new Error(`${spec.path}: no canonical push run for ${expectedSha}`);
            if (!(run.status === "completed" && run.conclusion === "success")) {
              throw new Error(`${spec.path} run ${run.id}: ${run.status}/${run.conclusion ?? "none"}`);
            }
            return run;
          }

          async function requireSuccessfulJobs(spec, run) {
            const jobs = await paginated(
              `/actions/runs/${run.id}/jobs?filter=latest`,
              "jobs",
            );
            const failures = [];
            for (const name of spec.requiredJobs) {
              const matches = jobs.filter((job) =>
                job.name === name && Number(job.run_id) === Number(run.id));
              if (matches.length !== 1) {
                failures.push(`${name}: expected one job in run ${run.id}, got ${matches.length}`);
                continue;
              }
              const job = matches[0];
              if (!(job.status === "completed" && job.conclusion === "success")) {
                failures.push(`${name}: ${job.status}/${job.conclusion ?? "none"}`);
              }
            }
            if (failures.length > 0) {
              throw new Error(`${spec.path} failed job gate:\n${failures.join("\n")}`);
            }
          }

          (async () => {
            const outputs = [];
            for (const spec of workflows) {
              const run = await canonicalRun(spec);
              await requireSuccessfulJobs(spec, run);
              outputs.push(`${spec.key}_run_id=${run.id}`);
              if (spec.key === "ci") {
                if (!Number.isSafeInteger(run.run_attempt) || run.run_attempt < 1) {
                  throw new Error(`${spec.path} run ${run.id}: invalid run_attempt`);
                }
                outputs.push(`ci_run_attempt=${run.run_attempt}`);
              }
              console.log(`${spec.path}: canonical successful push run ${run.id}`);
            }
            appendFileSync(output, `${outputs.join("\n")}\n`, "utf8");
          })().catch((error) => {
            console.error(error instanceof Error ? error.stack : String(error));
            process.exitCode = 1;
          });
          NODE
      - name: download immutable exact-SHA release artifact from canonical CI run
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: colors-release-${{ github.sha }}-attempt-${{ steps.canonical-runs.outputs.ci_run_attempt }}
          path: ${{ runner.temp }}/colors-release-${{ github.sha }}-attempt-${{ steps.canonical-runs.outputs.ci_run_attempt }}
          github-token: ${{ github.token }}
          run-id: ${{ steps.canonical-runs.outputs.ci_run_id }}
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Одноразовый слот: GitHub-кэш не нужен. У setup-node вход `cache` — это
          # перечисление пакетных менеджеров, поэтому кэш выключается ОТСУТСТВИЕМ
          # `cache` плюс явным гашением автокэша npm (`cache: false` там падает).
          package-manager-cache: false
          node-version: ${{ env.NODE_TOOLCHAIN }}
          registry-url: "https://registry.npmjs.org"
      - name: validate manifest identity and byte-exact tarball
        id: verified-artifact
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/colors-release-${{ github.sha }}-attempt-${{ steps.canonical-runs.outputs.ci_run_attempt }}
          EXPECTED_SHA: ${{ github.sha }}
          EXPECTED_TAG: ${{ github.ref_name }}
          EXPECTED_NODE: ${{ env.NODE_TOOLCHAIN }}
          EXPECTED_NPM: ${{ env.NPM_TOOLCHAIN }}
        run: |
          node <<'NODE'
          const { createHash } = require("node:crypto");
          const { execFileSync } = require("node:child_process");
          const {
            appendFileSync,
            lstatSync,
            readFileSync,
            readdirSync,
          } = require("node:fs");
          const { basename, join } = require("node:path");
          const {
            POINT_SUPPORT_CERTIFIED_CLAIM,
            POINT_SUPPORT_EXCLUDED_CLAIM,
            POINT_SUPPORT_SOURCE_BINDING_SCOPE: POINT_SUPPORT_SOURCE_SCOPE,
            POINT_SUPPORT_SOURCE_BINDING_EXCLUSIONS: POINT_SUPPORT_SOURCE_EXCLUSIONS,
            POINT_SUPPORT_SOURCE_PATHS,
            exactJsonPayloadWithoutTopLevelField,
          } = require(
            `${process.env.GITHUB_WORKSPACE}/scripts/point-support-release-contract.cjs`,
          );

          function fail(message) {
            throw new Error(`release artifact rejected: ${message}`);
          }

          function sha256(bytes) {
            return createHash("sha256").update(bytes).digest("hex");
          }

          function exactKeys(value, expected, label) {
            const actual = value && typeof value === "object" && !Array.isArray(value)
              ? Object.keys(value).sort()
              : [];
            if (actual.join(",") !== [...expected].sort().join(",")) {
              fail(`${label} has a non-canonical shape`);
            }
          }

          function walk(directory, files = []) {
            for (const entry of readdirSync(directory, { withFileTypes: true })) {
              const path = join(directory, entry.name);
              const stat = lstatSync(path);
              if (stat.isSymbolicLink()) fail(`symlink is forbidden: ${path}`);
              if (stat.isDirectory()) walk(path, files);
              else if (stat.isFile()) files.push(path);
              else fail(`non-regular artifact entry: ${path}`);
            }
            return files;
          }

          function packedEvidence(tarball, records, path, label) {
            if (!Array.isArray(records)) fail(`${label} artifacts are not an array`);
            const matches = records.filter((record) => record?.path === path);
            if (matches.length !== 1) {
              fail(`${label} must bind exactly one ${path}, got ${matches.length}`);
            }
            const record = matches[0];
            exactKeys(record, ["path", "bytes", "sha256"], `${label} artifact`);
            const packed = execFileSync("tar", ["-xOzf", tarball, `package/${path}`]);
            const digest = sha256(packed);
            if (
              !Number.isSafeInteger(record.bytes) ||
              record.bytes !== packed.length ||
              !/^[0-9a-f]{64}$/u.test(record.sha256 ?? "") ||
              record.sha256 !== digest
            ) {
              fail(`${label} does not bind the exact packed ${path} bytes`);
            }
            return packed;
          }

          const CAPABILITY_SITE_LIST_FIELDS = [
            "stableOutcomes",
            "compatibilityReleases",
            "evidenceClasses",
            "artifactIds",
            "boundIds",
            "proofIds",
            "runtimeAttestations",
          ];
          function u32le(value) {
            const bytes = Buffer.alloc(4);
            bytes.writeUInt32LE(value >>> 0, 0);
            return bytes;
          }

          function lenPrefixed(value) {
            return [u32le(value.length), value];
          }

          function compareUtf8(left, right) {
            return Buffer.compare(Buffer.from(left, "utf8"), Buffer.from(right, "utf8"));
          }

          function capabilityChecksum(capabilities) {
            const chunks = [];
            chunks.push(
              ...lenPrefixed(Buffer.from("labcolors.numerical-capability.v2", "utf8")),
            );
            chunks.push(u32le(capabilities.schemaVersion));
            chunks.push(...lenPrefixed(Buffer.from(capabilities.coverage, "utf8")));
            const sites = [...capabilities.sites].sort(
              (left, right) => compareUtf8(left.siteId, right.siteId),
            );
            chunks.push(u32le(sites.length));
            for (const site of sites) {
              chunks.push(...lenPrefixed(Buffer.from(site.siteId, "utf8")));
              for (const field of CAPABILITY_SITE_LIST_FIELDS) {
                const values = [...site[field]].sort(compareUtf8);
                chunks.push(u32le(values.length));
                for (const value of values) {
                  chunks.push(...lenPrefixed(Buffer.from(value, "utf8")));
                }
              }
            }
            let hash = 0x811c9dc5;
            for (const chunk of chunks) {
              for (const byte of chunk) {
                hash ^= byte;
                hash = Math.imul(hash, 0x01000193) >>> 0;
              }
            }
            return hash.toString(16).padStart(8, "0");
          }

          const artifactDir = process.env.ARTIFACT_DIR;
          const expectedSha = process.env.EXPECTED_SHA;
          const expectedTag = process.env.EXPECTED_TAG;
          const expectedNode = process.env.EXPECTED_NODE;
          const expectedNpm = process.env.EXPECTED_NPM;
          const output = process.env.GITHUB_OUTPUT;
          if (!artifactDir || !expectedSha || !expectedTag || !expectedNode || !expectedNpm || !output) {
            fail("validator is missing required environment");
          }
          if (process.versions.node !== expectedNode) {
            fail(`Node ${process.versions.node} != ${expectedNode}`);
          }
          const npmVersion = execFileSync("npm", ["--version"], { encoding: "utf8" }).trim();
          if (npmVersion !== expectedNpm) fail(`npm ${npmVersion} != ${expectedNpm}`);
          if (!/^colors-v\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?$/u.test(expectedTag)) {
            fail(`invalid release tag ${expectedTag}`);
          }

          const files = walk(artifactDir);
          const manifests = files.filter((path) => basename(path) === "release-manifest.json");
          const tarballs = files.filter((path) => path.endsWith(".tgz"));
          if (files.length !== 2 || manifests.length !== 1 || tarballs.length !== 1) {
            fail(`expected exactly one manifest and one tarball, got ${files.length} files`);
          }

          const manifest = JSON.parse(readFileSync(manifests[0], "utf8"));
          const expectedVersion = expectedTag.slice("colors-v".length);
          if (manifest.schemaVersion !== 4) fail(`manifest schema ${manifest.schemaVersion}`);
          exactKeys(
            manifest,
            [
              "schemaVersion",
              "npm",
              "core",
              "wire",
              "conformance",
              "normativeEvidence",
              "numericalEvidence",
              "sourceSha",
              "reproducibility",
              "requirements",
              "supported",
              "numericalCapabilities",
              "unsupported",
              "artifacts",
            ],
            "release manifest",
          );
          if (manifest.sourceSha !== expectedSha) {
            fail(`manifest sourceSha ${manifest.sourceSha} != ${expectedSha}`);
          }
          if (manifest.npm !== expectedVersion) {
            fail(`manifest npm ${manifest.npm} != tag version ${expectedVersion}`);
          }
          exactKeys(manifest.artifacts, ["tarball", "wasm", "buildMetadata"], "manifest artifacts");

          const tarball = tarballs[0];
          const bytes = readFileSync(tarball);
          const evidence = manifest.artifacts?.tarball;
          if (!evidence || evidence.path !== `.release/${basename(tarball)}`) {
            fail("manifest tarball path does not identify the downloaded tarball");
          }
          if (!Number.isSafeInteger(evidence.bytes) || evidence.bytes !== bytes.length) {
            fail(`tarball bytes ${bytes.length} != manifest ${evidence.bytes}`);
          }
          const digest = sha256(bytes);
          if (!/^[0-9a-f]{64}$/u.test(evidence.sha256) || evidence.sha256 !== digest) {
            fail(`tarball sha256 ${digest} != manifest ${evidence.sha256}`);
          }

          exactKeys(manifest.normativeEvidence, ["wcag22"], "normative evidence");
          exactKeys(
            manifest.numericalEvidence,
            ["pointSupportReferenceSurplus"],
            "numerical evidence",
          );
          const wcag = manifest.normativeEvidence.wcag22;
          exactKeys(
            wcag,
            [
              "profileId",
              "profileChecksum",
              "artifactId",
              "boundId",
              "proofId",
              "kernelId",
              "terminalEvidenceId",
              "parserId",
              "facadeId",
              "artifacts",
            ],
            "WCAG22 normative evidence",
          );
          if (!Array.isArray(wcag.artifacts) || wcag.artifacts.length !== 3) {
            fail("WCAG22 normative evidence must bind exactly three packed artifacts");
          }
          const wcagProfileBytes = packedEvidence(
            tarball,
            wcag.artifacts,
            "evidence/wcag22-srgb8-v1.json",
            "WCAG22",
          );
          const wcagQ55Bytes = packedEvidence(
            tarball,
            wcag.artifacts,
            "evidence/wcag22-srgb8-q55-v1.bin",
            "WCAG22",
          );
          const wcagProofBytes = packedEvidence(
            tarball,
            wcag.artifacts,
            "evidence/wcag22-srgb8-q55-proof-v1.json",
            "WCAG22",
          );
          if (wcagQ55Bytes.length !== 12_288) {
            fail("packed WCAG22 Q55 artifact has a non-canonical byte length");
          }
          const wcagProfile = JSON.parse(wcagProfileBytes.toString("utf8"));
          const wcagProof = JSON.parse(wcagProofBytes.toString("utf8"));
          if (
            wcagProof.schema_version !== 2 ||
            wcag.profileId !== "wcag22-srgb8-contrast-v1" ||
            wcag.artifactId !== "wcag22-srgb8-luminance-q55-v1" ||
            wcag.boundId !== "wcag22-srgb8-outward-q55-v1" ||
            wcag.proofId !== "wcag22-srgb8-full-domain-q55-v1" ||
            wcag.profileId !== wcagProfile.profileId ||
            wcag.profileId !== wcagProof.profile_id ||
            wcag.profileChecksum !== wcagProof.profile_checksum ||
            wcag.artifactId !== wcagProof.artifact_id ||
            wcag.boundId !== wcagProof.bound_id ||
            wcag.proofId !== wcagProof.proof_id ||
            wcag.kernelId !== wcagProof.kernel_id ||
            wcag.terminalEvidenceId !== wcagProof.terminal_evidence_id ||
            wcag.parserId !== wcagProof.parser_id ||
            wcag.facadeId !== wcagProof.facade_id ||
            wcagProof.profile_source_sha256 !== sha256(wcagProfileBytes) ||
            wcagProof.artifact_sha256 !== sha256(wcagQ55Bytes) ||
            !/^[0-9a-f]{64}$/u.test(wcagProof.proof_payload_sha256 ?? "")
          ) {
            fail("WCAG22 manifest evidence does not match the exact packed proof chain");
          }

          const point = manifest.numericalEvidence.pointSupportReferenceSurplus;
          exactKeys(
            point,
            [
              "siteId",
              "profileId",
              "artifactId",
              "boundId",
              "proofId",
              "proofSha256",
              "proofPayloadSha256",
              "declaredOperationLaw",
              "certifiedClaim",
              "excludedClaim",
              "sourceBinding",
              "q55Dependency",
              "artifacts",
            ],
            "point-support numerical evidence",
          );
          exactKeys(
            point.sourceBinding,
            ["schemaVersion", "law", "scope", "exclusions", "closureSha256"],
            "point-support source binding",
          );
          exactKeys(
            point.q55Dependency,
            [
              "artifactId",
              "artifactSha256",
              "proofId",
              "proofSha256",
              "proofPayloadSha256",
            ],
            "point-support Q55 dependency",
          );
          if (!Array.isArray(point.artifacts) || point.artifacts.length !== 1) {
            fail("point-support numerical evidence must bind exactly one packed proof");
          }
          const pointProofBytes = packedEvidence(
            tarball,
            point.artifacts,
            "evidence/point-support-reference-surplus-q55-bps-proof-v1.json",
            "point-support",
          );
          const checkedOutPointProofBytes = readFileSync(
            "crates/labcolors-core/contracts/point-support-reference-surplus-q55-bps-proof-v1.json",
          );
          if (!pointProofBytes.equals(checkedOutPointProofBytes)) {
            fail("point-support packed proof differs from the exact tag source bytes");
          }
          const pointProof = JSON.parse(pointProofBytes.toString("utf8"));
          const dependency = pointProof.q55_dependency;
          const pointProofPayloadBytes = exactJsonPayloadWithoutTopLevelField(
            pointProofBytes,
            "proof_payload_sha256",
            "point-support packed proof",
            fail,
          );
          if (
            sha256(pointProofPayloadBytes) !== pointProof.proof_payload_sha256
          ) {
            fail("point-support packed proof payload digest is invalid");
          }
          exactKeys(
            pointProof,
            [
              "schema_version",
              "profile_id",
              "site_id",
              "artifact_id",
              "bound_id",
              "proof_id",
              "declared_operation_law",
              "certified_claim",
              "excluded_claim",
              "q55_dependency",
              "source_binding_schema_version",
              "source_binding_law",
              "source_binding_scope",
              "source_binding_exclusions",
              "source_closure_sha256",
              "source_negative_controls",
              "source_files",
              "universal_algebraic_certificate",
              "reference_and_anchor_proof",
              "basis_point_proof",
              "comparator_proof",
              "integer_replay_envelope",
              "verifier_sha256",
              "proof_payload_sha256",
            ],
            "point-support packed proof",
          );
          if (
            !Array.isArray(pointProof.source_files) ||
            pointProof.source_files.length !== POINT_SUPPORT_SOURCE_PATHS.length
          ) {
            fail("point-support proof source cone is not exact");
          }
          for (const [index, sourceFile] of pointProof.source_files.entries()) {
            exactKeys(sourceFile, ["path", "kind", "sha256"], `point source file ${index}`);
            const expectedPath = POINT_SUPPORT_SOURCE_PATHS[index];
            const expectedKind = expectedPath.endsWith(".rs")
              ? "rust-source"
              : "compile-time-input";
            if (
              sourceFile.path !== expectedPath ||
              sourceFile.kind !== expectedKind ||
              !/^[0-9a-f]{64}$/u.test(sourceFile.sha256 ?? "")
            ) {
              fail(`point-support proof source file ${index} is non-canonical`);
            }
          }
          const pointAlgebra = pointProof.universal_algebraic_certificate;
          if (
            pointProof.schema_version !== 2 ||
            point.siteId !== "point-support-retained-reference-surplus-v1" ||
            point.profileId !== "srgb8-q55-retained-reference-surplus-bps-v1" ||
            point.artifactId !== "wcag22-srgb8-luminance-q55-v1" ||
            point.boundId !== "point-support-reference-surplus-q55-bps-v1" ||
            point.proofId !== "point-support-reference-surplus-integer-v1" ||
            point.declaredOperationLaw !==
              "q55-lower-reference-distance-explicit-anchor-bps-retention-v1" ||
            point.certifiedClaim !== POINT_SUPPORT_CERTIFIED_CLAIM ||
            point.excludedClaim !== POINT_SUPPORT_EXCLUDED_CLAIM ||
            point.sourceBinding.schemaVersion !== 2 ||
            point.sourceBinding.law !== "point-support-rust-whole-file-semantic-cone-v2" ||
            point.sourceBinding.scope !== POINT_SUPPORT_SOURCE_SCOPE ||
            JSON.stringify(point.sourceBinding.exclusions) !==
              JSON.stringify(POINT_SUPPORT_SOURCE_EXCLUSIONS) ||
            !/^[0-9a-f]{64}$/u.test(point.sourceBinding.closureSha256 ?? "") ||
            !/^[0-9a-f]{64}$/u.test(point.proofPayloadSha256 ?? "") ||
            point.siteId !== pointProof.site_id ||
            point.profileId !== pointProof.profile_id ||
            point.artifactId !== pointProof.artifact_id ||
            point.boundId !== pointProof.bound_id ||
            point.proofId !== pointProof.proof_id ||
            point.proofSha256 !== sha256(pointProofBytes) ||
            point.proofPayloadSha256 !== pointProof.proof_payload_sha256 ||
            point.declaredOperationLaw !== pointProof.declared_operation_law ||
            point.certifiedClaim !== pointProof.certified_claim ||
            point.excludedClaim !== pointProof.excluded_claim ||
            point.sourceBinding.schemaVersion !== pointProof.source_binding_schema_version ||
            point.sourceBinding.law !== pointProof.source_binding_law ||
            point.sourceBinding.scope !== pointProof.source_binding_scope ||
            JSON.stringify(point.sourceBinding.exclusions) !==
              JSON.stringify(pointProof.source_binding_exclusions) ||
            point.sourceBinding.closureSha256 !== pointProof.source_closure_sha256 ||
            pointProof.source_negative_controls !== 43 ||
            pointAlgebra?.method !==
              "exact-sparse-integer-polynomial-identities-plus-positive-denominator-order-lemma-v1" ||
            pointAlgebra?.wolfram_language_cross_check?.query_sha256 !==
              "8cdbb9964583030c8b92498961896cb2a98613f1cb31eb7c54acdf8e16beff10" ||
            pointAlgebra?.wolfram_language_cross_check?.result !==
              "{True, True, True, True, True}" ||
            pointAlgebra?.wolfram_language_cross_check?.result_sha256 !==
              "13a8f2ee8d0fde335a638e46d7cc8a8427b9a1437c77d22cfcf925bb87fa6303" ||
            point.q55Dependency.artifactId !== dependency?.artifact_id ||
            point.q55Dependency.artifactSha256 !== dependency?.artifact_sha256 ||
            point.q55Dependency.proofId !== dependency?.proof_id ||
            point.q55Dependency.proofSha256 !== dependency?.proof_sha256 ||
            point.q55Dependency.proofPayloadSha256 !== dependency?.proof_payload_sha256 ||
            dependency?.artifact_id !== wcagProof.artifact_id ||
            dependency?.artifact_sha256 !== wcagProof.artifact_sha256 ||
            dependency?.proof_id !== wcagProof.proof_id ||
            dependency?.proof_sha256 !== sha256(wcagProofBytes) ||
            dependency?.proof_payload_sha256 !== wcagProof.proof_payload_sha256
          ) {
            fail("point-support manifest evidence does not match its packed proof and Q55 dependency");
          }

          exactKeys(
            manifest.numericalCapabilities,
            ["schemaVersion", "coverage", "sites", "checksum"],
            "numerical capabilities",
          );
          if (
            manifest.numericalCapabilities.schemaVersion !== 2 ||
            manifest.numericalCapabilities.coverage !== "migrated-sites-only-v1" ||
            !/^[0-9a-f]{8}$/u.test(manifest.numericalCapabilities.checksum ?? "")
          ) {
            fail("numerical capabilities identity is not canonical");
          }
          const capabilitySites = manifest.numericalCapabilities.sites;
          if (!Array.isArray(capabilitySites)) {
            fail("numerical capabilities sites are not an array");
          }
          const siteIds = new Set();
          for (const site of capabilitySites) {
            exactKeys(
              site,
              ["siteId", ...CAPABILITY_SITE_LIST_FIELDS],
              "numerical capability site",
            );
            if (
              typeof site.siteId !== "string" ||
              site.siteId.length === 0 ||
              siteIds.has(site.siteId)
            ) {
              fail("numerical capabilities contain an invalid or duplicate site ID");
            }
            siteIds.add(site.siteId);
            for (const field of CAPABILITY_SITE_LIST_FIELDS) {
              if (
                !Array.isArray(site[field]) ||
                site[field].some((value) => typeof value !== "string" || value.length === 0) ||
                new Set(site[field]).size !== site[field].length
              ) {
                fail("numerical capability site contains a malformed or duplicate key list");
              }
            }
          }
          const expectedPointCapability = {
            siteId: point.siteId,
            stableOutcomes: ["canonical-finite-bounded"],
            compatibilityReleases: [],
            evidenceClasses: ["canonical-finite-bounded"],
            artifactIds: [point.artifactId],
            boundIds: [point.boundId],
            proofIds: [point.proofId],
            runtimeAttestations: [],
          };
          const expectedWcagCapability = {
            siteId: wcag.profileId,
            stableOutcomes: ["canonical-finite-bounded"],
            compatibilityReleases: [],
            evidenceClasses: ["canonical-finite-bounded"],
            artifactIds: [wcag.artifactId],
            boundIds: [wcag.boundId],
            proofIds: [wcag.proofId],
            runtimeAttestations: [],
          };
          const expectedCapabilitySites = [
            {
              siteId: "glow-target-or-maximum-v1",
              stableOutcomes: ["bit-exact", "indeterminate"],
              compatibilityReleases: ["glow-cam16-ucs-jprime-target-or-max-v1"],
              evidenceClasses: ["bit-exact"],
              artifactIds: [],
              boundIds: [],
              proofIds: [],
              runtimeAttestations: [],
            },
            expectedPointCapability,
            expectedWcagCapability,
          ];
          if (
            JSON.stringify(capabilitySites) !== JSON.stringify(expectedCapabilitySites) ||
            manifest.numericalCapabilities.checksum !==
              capabilityChecksum(manifest.numericalCapabilities)
          ) {
            fail("numerical capabilities do not exactly bind the canonical evidence rows");
          }
          const expectedSupported = [
            "exact-alpha-srgb8-v1",
            "exact-screen-composite-srgb8-v1",
            "typed-glow-indeterminate-v1",
            wcag.profileId,
          ];
          const expectedUnsupported = [
            "embedded-wire-schema-version",
            "stable-cam16-glow-target-or-maximum-selection",
            "renderer-or-output-pipeline-equivalence",
            "spatial-glow-field",
          ];
          if (
            JSON.stringify(manifest.supported) !== JSON.stringify(expectedSupported) ||
            JSON.stringify(manifest.unsupported) !== JSON.stringify(expectedUnsupported)
          ) {
            fail("supported and unsupported claims are not the exact canonical disjoint sets");
          }

          const expectedWasm = [["runtime", "pkg/labcolors_bg.wasm"]];
          const wasmEvidence = manifest.artifacts?.wasm;
          if (!Array.isArray(wasmEvidence) || wasmEvidence.length !== expectedWasm.length) {
            fail("manifest must bind exactly the runtime WASM role");
          }
          for (let index = 0; index < expectedWasm.length; index += 1) {
            const [role, path] = expectedWasm[index];
            const record = wasmEvidence[index];
            const keys = record && typeof record === "object" ? Object.keys(record) : [];
            if (keys.join(",") !== "role,path,bytes,sha256") {
              fail(`${role} WASM record has a non-canonical shape`);
            }
            if (record.role !== role || record.path !== path) {
              fail(`WASM role ${index} must be ${role} at ${path}`);
            }
            const packedWasm = execFileSync("tar", ["-xOzf", tarball, `package/${path}`]);
            const packedDigest = createHash("sha256").update(packedWasm).digest("hex");
            if (record.bytes !== packedWasm.length || record.sha256 !== packedDigest) {
              fail(`${role} WASM record does not match the exact tarball bytes`);
            }
          }

          const metadataEvidence = manifest.artifacts.buildMetadata;
          exactKeys(metadataEvidence, ["path", "bytes", "sha256"], "build metadata record");
          if (metadataEvidence.path !== "build-metadata.json") {
            fail(`build metadata path ${metadataEvidence.path}`);
          }
          const packedMetadata = execFileSync(
            "tar",
            ["-xOzf", tarball, "package/build-metadata.json"],
          );
          const packedMetadataDigest = createHash("sha256").update(packedMetadata).digest("hex");
          if (
            metadataEvidence.bytes !== packedMetadata.length ||
            metadataEvidence.sha256 !== packedMetadataDigest
          ) {
            fail("build metadata record does not match the exact tarball bytes");
          }
          const metadata = JSON.parse(packedMetadata.toString("utf8"));
          exactKeys(
            metadata,
            ["schemaVersion", "package", "sourceSha", "coreVersion", "conformance", "wasm"],
            "packed build metadata",
          );
          exactKeys(metadata.package, ["name", "version"], "packed build metadata package");
          exactKeys(
            metadata.conformance,
            ["packVersion", "packDigest", "manifestSha256", "familySetSha256"],
            "packed build metadata conformance",
          );
          if (
            metadata.schemaVersion !== 2 ||
            metadata.package.name !== "@labpics/colors" ||
            metadata.package.version !== expectedVersion ||
            metadata.sourceSha !== expectedSha ||
            metadata.coreVersion !== manifest.core ||
            metadata.conformance.packVersion !== manifest.conformance?.packVersion ||
            metadata.conformance.packDigest !== manifest.conformance?.packDigest ||
            metadata.conformance.manifestSha256 !== manifest.conformance?.manifestSha256 ||
            metadata.conformance.familySetSha256 !== manifest.conformance?.familySetSha256 ||
            !Array.isArray(metadata.wasm) ||
            metadata.wasm.length !== wasmEvidence.length
          ) {
            fail("packed build metadata does not bind the release identity and conformance");
          }
          for (let index = 0; index < wasmEvidence.length; index += 1) {
            const metadataWasm = metadata.wasm[index];
            exactKeys(metadataWasm, ["role", "path", "bytes", "sha256"], "metadata WASM record");
            if (JSON.stringify(metadataWasm) !== JSON.stringify(wasmEvidence[index])) {
              fail(`metadata WASM role ${index} differs from the release manifest`);
            }
          }

          const packedPackage = JSON.parse(
            execFileSync("tar", ["-xOzf", tarball, "package/package.json"], {
              encoding: "utf8",
            }),
          );
          if (packedPackage.name !== "@labpics/colors" || packedPackage.version !== expectedVersion) {
            fail(`packed identity ${packedPackage.name}@${packedPackage.version}`);
          }

          if (tarball.includes("\n") || tarball.includes("\r")) fail("unsafe tarball path");
          appendFileSync(output, `tarball=${tarball}\n`, "utf8");
          console.log(`verified ${basename(tarball)}: ${bytes.length} bytes, sha256 ${digest}`);
          NODE
      - name: npm publish verified CI tarball (granular token, no rebuild/repack)
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          TARBALL_PATH: ${{ steps.verified-artifact.outputs.tarball }}
        run: npm publish --ignore-scripts "$TARBALL_PATH"
