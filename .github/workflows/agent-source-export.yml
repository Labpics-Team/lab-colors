name: Agent source export

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  export:
    if: github.event.pull_request.number == 366
    runs-on: [self-hosted, Linux, X64]
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: archive source
        run: |
          git archive --format=tar.gz --output=lab-colors-source.tar.gz HEAD
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: lab-colors-source
          path: lab-colors-source.tar.gz
          if-no-files-found: error
          retention-days: 1
