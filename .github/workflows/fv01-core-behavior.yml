name: FV-01 core behavior proof

on:
  push:
    branches:
      - r12/fv-01-attached-materialization-authority

permissions:
  contents: read

jobs:
  attached-behavior:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.96.0
      - name: Run attached FV-01 behavior proofs
        run: cargo test -p labcolors-core --lib --locked program_wire::attached_tests -- --nocapture
