name: Native receipt regeneration (development)

on:
  pull_request:

permissions:
  contents: read

concurrency:
  group: native-receipts-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  regenerate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha }}
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: '1.96.0'
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4
      - name: reproduce source-bound records on the CI runner
        run: |
          set -euo pipefail
          output="$RUNNER_TEMP/native-receipts"
          mkdir -p "$output/crates/labcolors-core/contracts/clean-set-srgb8-v2" "$output/proof/artifact"
          proof=crates/labcolors-core/contracts/point-support-reference-surplus-q55-bps-proof-v1.json
          python3 scripts/verify_point_support_surplus.py --emit > "$RUNNER_TEMP/point-proof.json"
          cp "$RUNNER_TEMP/point-proof.json" "$proof"
          python3 scripts/refresh_clean_set_receipt.py
          python3 scripts/artifact_matrix.py refresh
          cp "$proof" "$output/crates/labcolors-core/contracts/"
          cp crates/labcolors-core/contracts/clean-set-srgb8-v2/receipt-v2.{json,sha256} "$output/crates/labcolors-core/contracts/clean-set-srgb8-v2/"
          cp proof/artifact/{tree,tests}.json "$output/proof/artifact/"
          git rev-parse HEAD > "$output/source-commit.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: native-receipts-${{ github.event.pull_request.head.sha }}
          path: ${{ runner.temp }}/native-receipts
          if-no-files-found: error
          retention-days: 1
