name: CI

# Тонкий caller: триггеры, concurrency и права. Локальный uses выбирает worker
# из того же коммита, что и caller, независимо от checkout и squash-истории.
# Граф заданий проверяется вместе с этим snapshot, а не считается заранее
# одобренным. Задания исполняются на эфемерных GitHub-hosted VM без секретов.

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

# Первый запуск PR делит типизированную pr-группу: новый SHA освобождает раннеры
# от предшественника. Re-run получает собственную run-группу и выполняет полный
# набор проверок, не отменяя новый SHA. Push evidence тоже остаётся exact-run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

# Least privilege: CI only reads the repo.
permissions:
  contents: read

jobs:
  # ИМЯ JOB'А НЕ МЕНЯТЬ БЕЗ ПРАВКИ publish.yml: GitHub публикует job'ы reusable-
  # воркфлоу как «<имя этого job'а> / <имя job'а worker'а>», а publish-гейт сверяет
  # эти имена буквально.
  worker:
    name: CI
    permissions:
      contents: read
    # GitHub загружает локальный reusable workflow из snapshot самого caller'а.
    uses: ./.github/workflows/ci-worker.yml

  transport-distribution-attestation:
    name: transport distribution signed attestations
    if: github.event_name == 'push'
    needs: worker
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: read
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - name: download exact no-rebuild distribution packet
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: transport-distribution-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/transport-distribution
      - name: attest binary build provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/transport-distribution/labcolors-transport
      - name: attest binary SBOM
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: ${{ runner.temp }}/transport-distribution/labcolors-transport
          sbom-path: ${{ runner.temp }}/transport-distribution/transport.sbom.cdx.json
