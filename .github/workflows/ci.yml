name: CI

# Тонкий caller: только триггеры, concurrency и права. Job graph, пины экшенов,
# env-пины тулчейнов и раскладка по раннерам закреплены в immutable ci-worker.yml
# на полном commit SHA — каждый job исполняется на одноразовой эфемерной
# GitHub-hosted VM без секретов и общего состояния. Своих inputs у worker нет by design.

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

# Первый запуск PR делит типизированную pr-группу: новый SHA освобождает раннеры
# от предшественника. Re-run получает собственную run-группу и выполняет полный
# набор проверок, не отменяя новый SHA. Push evidence тоже остаётся exact-run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

# Least privilege: CI only reads the repo.
permissions:
  contents: read

jobs:
  # ИМЯ JOB'А НЕ МЕНЯТЬ БЕЗ ПРАВКИ publish.yml: GitHub публикует job'ы reusable-
  # воркфлоу как «<имя этого job'а> / <имя job'а worker'а>», а publish-гейт сверяет
  # эти имена буквально.
  worker:
    name: CI
    permissions:
      contents: read
    # Caller выбирает revision, который чекаутит worker, включая код PR. Сам код
    # считается недоверенным и исполняется только внутри одноразовой ячейки.
    uses: Labpics-Team/lab-colors/.github/workflows/ci-worker.yml@1beda3770a990bb62d1b97e0188b1f2620e16c07
