name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repo. Override per-job if a job needs more.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  # Deterministic toolchain. Bump in lockstep with the team's supported Rust.
  # To update: pick the new stable from https://forge.rust-lang.org/ and change
  # this single value — every job below consumes it via the `toolchain` input.
  RUST_TOOLCHAIN: 1.96.0
  # Public minimum, tested independently from the development toolchain.
  MSRV_TOOLCHAIN: 1.85.0
  # Pins npm 11.9.0 as part of the official Node distribution. npm tar format
  # is release input, so a floating runner-provided npm is not reproducible.
  NODE_TOOLCHAIN: 24.14.0
  # Минимальный consumer runtime проверяется отдельно от release packer.
  # Node 22 остаётся поддерживаемой upstream LTS-веткой.
  NODE_CONSUMER_FLOOR: 22.11.0
  # Browser parity is release evidence too: pin both CfT archives byte-for-byte.
  CHROME_FOR_TESTING_VERSION: 150.0.7871.115
  CHROME_FOR_TESTING_SHA256: 1be2db033133c5e2dd1a4e8664bf67b19a61bcf6ed28d2b00f433b3f0b4f9585
  CHROMEDRIVER_FOR_TESTING_SHA256: 6ac3919edd107ca13d08cccc118dc83821877e504014233f171bbd94cb01a80e

jobs:
  node-consumer-floor:
    name: Node 22 consumer floor
    runs-on: [self-hosted, Linux, X64]
    needs: wasm
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: ${{ env.NODE_CONSUMER_FLOOR }}
      - name: download exact artifact built by the canonical WASM job
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: colors-release-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/node-floor-artifact
      - name: packed public runtime on declared Node floor
        env:
          ARTIFACT_DIR: ${{ runner.temp }}/node-floor-artifact
        run: |
          mapfile -t tarballs < <(find "$ARTIFACT_DIR" -type f -name '*.tgz' -print)
          test "${#tarballs[@]}" -eq 1
          node scripts/verify-package-release.mjs --runtime-smoke "${tarballs[0]}"

  msrv:
    name: MSRV workspace check
    runs-on: [self-hosted, Linux, X64]
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: toolchain env (runner.temp)
        run: |
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup-$GITHUB_JOB" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$RUNNER_TEMP/cargo-$GITHUB_JOB" >> "$GITHUB_ENV"
          echo "TMPDIR=$RUNNER_TEMP/tmp-$GITHUB_JOB" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/tmp-$GITHUB_JOB"
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master @ 2026-03-27
        with:
          toolchain: ${{ env.MSRV_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: cargo check on declared MSRV
        run: cargo check --workspace --all-targets --locked

  lint:
    name: clippy + rustfmt
    runs-on: [self-hosted, Linux, X64]
    # Защита от fork-PR: НЕ гоняем недоверенный код форков на своей инфре.
    # Форк-PR пропускается (job skipped, раннер не выделяется); push в main
    # и same-repo PR (коллаборатор) — гоняются. Тот же паттерн, что уже принят
    # в native-conformance.yml (PR #194, ветка feat/native-conformance-swift).
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    # Isolate RUSTUP_HOME/CARGO_HOME per job under runner.temp: the runner wipes
    # _work/_temp between jobs, so parallel jobs on shared-HOME runners cannot
    # race each other AND nothing leaks. /tmp is forbidden here: on the de-02
    # farm it is an 8 GB tmpfs, and per-run /tmp toolchains (~600 MB each)
    # filled it in ~12 jobs (ENOSPC cascade, 2026-07-03).
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      # dtolnay/rust-toolchain has no semver tags — pinned by commit SHA.
      # The toolchain VERSION is pinned via the explicit input below, not @stable,
      # so a new stable release cannot silently change CI behavior.
      - name: toolchain env (runner.temp)
        # runner-контекст недоступен в job-level env — только в шагах; поэтому
        # RUSTUP_HOME/CARGO_HOME назначаются здесь через GITHUB_ENV. Смысл тот
        # же: изоляция per job под runner.temp, который раннер вайпит между
        # джобами (класс утечки /tmp закрыт, см. историю #143).
        run: |
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup-$GITHUB_JOB" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$RUNNER_TEMP/cargo-$GITHUB_JOB" >> "$GITHUB_ENV"
          # TMPDIR тоже с tmpfs: staging cargo install (aws-lc-sys ~ГБ) и
          # tempfile-доктесты забивали 8ГБ /tmp до 100% (4КБ свободно, все
          # джобы умирали «abnormal exit»/cc без stderr, 2026-07-03 18:34Z).
          echo "TMPDIR=$RUNNER_TEMP/tmp-$GITHUB_JOB" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/tmp-$GITHUB_JOB"
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master @ 2026-03-27
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: cargo fmt --check
        run: cargo fmt --all --check
      - name: cargo clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

  docs:
    name: cargo doc (intra-doc links)
    runs-on: [self-hosted, Linux, X64]
    # Защита от fork-PR — см. комментарий в job `lint` выше.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: toolchain env (runner.temp)
        # runner-контекст недоступен в job-level env — только в шагах; поэтому
        # RUSTUP_HOME/CARGO_HOME назначаются здесь через GITHUB_ENV. Смысл тот
        # же: изоляция per job под runner.temp, который раннер вайпит между
        # джобами (класс утечки /tmp закрыт, см. историю #143).
        run: |
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup-$GITHUB_JOB" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$RUNNER_TEMP/cargo-$GITHUB_JOB" >> "$GITHUB_ENV"
          # TMPDIR тоже с tmpfs: staging cargo install (aws-lc-sys ~ГБ) и
          # tempfile-доктесты забивали 8ГБ /tmp до 100% (4КБ свободно, все
          # джобы умирали «abnormal exit»/cc без stderr, 2026-07-03 18:34Z).
          echo "TMPDIR=$RUNNER_TEMP/tmp-$GITHUB_JOB" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/tmp-$GITHUB_JOB"
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master @ 2026-03-27
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: cargo doc
        # Intra-doc links are a hard gate: a broken [`link`] in any doc comment
        # (link to a private/renamed/removed item, or bare brackets rustdoc reads
        # as a link) fails the build. RUSTDOCFLAGS="-D warnings" promotes every
        # rustdoc warning — including broken_intra_doc_links — to an error;
        # --no-deps keeps the gate on our own crates only. This stops a stale doc
        # reference from merging silently (main was green with ~81 broken links
        # because cargo doc was never gated — #26).
        run: RUSTDOCFLAGS="-D warnings" cargo doc --workspace --no-deps --locked
      - name: package labcolors-core and run extracted package doctests
        run: |
          set -euo pipefail
          test -L crates/labcolors-core/LICENSE
          test "$(readlink crates/labcolors-core/LICENSE)" = "../../LICENSE"
          cmp LICENSE crates/labcolors-core/LICENSE
          cargo package -p labcolors-core --locked
          crate_version="$(cargo pkgid -p labcolors-core | sed 's/.*#//')"
          package_root="$RUNNER_TEMP/labcolors-core-package-$GITHUB_RUN_ID"
          mkdir "$package_root"
          tar -xzf "target/package/labcolors-core-${crate_version}.crate" -C "$package_root"
          crate_dir="$package_root/labcolors-core-${crate_version}"
          test -f "$crate_dir/README.md"
          test -f "$crate_dir/LICENSE"
          test ! -L "$crate_dir/LICENSE"
          cmp LICENSE "$crate_dir/LICENSE"
          grep -q '^license = "MIT"$' "$crate_dir/Cargo.toml"
          if grep -q '^license-file[[:space:]]*=' "$crate_dir/Cargo.toml"; then
            echo "packaged manifest must not carry both SPDX license and license-file" >&2
            exit 1
          fi
          cargo test --doc --manifest-path "$crate_dir/Cargo.toml" --locked

  test:
    name: test
    runs-on: [self-hosted, Linux, X64]
    # Защита от fork-PR — см. комментарий в job `lint` выше.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
          # Benchmark admission replays the measured implementation commit,
          # which precedes the committed evidence artifact (and a PR merge SHA).
          fetch-depth: 0
      - name: toolchain env (runner.temp)
        # runner-контекст недоступен в job-level env — только в шагах; поэтому
        # RUSTUP_HOME/CARGO_HOME назначаются здесь через GITHUB_ENV. Смысл тот
        # же: изоляция per job под runner.temp, который раннер вайпит между
        # джобами (класс утечки /tmp закрыт, см. историю #143).
        run: |
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup-$GITHUB_JOB" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$RUNNER_TEMP/cargo-$GITHUB_JOB" >> "$GITHUB_ENV"
          # TMPDIR тоже с tmpfs: staging cargo install (aws-lc-sys ~ГБ) и
          # tempfile-доктесты забивали 8ГБ /tmp до 100% (4КБ свободно, все
          # джобы умирали «abnormal exit»/cc без stderr, 2026-07-03 18:34Z).
          echo "TMPDIR=$RUNNER_TEMP/tmp-$GITHUB_JOB" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/tmp-$GITHUB_JOB"
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master @ 2026-03-27
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          # The lint_parity.rs meta-test (run by `cargo test`) shells out to
          # `cargo +1.96.0 fmt --check` and `cargo +1.96.0 clippy`, so this job
          # must provision those components on the SAME pinned toolchain — without
          # them the meta-test panics with "'cargo-clippy'/'cargo-fmt' is not
          # installed for the toolchain '1.96.0'". Kept in lockstep with the lint job.
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: cargo test
        run: cargo test --workspace --locked
      - name: prove core capability projection boundary
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import subprocess

          metadata = json.loads(subprocess.check_output(
              ["cargo", "metadata", "--format-version", "1", "--no-deps"],
              text=True,
          ))
          packages = {package["name"]: package for package in metadata["packages"]}
          core = packages["labcolors-core"]
          if core["features"].get("default") != ["wcag22-feasibility"]:
              raise SystemExit("labcolors-core default capability set drifted")

          protocol_core = [
              dependency
              for dependency in packages["labcolors-protocol"]["dependencies"]
              if dependency["name"] == "labcolors-core" and dependency["kind"] is None
          ]
          if len(protocol_core) != 1:
              raise SystemExit("labcolors-protocol must have one normal labcolors-core edge")
          protocol_core = protocol_core[0]
          if protocol_core["uses_default_features"]:
              raise SystemExit("labcolors-protocol must disable Core default capabilities")
          if protocol_core["features"] != ["wcag22-feasibility"]:
              raise SystemExit(
                  "labcolors-protocol must own exactly wcag22-feasibility, got "
                  f"{protocol_core['features']}"
              )

          for consumer in ["labcolors-wasm", "labcolors-ffi", "labcolors-conformance"]:
              core_dependencies = [
                  dependency
                  for dependency in packages[consumer]["dependencies"]
                  if dependency["name"] == "labcolors-core" and dependency["kind"] is None
              ]
              if len(core_dependencies) != 1:
                  raise SystemExit(f"{consumer} must have one normal labcolors-core edge")
              core_dependency = core_dependencies[0]
              if core_dependency["uses_default_features"]:
                  raise SystemExit(f"{consumer} must disable Core default capabilities")
              if core_dependency["features"]:
                  raise SystemExit(
                      f"{consumer} direct Core edge must own no optional capability, got "
                      f"{core_dependency['features']}"
                  )
              protocol_dependencies = [
                  dependency
                  for dependency in packages[consumer]["dependencies"]
                  if dependency["name"] == "labcolors-protocol" and dependency["kind"] is None
              ]
              if len(protocol_dependencies) != 1:
                  raise SystemExit(f"{consumer} must have one normal labcolors-protocol edge")
          PY

          for consumer in labcolors-wasm labcolors-ffi labcolors-conformance; do
            feature_tree="$(cargo tree -p "$consumer" --edges normal -e features)"
            if ! grep -Fq 'labcolors-core feature "wcag22-feasibility"' <<<"$feature_tree"; then
              echo "$consumer did not resolve protocol-owned wcag22-feasibility" >&2
              exit 1
            fi
          done
          echo "core capability projection: PASS"
      - name: reject WCAG22 source-route redirects and proof vacuums
        run: python3 scripts/test_wcag22_source_binding.py
      - name: prove WCAG22 sRGB8 Q55 artifact over the full finite domain
        run: python3 scripts/verify_wcag22_q55.py
      - name: independently recompute WCAG22 neutral-axis fixtures
        run: python3 scripts/verify_wcag22_neutral_axis.py
      - name: verify WCAG22 feasibility identity byte grammar
        run: python3 scripts/verify_wcag22_feasibility_identity.py
      - name: validate committed WCAG22 feasibility benchmark evidence
        run: |
          artifact="crates/labcolors-core/contracts/wcag22-feasibility-benchmark-v1.json"
          protocol=(
            --admit-revision fea99a1ea4148a5a72423c88220655f7f84213fe
            --admit-rustc-release 1.96.0
            --admit-target-triple aarch64-apple-darwin
            --admit-target-arch aarch64
            --admit-target-os macos
            --admit-pointer-width-bits 64
            --admit-package-version 0.2.0
            --admit-sample-count 5
          )
          python3 scripts/check_wcag22_feasibility_benchmark.py \
            "$artifact" "${protocol[@]}" \
            --artifact-sha256 7e9ffcbdd9d5d50fe681f511c34fc5c5dd270e9c475ce23ae56e9776922a3c5e \
            --self-test
          python3 scripts/check_wcag22_feasibility_applicability.py \
            "$artifact" \
            --artifact-sha256 7e9ffcbdd9d5d50fe681f511c34fc5c5dd270e9c475ce23ae56e9776922a3c5e \
            --self-test

  audit:
    name: cargo audit (rustsec)
    runs-on: [self-hosted, Linux, X64]
    # Защита от fork-PR — см. комментарий в job `lint` выше.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: toolchain env (runner.temp)
        # runner-контекст недоступен в job-level env — только в шагах; поэтому
        # RUSTUP_HOME/CARGO_HOME назначаются здесь через GITHUB_ENV. Смысл тот
        # же: изоляция per job под runner.temp, который раннер вайпит между
        # джобами (класс утечки /tmp закрыт, см. историю #143).
        run: |
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup-$GITHUB_JOB" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$RUNNER_TEMP/cargo-$GITHUB_JOB" >> "$GITHUB_ENV"
          # TMPDIR тоже с tmpfs: staging cargo install (aws-lc-sys ~ГБ) и
          # tempfile-доктесты забивали 8ГБ /tmp до 100% (4КБ свободно, все
          # джобы умирали «abnormal exit»/cc без stderr, 2026-07-03 18:34Z).
          echo "TMPDIR=$RUNNER_TEMP/tmp-$GITHUB_JOB" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/tmp-$GITHUB_JOB"
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master @ 2026-03-27
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: install cargo-audit
        # Version pinned for reproducibility; --locked respects the tool's own lockfile.
        # Must be >=0.22 — older versions cannot parse RUSTSEC entries that use
        # CVSS v4.0 and fail to load the advisory database entirely.
        # $CARGO_HOME/bin → PATH explicitly: with a custom CARGO_HOME the
        # toolchain action does not add it, and standalone `cargo install`
        # binaries become unreachable (`wasm-pack` died with exit 127 on de-02;
        # `cargo audit` only survived by resolving as a cargo subcommand).
        run: |
          cargo install cargo-audit --version 0.22.2 --locked
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      # Hard-fail on actively-exploitable advisories AND on yanked crates.
      # Rationale: a known-vulnerable or yanked dependency is a supply-chain
      # liability we will not knowingly merge. cargo-audit exits non-zero on any
      # advisory; --deny warnings additionally promotes yanked/unmaintained
      # warnings to failures. continue-on-error is intentionally absent (false)
      # so the gate actually blocks. If a finding is a false positive or accepted
      # risk, ignore it explicitly per-advisory via `--ignore RUSTSEC-XXXX-NNNN`
      # with a comment — never by disabling the whole gate.
      - name: cargo audit
        run: cargo audit --deny warnings

  wasm:
    name: wasm build + headless test + size
    runs-on: [self-hosted, Linux, X64]
    # Защита от fork-PR — см. комментарий в job `lint` выше.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      - name: toolchain env (runner.temp)
        # runner-контекст недоступен в job-level env — только в шагах; поэтому
        # RUSTUP_HOME/CARGO_HOME назначаются здесь через GITHUB_ENV. Смысл тот
        # же: изоляция per job под runner.temp, который раннер вайпит между
        # джобами (класс утечки /tmp закрыт, см. историю #143).
        run: |
          echo "RUSTUP_HOME=$RUNNER_TEMP/rustup-$GITHUB_JOB" >> "$GITHUB_ENV"
          echo "CARGO_HOME=$RUNNER_TEMP/cargo-$GITHUB_JOB" >> "$GITHUB_ENV"
          echo "WASM_PACK_CACHE=$RUNNER_TEMP/wasm-pack-$GITHUB_JOB" >> "$GITHUB_ENV"
          # TMPDIR тоже с tmpfs: staging cargo install (aws-lc-sys ~ГБ) и
          # tempfile-доктесты забивали 8ГБ /tmp до 100% (4КБ свободно, все
          # джобы умирали «abnormal exit»/cc без stderr, 2026-07-03 18:34Z).
          echo "TMPDIR=$RUNNER_TEMP/tmp-$GITHUB_JOB" >> "$GITHUB_ENV"
          mkdir -p "$RUNNER_TEMP/tmp-$GITHUB_JOB" "$RUNNER_TEMP/wasm-pack-$GITHUB_JOB"
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9 # master @ 2026-03-27
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          # The WASM compile target; the bindings are built and tested against it.
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
      - name: install wasm-pack
        # Pinned for reproducibility; --locked respects the tool's own lockfile.
        # wasm-pack vendors a matching wasm-opt and downloads a matching
        # chromedriver for the headless run below.
        # $CARGO_HOME/bin → PATH explicitly: with a custom CARGO_HOME the
        # toolchain action does not add it, so the installed `wasm-pack` binary
        # was unreachable (exit 127 "command not found" on the de-02 farm).
        run: |
          cargo install wasm-pack --version 0.13.1 --locked
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
      - name: wasm-pack build (release)
        # The release bundle: panic=abort, no panic hook, wasm-opt -Oz. This is
        # the artifact @labpics/colors ships, so the size measured below is real.
        # Rust error locations otherwise embed the self-hosted runner's mutable
        # workspace/CARGO_HOME roots and make identical source hash differently.
        run: |
          export CARGO_ENCODED_RUSTFLAGS="--remap-path-prefix=$GITHUB_WORKSPACE=/workspace/lab-colors"$'\x1f'"--remap-path-prefix=$CARGO_HOME=/cargo-home"
          wasm-pack build crates/labcolors-wasm --release --target web --out-dir ../../packages/colors/pkg --out-name labcolors --locked
      - uses: actions/setup-node@2028fbc5c25fe9cf00d9f06a71cc4710d4507903 # v6.0.0
        with:
          node-version: ${{ env.NODE_TOOLCHAIN }}
          cache: npm
          cache-dependency-path: packages/colors/package-lock.json
      - name: "record #295 canonical whole-call WASM boundary candidate"
        # First-pass evidence intentionally precedes the immutable #284 size
        # gate: the new capability changes bytes, and the exact Linux x64
        # observation must remain retrievable even while that old gate is RED.
        # --record also prints the canonical JSON to logs and refuses overwrite
        # or a non-canonical host. Once reviewed and committed, switch to
        # --verify; latency/maxRSS/pages remain observations only.
        working-directory: packages/colors
        run: >-
          node bench/wcag22-feasibility-boundary.bench.mjs
          --record "$RUNNER_TEMP/wcag22-feasibility-wasm-boundary-v1.json"
      - name: "upload exact #295 whole-call candidate before expected size RED"
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wcag22-feasibility-wasm-boundary-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: ${{ runner.temp }}/wcag22-feasibility-wasm-boundary-v1.json
          if-no-files-found: error
          retention-days: 30
      - name: enforce measured WASM raw-byte budget
        # Issue #284 owns the immutable measured ceiling baseline. The checker
        # separately binds this current Linux x64 artifact's exact SHA-256 and
        # rejects growth above that ceiling. gzip is transport diagnostics only.
        run: node scripts/check-wasm-size-budget.mjs
      - name: "@labpics/colors: typecheck + runtime tests"
        # Now that pkg/ exists (built above), the package's public types resolve
        # against the *real* wasm-bindgen declarations — so the type-level smoke
        # and the DOM-runtime helpers (applyTheme / watchTheme / effective-bg) are
        # actually gated, not just the Rust core. node --test covers the pure
        # runtime logic without a browser (the headless parity test below covers
        # the wasm boundary).
        working-directory: packages/colors
        run: |
          npm ci
          npm run typecheck
          npm test
      - name: verify byte-exact npm release artifact
        id: verified-release
        working-directory: packages/colors
        run: npm run release:verify
      # Upload the already verified release input before the pinned browser
      # dependency is fetched. A Chrome outage therefore cannot destroy the
      # evidence, while this `wasm` job still has to finish successfully before
      # publish.yml will accept its canonical workflow run.
      - name: upload verified npm tarball and manifest
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: colors-release-${{ github.sha }}-attempt-${{ github.run_attempt }}
          path: |
            ${{ steps.verified-release.outputs.tarball }}
            ${{ steps.verified-release.outputs.manifest }}
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 90
      - name: install Chrome + dependencies (Chrome for Testing + apt-get download)
        # Self-hosted WSL runners lack Chrome and passwordless sudo.
        # Strategy:
        #  1. Download exact CfT chrome + chromedriver archives and verify SHA-256.
        #     wasm-pack reads CHROME_PATH for the browser but ignores a CHROMEDRIVER
        #     variable, so the matching driver is passed through --chromedriver.
        #  2. Extract required shared libs (.so) from the runner's configured
        #     Debian/Ubuntu repository without sudo. Refresh package metadata in
        #     runner.temp first: shared self-hosted images can retain stale lists
        #     whose package URLs already return 404. `apt-get download` fetches
        #     .deb and `dpkg --extract` unpacks it without root.
        #     Chrome/chromedriver need libnspr4, libnss3, libasound2t64, libgbm1
        #     which are absent on the slim WSL runner image.
        #  3. Diagnose chromedriver session creation (Chrome's stderr) before wasm-pack.
        run: |
          set -euo pipefail
          # -- CfT chrome + chromedriver --
          BASE_URL="https://storage.googleapis.com/chrome-for-testing-public/${CHROME_FOR_TESTING_VERSION}/linux64"
          CHROME_ROOT="$RUNNER_TEMP/chrome-$GITHUB_JOB"
          mkdir -p "$CHROME_ROOT"
          curl --fail-with-body --silent --show-error --location \
            "${BASE_URL}/chrome-linux64.zip" -o "$CHROME_ROOT/chrome-linux64.zip"
          curl --fail-with-body --silent --show-error --location \
            "${BASE_URL}/chromedriver-linux64.zip" -o "$CHROME_ROOT/chromedriver-linux64.zip"
          printf '%s  %s\n' "$CHROME_FOR_TESTING_SHA256" "$CHROME_ROOT/chrome-linux64.zip" \
            | sha256sum --check --strict
          printf '%s  %s\n' "$CHROMEDRIVER_FOR_TESTING_SHA256" "$CHROME_ROOT/chromedriver-linux64.zip" \
            | sha256sum --check --strict
          unzip -q -o "$CHROME_ROOT/chrome-linux64.zip" -d "$CHROME_ROOT"
          unzip -q -o "$CHROME_ROOT/chromedriver-linux64.zip" -d "$CHROME_ROOT"
          CHROME_BIN="$CHROME_ROOT/chrome-linux64/chrome"
          CHROMEDRIVER_BIN="$CHROME_ROOT/chromedriver-linux64/chromedriver"
          chmod +x "$CHROME_BIN" "$CHROMEDRIVER_BIN"
          echo "CHROME_PATH=$CHROME_BIN" >> "$GITHUB_ENV"
          echo "CHROMEDRIVER_PATH=$CHROMEDRIVER_BIN" >> "$GITHUB_ENV"
          echo "Chrome for Testing $CHROME_FOR_TESTING_VERSION installed"

          # -- Extract Chrome shared-lib dependencies from distro .deb (no sudo needed) --
          DEPS_DIR="$RUNNER_TEMP/chrome-deps-$GITHUB_JOB"
          DEBS_DIR="$DEPS_DIR/debs"
          APT_LISTS="$DEPS_DIR/apt-lists"
          APT_CACHE="$DEPS_DIR/apt-cache"
          mkdir -p "$DEBS_DIR" "$APT_LISTS/partial" "$APT_CACHE/archives/partial"
          # Keep every mutable APT path job-local and disable global locks. The
          # system sources/keyrings and dpkg status remain read-only inputs.
          APT_OPTIONS=(
            -o "Dir::State::lists=$APT_LISTS"
            -o "Dir::State::status=/var/lib/dpkg/status"
            -o "Dir::Cache=$APT_CACHE"
            -o "Dir::Cache::archives=$APT_CACHE/archives"
            -o "Debug::NoLocking=1"
            -o "Acquire::Retries=3"
          )
          apt-get "${APT_OPTIONS[@]}" update
          # libnspr4/libnss3: NSS/NSPR crypto deps for Chrome and chromedriver.
          # libasound2t64: ALSA after the current Debian/Ubuntu time64 transition.
          # libgbm1: GPU buffer manager (needed by Chrome headless for DRM/render node).
          (cd "$DEBS_DIR" && apt-get "${APT_OPTIONS[@]}" download libnspr4 libnss3 libasound2t64 libgbm1 2>&1)
          for deb in "$DEBS_DIR"/*.deb; do
            dpkg --extract "$deb" "$DEPS_DIR"
          done
          DEPS_LIB="$(find "$DEPS_DIR/usr/lib" -maxdepth 2 -type d | tr '\n' ':' | sed 's/:$//')"
          echo "LD_LIBRARY_PATH=${DEPS_LIB}:${LD_LIBRARY_PATH:-}" >> "$GITHUB_ENV"
          echo "Chrome deps: $DEPS_LIB"
          LD_LIBRARY_PATH="${DEPS_LIB}:${LD_LIBRARY_PATH:-}" "$CHROME_BIN" --version || true

          # -- Make Chrome discoverable by chromedriver without explicit binary path --
          # chromedriver searches PATH for: google-chrome, google-chrome-stable, chromium
          # When CHROME_PATH/binary is not passed by wasm-bindgen-test-runner, chromedriver
          # needs to find Chrome in PATH. Add an isolated runner.temp bin directory
          # with Chrome aliases; wasm-pack receives the driver path explicitly.
          CHROME_BIN_DIR="$RUNNER_TEMP/chrome-bin-$GITHUB_JOB"
          mkdir -p "$CHROME_BIN_DIR"
          ln -sf "$CHROME_BIN" "$CHROME_BIN_DIR/google-chrome"
          ln -sf "$CHROME_BIN" "$CHROME_BIN_DIR/google-chrome-stable"
          # Use GITHUB_PATH (step-scoped prepend) rather than PATH in GITHUB_ENV
          # (which leaks the full expanded PATH across jobs on shared self-hosted runners).
          echo "$CHROME_BIN_DIR" >> "$GITHUB_PATH"
          echo "Linked CfT Chrome under runner.temp"

          # -- Diagnose: verify chromedriver can start a Chrome session (surfaces Chrome stderr) --
          # Note: LD_LIBRARY_PATH in $GITHUB_ENV is not active in this step yet;
          # must pass DEPS_LIB inline here.
          echo "--- chromedriver session diagnostic ---"
          LD_LIBRARY_PATH="${DEPS_LIB}:${LD_LIBRARY_PATH:-}" "$CHROMEDRIVER_BIN" --port=9515 --log-level=ALL 2>&1 &
          CD_PID=$!
          sleep 1
          RESP=$(curl -s --max-time 10 -X POST http://localhost:9515/session \
            -H "Content-Type: application/json" \
            -d '{
              "capabilities": {
                "alwaysMatch": {
                  "browserName": "chrome",
                  "goog:chromeOptions": {
                    "binary": "'"$CHROME_BIN"'",
                    "args": [
                      "--no-sandbox",
                      "--disable-setuid-sandbox",
                      "--disable-dev-shm-usage",
                      "--disable-gpu",
                      "--disable-software-rasterizer"
                    ]
                  }
                }
              }
            }' 2>&1)
          echo "Session response (first 300 chars):"
          echo "$RESP" | head -c 300
          # Clean up session if it was created
          SESSION_ID=$(echo "$RESP" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{try{const j=JSON.parse(d);console.log(j.value&&j.value.sessionId||'');}catch(e){}});" 2>/dev/null || true)
          if [ -n "$SESSION_ID" ]; then
            curl -s -X DELETE "http://localhost:9515/session/$SESSION_ID" || true
            echo "Session created+deleted successfully! Chrome works via chromedriver."
          else
            echo "Session creation failed — see error above"
          fi
          kill $CD_PID 2>/dev/null || true
          wait $CD_PID 2>/dev/null || true
          echo "--- end diagnostic ---"
          true # diagnostic is informational only — never fail the install step
      - name: wasm-pack test (headless chrome)
        # Chrome is provisioned above; the parity smoke runs against native
        # resolve_set inside the same wasm runtime. D1 default from the chapter.
        run: wasm-pack test --headless --chrome --chromedriver "$CHROMEDRIVER_PATH" crates/labcolors-wasm --locked
  docs-drift:
    name: docs-drift (нейминг-канон)
    runs-on: [self-hosted, Linux, X64]
    # Защита от fork-PR — см. комментарий в job `lint` выше.
    if: >-
      github.event_name != 'pull_request' ||
      github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false
      # Гейт «доки == реальность» (порт эталона labui#150 / lab-icons#53 /
      # lab-motion): docs/NAMING.md сверяется с фактами ФС. Node уже стоит на
      # self-hosted раннерах; точная версия npm здесь не release input, потому
      # setup-node не нужен. Rust-тулчейн тоже не нужен — гейт читает только ФС,
      # поэтому джоба лёгкая и не трогает изоляцию остальных джоб.
      - name: юниты гейта
        run: node --test scripts/docs-drift.test.mjs
      - name: check-docs-drift (docs/NAMING.md == факты ФС)
        run: node scripts/check-docs-drift.mjs
