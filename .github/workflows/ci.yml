name: CI

# Оба immutable worker исполняются в одном запуске. Обязательный CI принимает
# только успех обеих ветвей; API-поиск соседнего запуска ему не нужен.

on:
  push:
    branches: [main]
  pull_request:
  merge_group:

# Первый запуск PR делит типизированную pr-группу: новый SHA освобождает раннеры
# от предшественника. Re-run получает собственную run-группу и выполняет полный
# набор проверок, не отменяя новый SHA. Push evidence тоже остаётся exact-run.
concurrency:
  group: ci-${{ github.event_name == 'pull_request' && github.run_attempt == 1 && format('pr-{0}', github.event.pull_request.number) || format('run-{0}', github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' && github.run_attempt == 1 }}

# Проверки читают репозиторий без секретов и прав записи.
permissions:
  contents: read

jobs:
  worker:
    name: CI
    permissions:
      contents: read
    uses: Labpics-Team/lab-colors/.github/workflows/ci-worker.yml@f65c3717ede52341c160d5dd56b6c3b65c8c8fed
  native:
    name: Native conformance (Swift)
    permissions:
      contents: read
    uses: Labpics-Team/lab-colors/.github/workflows/native-conformance-worker.yml@1beda3770a990bb62d1b97e0188b1f2620e16c07
  ci:
    name: CI
    if: ${{ always() }}
    needs: [worker, native]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions: {}
    steps:
      - name: Require every native verification branch
        shell: bash
        env:
          RESULTS: ${{ join(needs.*.result, ',') }}
        run: |
          set -euo pipefail
          [[ "$RESULTS" == "success,success" ]]
