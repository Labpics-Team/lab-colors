name: Source Snapshot Temporary

on:
  push:
    branches: [r12/fv-01-attached-materialization-authority]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Seal exact source snapshot
        shell: bash
        run: |
          set -euo pipefail
          git rev-parse HEAD > SOURCE_SHA
          tar --exclude=.git --exclude=source-snapshot.tgz -czf source-snapshot.tgz .
      - name: Upload exact source snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: source-snapshot-${{ github.sha }}
          path: source-snapshot.tgz
          if-no-files-found: error
          retention-days: 1
