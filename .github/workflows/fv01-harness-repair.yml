name: FV-01 harness contract repair

on:
  push:
    branches:
      - r12/fv-01-attached-materialization-authority

permissions:
  contents: write

jobs:
  repair:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          ref: r12/fv-01-attached-materialization-authority
          fetch-depth: 2
      - uses: dtolnay/rust-toolchain@3c5f7ea28cd621ae0bf5283f0e981fb97b8a7af9
        with:
          toolchain: 1.96.0
      - name: Repair serialized browser harness admission
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('packages/colors/test/program-runtime-browser-harness.test.mjs')
          source = path.read_text()
          old = '''      attach(_streamId, _bindings, host) {
                const epoch = ++nextEpoch;
          '''
          new = '''      attach(_streamId, bindings, host) {
                for (const key of [
                  "emissionOutputs",
                  "emissionSinkOutputs",
                  "presentationOutputs",
                  "presentationRoots",
                  "presentationOccurrences",
                ]) {
                  let value;
                  try { value = bindings[key]; }
                  catch { throw typedError("attached_invalid_bindings", "attachAttachedProgram"); }
                  if (!(value instanceof Uint32Array) || value.length !== 1) {
                    throw typedError("attached_invalid_bindings", "attachAttachedProgram");
                  }
                }
                const epoch = ++nextEpoch;
          '''
          if source.count(old) != 1:
              raise SystemExit(f'guard failed: expected one mock attach seam, found {source.count(old)}')
          path.write_text(source.replace(old, new, 1))
          PY
          node --check packages/colors/test/program-runtime-browser-harness.test.mjs
          git diff --check
      - name: Prove package runtime contract
        shell: bash
        working-directory: packages/colors
        run: |
          set -euo pipefail
          npm ci
          npm run typecheck
          npm test
      - name: Refresh canonical exact-tree evidence
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/fv01-harness-repair.yml
          python3 scripts/artifact_matrix.py refresh
          python3 scripts/artifact_matrix.py check
          python3 scripts/verify_clean_set_receipt.py product --product-root "$PWD"
          git diff --check
      - name: Commit repaired FV-01 tree
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git diff --cached --check
          git commit -m "test(fv-01): align browser harness with binding admission"
          git push origin HEAD:r12/fv-01-attached-materialization-authority
