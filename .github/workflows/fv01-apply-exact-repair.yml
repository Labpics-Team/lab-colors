name: FV01 Apply Exact Repair

on:
  push:
    branches: [r12/fv-01-attached-materialization-authority]
    paths:
      - .github/fv01-repair/**
      - .github/workflows/fv01-apply-exact-repair.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Verify and apply exact-head repair
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = "4c600ce9e395b3c92df3edfcf84dc0094e7b84fa"
          cat .github/fv01-repair/part-*.patch > "$RUNNER_TEMP/fv01.patch"
          printf '%s  %s\n' '372d5de8cf6e87a722c9d712846cb3485814da4da286f6a18aa6fe572bd6b608' "$RUNNER_TEMP/fv01.patch" | sha256sum -c -
          git apply --check "$RUNNER_TEMP/fv01.patch"
          git apply "$RUNNER_TEMP/fv01.patch"
          rm -rf .github/fv01-repair .github/workflows/fv01-apply-exact-repair.yml
          git diff --check
          git add -A
          git diff --cached --check
          git config user.name 'lab-colors repair bot'
          git config user.email 'actions@users.noreply.github.com'
          git commit -m 'fix(fv-01): seal atomic materialization transaction'
          git push origin HEAD:r12/fv-01-attached-materialization-authority
