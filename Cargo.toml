[workspace]
members = ["crates/*"]
resolver = "2"

[workspace.package]
version = "0.5.0"
edition = "2024"
authors = ["Lab Pics <dev@lab.pics>"]
license = "MIT"
repository = "https://github.com/Labpics-Team/lab-colors"
rust-version = "1.85"

# Centralised dependency pins. `labcolors-core` stays zero-RUNTIME-deps (issue #29):
# only the runtime WASM edge crate uses this wasm-bindgen pin.
# `proptest` is a DEV-only dependency of `labcolors-core`; the CI metadata gate
# rejects any normal dependency edge from Core, including target-specific ones.
[workspace.dependencies]
wasm-bindgen = "0.2"
proptest = "1"

# RUSTSEC-2026-0374: upstream заменил basic-toml на поддерживаемый toml.
# Внутренние path-зависимости сохраняют семейство Askama на одной ревизии.
[patch.crates-io]
askama = { git = "https://github.com/askama-rs/askama", rev = "3863808cf594054f7644979ed92caaafc878f378" }

# Release оптимизирует выполнение общего compiler/runtime пути. Размер WASM
# отдельно сокращает закреплённый Binaryen -Oz и ограничивает измеренный budget.
# Выбор opt-level проверяется полным compile/update/readout циклом, включая
# холодный запуск и память, а не одной численной операцией.
[profile.release]
opt-level = 2
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true

