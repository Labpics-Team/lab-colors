[workspace]
# Калибровочные харнессы перечислены ПОИМЁННО, не глобом: в experiments/ живут и
# не-Rust эксперименты (experiments/comparative — Node/JS, #163), а глоб
# `experiments/*` роняет `cargo metadata` на членах без Cargo.toml.
# Rust-харнессы (напр. experiments/psychophysics для мишени #1 empirical-residue) —
# зависимость-нулевые члены воркспейса: попадают под те же гейты CI
# (fmt/clippy/test/doc/audit --workspace), не расширяя граф зависимостей.
members = ["crates/*", "experiments/psychophysics"]
resolver = "2"

[workspace.package]
version = "0.2.0"
edition = "2024"
authors = ["Lab Pics <dev@lab.pics>"]
license = "MIT"
repository = "https://github.com/Labpics-Team/lab-colors"
rust-version = "1.85"

# Centralised dependency pins. `labcolors-core` stays zero-RUNTIME-deps (issue #29):
# only the runtime and offline-compiler WASM edge crates use this wasm-bindgen pin.
# `proptest` is a DEV-only dependency of `labcolors-core` (property/fuzz invariants);
# it never enters the runtime graph — proven by the supply-chain guards in
# `tests/s2b_baseline_guards.rs` (`supply_chain_proptest_*`).
[workspace.dependencies]
wasm-bindgen = "0.2"
proptest = "1"

# Release profile tuned for a small WASM bundle. `opt-level = "z"` and LTO trade
# a little speed for size; `panic = "abort"` removes the unwinding tables and
# the formatting machinery a panic would pull in — there are no panic pages in
# release, errors are returned as structured values (see the wasm crate). This
# applies to every crate, but only the WASM bundle is size-sensitive; the native
# crates are unaffected in any way that matters.
[profile.release]
opt-level = "z"
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
