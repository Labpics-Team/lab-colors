# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
language: "ru-RU"
early_access: false
reviews:
  profile: "assertive"
  request_changes_workflow: true
  high_level_summary: true
  poem: false
  review_status: true
  collapse_walkthrough: false
  auto_review:
    enabled: true
    drafts: false
    base_branches:
      - "main"
      - "master"
  path_instructions:
    - path: "crates/labcolors-core/**/*.rs"
      instructions: |
        Сверяй изменения с AGENTS.md и docs/explanation/color-quality.md. Ядро сохраняет характер и согласованность объявленной цветовой системы при смене контекста.
        Проверяй:
        - Конечную композицию, локальные применения, прозрачность и фиксированные источники; имена ролей и клиентская топология не выбирают формулу Core.
        - Cleanliness как самостоятельную обязательную способность: контраст, геометрия identity и nominal-профиль не заменяют её; unknown и incomparable не означают NotDirtier.
        - Самостоятельный смысл ограничений, предпочтений, допустимости и полноты поиска; недоступный или прежний результат не выдаётся за текущий.
        - Численную корректность и область применимости фактически используемых моделей, происхождение коэффициентов, точность композиции и типизированные отказы.
        - Стоимость полного пути до полезного результата, повторные вычисления и выделения памяти.
    - path: "docs/**"
      instructions: |
        Сверяй документацию с AGENTS.md, docs/explanation/color-quality.md и фактическим публичным API.
        Проверяй:
        - Ясный русский текст и назначение документа: README — первый полезный сценарий, how-to — действия, reference — контракт, explanation — причины.
        - Положительную видимость Cleanliness, работающих композиционных сценариев и исследовательской базы; ограничения модели не отменяют цель продукта.
        - Точность состояний, единиц, областей моделей и статусов исследований; retired-план не отменяет действующее требование.
        - Доступные ссылки на первоисточники и актуальность примеров и схем относительно реализации.
  tools:
    shellcheck:
      enabled: true
    markdownlint:
      enabled: true
    github-checks:
      enabled: true
      annotations: true
  abort_on_close: true
chat:
  auto_reply: true
