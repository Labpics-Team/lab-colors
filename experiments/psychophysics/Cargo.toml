[package]
name = "psychophysics"
description = "Психофизический харнесс для калибровки перцептивных констант lab-colors (мишень #1: PAIR_CROSSOVER_Y)."
publish = false
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Zero runtime dependencies — по конституции репо (issue #29). Генератор стимулов,
# логистическая MLE, bootstrap и минимальный JSON написаны руками на `std`, поэтому
# крейт не расширяет граф зависимостей и `cargo audit` остаётся зелёным.
[dependencies]

[dev-dependencies]

[[bin]]
name = "psychophysics"
path = "src/main.rs"
