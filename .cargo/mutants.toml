# cargo-mutants — выбранный correctness-срез для scheduled mutation evidence.
#
# Запуск по расписанию разбивает ровно одну обнаруженную популяцию на 32
# round-robin shard. Report-only PR1 доказывает полноту измерения, но ещё не
# превращает первый фактический результат в quality threshold.
#
# Список является явным выбранным срезом, а не «полным workspace». Расширение
# скоупа меняет discovered-population digest и потому не может пройти незаметно.
# Exact family certificate/membership входит в тот же выбранный correctness-срез;
# это не отдельный запуск и не обещание покрытия всего workspace.
examine_globs = [
    "crates/labcolors-core/src/alpha.rs",
    "crates/labcolors-core/src/point_representation.rs",
    "crates/labcolors-core/src/appearance.rs",
    "crates/labcolors-core/src/composition.rs",
    "crates/labcolors-core/src/constraints/mod.rs",
    "crates/labcolors-core/src/constraints/exact.rs",
    "crates/labcolors-core/src/constraints/family.rs",
    "crates/labcolors-core/src/family.rs",
    "crates/labcolors-core/src/family_artifact.rs",
    "crates/labcolors-core/src/family_artifact/raw_bitmap24.rs",
    "crates/labcolors-core/src/glow.rs",
    "crates/labcolors-core/src/material.rs",
    "crates/labcolors-core/src/numerical_plan.rs",
    "crates/labcolors-core/src/numerics.rs",
    "crates/labcolors-core/src/observation.rs",
    "crates/labcolors-core/src/point_support.rs",
    "crates/labcolors-core/src/program_identity.rs",
    "crates/labcolors-core/src/srgb8.rs",
    "crates/labcolors-core/src/wcag22.rs",
    "crates/labcolors-core/src/wcag22_evidence.rs",
    "crates/labcolors-core/src/wcag22/kernel.rs",
]

# Timeout выводится из baseline полного детерминированного core-набора; multiplier
# и минимальный пол отделяют реальные зависания мутантов от штатного времени тестов.
timeout_multiplier = 3.0
minimum_test_timeout = 60
