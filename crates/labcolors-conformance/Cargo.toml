[package]
name = "labcolors-conformance"
publish = false
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Платформо-нейтральный conformance-пак движка labcolors: детерминированные тест-векторы канона (лестницы, подложка→α, контрасты, резолв) плюс Rust-раннер-референс. Любой биндинг (WASM, Swift, …) обязан их воспроизвести."

[dependencies]
# Численные семейства ДЕРИВИРУЮТСЯ из public Core API; versioned transport
# family — из общего public protocol API. Канонические значения и wire algebra
# не вписываются руками: генератор остаётся тенью двух своих authority.
labcolors-core = { path = "../labcolors-core", default-features = false }
# Request construction, byte preflight and wire algebra stay in one protocol
# authority shared with both adapters. This crate only records its canonical
# request/outcome bytes; it does not mirror transport DTOs.
labcolors-protocol = { path = "../labcolors-protocol" }
# serde/serde_json УЖЕ в дереве воркспейса (граница конфига WASM). Переиспользуем
# тот же пин — ноль новой supply-chain-поверхности для `cargo audit`.
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# `gen` пишет закоммиченные векторы; раннер-референс (tests/) их и математику ядра
# сверяет. Оба под воркспейс-гейтами CI (fmt/clippy/test/doc/audit), граф
# зависимостей ядра не расширяют (ядро не зависит от этого крейта).
