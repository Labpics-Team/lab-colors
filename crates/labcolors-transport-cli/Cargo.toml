[package]
name = "labcolors-transport-cli"
description = "Bounded parse/serialize/inspect CLI for the Lab Colors certificate transport envelope."
publish = false
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[[bin]]
name = "labcolors-transport"
path = "src/main.rs"

[dependencies]
labcolors-core = { path = "../labcolors-core", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
