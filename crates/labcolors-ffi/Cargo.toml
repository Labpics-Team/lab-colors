[package]
name = "labcolors-ffi"
publish = false
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Native UniFFI boundary over labcolors-core with a generated Swift surface and explicit-profile Glow point decisions."

[lib]
# Имя lib-артефакта (без префикса пакета): даёт `liblabcolors.{a,dylib}` и
# чистый UniFFI-namespace `labcolors` (setup_scaffolding! по имени крейта) →
# генерённые `labcolors.swift` / `labcolorsFFI.h`, а не `labcolors_ffi*`.
name = "labcolors"
# staticlib — линкуется в Swift (.a, без рантайм-поиска dylib при `swift test`);
# cdylib — из него uniffi-bindgen генерит биндинги в library-mode (поддерживает
# proc-macro); lib — держит крейт нативно тестируемым `cargo test`.
crate-type = ["staticlib", "cdylib", "lib"]

# Бинарь генерации биндингов. `uniffi_bindgen_main` доступен только при фиче
# `uniffi/cli`, поэтому bin собирается лишь с `--features=uniffi/cli` на момент
# генерации — clap НЕ попадает в постоянный cdylib.
[[bin]]
name = "uniffi-bindgen"
path = "src/bin/uniffi_bindgen.rs"

[dependencies]
labcolors-core = { path = "../labcolors-core", default-features = false }
# #296-C3: UniFFI-роль публикует обе offline-операции; explicit-selection
# включается той же non-default protocol-фичей, что и в compiler-роли.
labcolors-protocol = { path = "../labcolors-protocol", features = ["wcag22-explicit-selection"] }
# Нативная FFI-обвязка. Библиотечная зависимость БЕЗ фичи cli (иначе clap течёт
# в артефакт); cli включается только через passthrough-фичу ниже на генерации.
uniffi = { version = "0.32", default-features = false }
# Derive-only proc-macro: даёт `ColorError` реализацию `std::error::Error`
# (требование `uniffi::Error`) без рантайм-кода. thiserror УЖЕ в дереве (wasm).
thiserror = "2"

[features]
# Passthrough к `uniffi/cli`: включает CLI-бинарь `uniffi-bindgen` (тянет clap).
# ВЫКЛ по умолчанию, поэтому воркспейс-гейты CI (build/clippy/test --workspace)
# собирают bin как заглушку и НЕ тянут clap. Генерация биндингов включает её:
# `cargo run -p labcolors-ffi --features cli --bin uniffi-bindgen -- generate …`.
cli = ["uniffi/cli"]
