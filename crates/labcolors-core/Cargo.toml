[package]
name = "labcolors-core"
description = "Dependency-free core compiler and runtime resolver for client-owned color-token contracts."
readme = "README.md"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]

[features]
# Direct core consumers receive the stable default capability set. A transport
# adapter may disable defaults and then enable only capabilities it projects.
default = ["wcag22-feasibility", "wcag22-explicit-feasibility"]
wcag22-feasibility = []
wcag22-explicit-feasibility = ["wcag22-feasibility"]

[dev-dependencies]
pretty_assertions = "1.4"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
# Dev-only serialisation for the tree-mutating on-disk audit probe (#[serial]).
# Zero runtime deps: serial_test never appears in the normal dependency graph
# (verified by s2b_baseline_guards::supply_chain_serial_test_absent_from_normal_dep_tree).
serial_test = "3"
# Dev-only temp directory for isolation-safe on-disk probe: the real tree is never mutated.
# Zero runtime deps (verified by s2b_baseline_guards supply-chain test).
tempfile = "3.10"
# Dev-only property/fuzz engine for the mathematical-invariant tests
# (tests/property_invariants.rs). Zero runtime deps: proptest never appears in the
# normal dependency graph (verified by s2b_baseline_guards::supply_chain_proptest_*).
# Pin centralised in the workspace Cargo.toml (issue #29 dependency discipline).
proptest = { workspace = true }

[[bench]]
name = "y_hk"
harness = false

[[bench]]
name = "jp_inv"
harness = false

[[bench]]
name = "neutral_at"
harness = false

[[bench]]
name = "forward"
harness = false

[[bench]]
name = "glow_alpha"
harness = false

[[bench]]
name = "wcag22_feasibility_admission"
harness = false
required-features = ["wcag22-feasibility"]

[[test]]
name = "wcag22_feasibility"
required-features = ["wcag22-feasibility"]

[[test]]
name = "wcag22_explicit_feasibility"
required-features = ["wcag22-explicit-feasibility"]

[[test]]
name = "wcag22_explicit_selection"
required-features = ["wcag22-explicit-feasibility"]

[[test]]
name = "wcag22_explicit_selection_alloc"
required-features = ["wcag22-explicit-feasibility"]
