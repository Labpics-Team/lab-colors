[package]
name = "labcolors-core"
description = "Dependency-free core compiler and runtime resolver for client-owned color-token contracts."
readme = "README.md"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]

[features]
# Direct core consumers receive the stable default capability set. A transport
# adapter may disable defaults and then enable only capabilities it projects.
default = []

[dev-dependencies]
pretty_assertions = "1.4"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
# Isolated on-disk scanner mutation proof; the real tree is never mutated.
tempfile = "3.10"
# Property/fuzz engine for mathematical invariants; pin is workspace-owned.
proptest = { workspace = true }

[[bench]]
name = "jp_inv"
harness = false

[[bench]]
name = "neutral_at"
harness = false

[[bench]]
name = "forward"
harness = false

[[bench]]
name = "glow_alpha"
harness = false
