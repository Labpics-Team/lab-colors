[package]
name = "labcolors-core"
description = "Dependency-free core compiler and runtime resolver for client-owned color-token contracts."
readme = "README.md"
version.workspace = true
edition.workspace = true
authors.workspace = true
license = "MIT AND CC-BY-4.0 AND CC-BY-SA-4.0"
repository.workspace = true
rust-version.workspace = true

[dependencies]

[features]
# Direct core consumers receive the stable default capability set. A transport
# adapter may disable defaults and then enable only capabilities it projects.
default = []
# Один закрытый package-private consumer исполняет staged Program, не превращая
# Program во второй публичный authoring root. Публичный runtime feature не включает.
private-fixture = []

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(labcolors_private_fixture_unshared_v1)'] }

[dev-dependencies]
pretty_assertions = "1.4"
criterion = { version = "0.5", default-features = false, features = ["cargo_bench_support"] }
# Property/fuzz engine for mathematical invariants; pin is workspace-owned.
proptest = { workspace = true }

[[bench]]
name = "jp_inv"
harness = false

[[bench]]
name = "neutral_at"
harness = false

[[bench]]
name = "forward"
harness = false
