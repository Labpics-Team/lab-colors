[package]
name = "labcolors-audit"
description = "AUD-01 scanner: 3-stage pipeline (enumerate в†’ dispose в†’ gate) for production artifact conformance auditing."
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
labcolors-core = { path = "../labcolors-core" }
serde = { version = "1", features = ["derive"] }
quote = "1"
serde_json = "1"
sha2 = "0.10"
syn = { version = "2", features = ["full", "parsing"] }
walkdir = "2"

[[bin]]
name = "scanner"
path = "src/bin/scanner.rs"

[dev-dependencies]
pretty_assertions = "1.4"