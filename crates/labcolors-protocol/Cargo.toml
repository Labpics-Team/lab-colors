[package]
name = "labcolors-protocol"
publish = false
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Bounded versioned transport protocol for Lab Colors compiler operations."

[dependencies]
labcolors-core = { path = "../labcolors-core", default-features = false, features = ["wcag22-feasibility"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[features]
# Атомарная explicit-операция `wcag22-explicit-selection-v1` (#296-C2).
# Не входит в default: до #296-C3 ни один публикуемый adapter (compiler-WASM,
# UniFFI/Swift) не рекламирует capability; фичу включает только нативный
# conformance-генератор. Базовое core-ребро остаётся ровно wcag22-feasibility.
wcag22-explicit-selection = ["labcolors-core/wcag22-explicit-feasibility"]

[[test]]
name = "explicit_selection"
required-features = ["wcag22-explicit-selection"]
