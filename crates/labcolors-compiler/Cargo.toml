[package]
name = "labcolors-compiler"
publish = false
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Offline WASM compiler operations for @labpics/colors/compiler."

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
# #296-C3: compiler-роль публикует обе offline-операции — complete feasibility
labcolors-protocol = { path = "../labcolors-protocol" }
wasm-bindgen = { workspace = true }
js-sys = "0.3"

[dev-dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen-test = "0.3"

[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]
