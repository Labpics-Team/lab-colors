[package]
name = "labcolors-wasm"
publish = false
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "WASM bindings for the labcolors-core contrast engine, packaged as @labpics/colors."

[lib]
# `cdylib` is the WASM artifact wasm-pack consumes; `rlib` keeps the crate
# unit-testable with a native `cargo test`.
crate-type = ["cdylib", "rlib"]

[dependencies]
# WASM-граница владеет JS-проекциями результатов и browser bindings;
# `labcolors-core` остаётся без runtime-зависимостей.
labcolors-core = { path = "../labcolors-core", default-features = false }
wasm-bindgen = { workspace = true }
# JavaScript-объекты внешней границы.
js-sys = "0.3"
# Типизированные ошибки WASM-границы.
thiserror = "2"

# Derive the target-independent release manifest from this build's Core registry.
# Neither the release projection generator nor the JSON serializer ships in WASM.
[build-dependencies]
labcolors-conformance = { path = "../labcolors-conformance" }
serde_json = "1"

[dev-dependencies]
wasm-bindgen-test = "0.3"
labcolors-conformance = { path = "../labcolors-conformance" }
# wasm-pack invokes wasm-opt with these flags. `-Oz` optimises hard for size;
# the feature-enable flags match what modern Rust emits and 2023+ browsers run
# so the optimiser accepts the declared toolchain output.
[package.metadata.wasm-pack.profile.release]
wasm-opt = ["-Oz", "--enable-bulk-memory", "--enable-nontrapping-float-to-int"]

[features]
default = []
# Opt-in dev aid: routes Rust panics to the browser console with a readable
# stack. OFF by default and never enabled in the release bundle — production
# expected errors are returned as structured values.
console_panic = ["dep:console_error_panic_hook"]

[dependencies.console_error_panic_hook]
version = "0.1"
optional = true
